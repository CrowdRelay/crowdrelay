global:
  scrape_interval: 30s
  scrape_timeout: 10s

rule_files:
  - /etc/crowdrelay/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: crowdrelay-api
    metrics_path: /metrics
    static_configs:
      - targets: ["crowdrelay-api:8080"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
