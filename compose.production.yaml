name: crowdrelay

services:
  setup:
    image: ${CROWDRELAY_WORKER_IMAGE:-ghcr.io/wojciechbator/crowdrelay-worker}:${CROWDRELAY_IMAGE_TAG:?Set CROWDRELAY_IMAGE_TAG to sha-<full commit SHA>}
    command: ["setup"]
    env_file:
      - ${CROWDRELAY_ENV_FILE:-deploy/.env.production}
    environment:
      TOKIO_WORKER_THREADS: ${CROWDRELAY_SETUP_TOKIO_THREADS:-1}
    volumes:
      - ${CROWDRELAY_BOOTSTRAP_HOST_FILE:-./deploy/bootstrap.production.json}:/run/crowdrelay/bootstrap.json:ro
      - ${CROWDRELAY_WEBHOOK_SECRETS_HOST_FILE:-./deploy/webhook-secrets.production.json}:/run/secrets/crowdrelay-webhooks.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    restart: "no"
    networks: [runtime]

  api:
    image: ${CROWDRELAY_API_IMAGE:-ghcr.io/wojciechbator/crowdrelay-api}:${CROWDRELAY_IMAGE_TAG:?Set CROWDRELAY_IMAGE_TAG to sha-<full commit SHA>}
    env_file:
      - ${CROWDRELAY_ENV_FILE:-deploy/.env.production}
    environment:
      TOKIO_WORKER_THREADS: ${CROWDRELAY_API_TOKIO_THREADS:-2}
    depends_on:
      setup:
        condition: service_completed_successfully
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/v1/health/live"]
      interval: 20s
      timeout: 2s
      retries: 5
      start_period: 15s
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: ${CROWDRELAY_API_MEMORY:-256m}
    cpus: ${CROWDRELAY_API_CPUS:-0.75}
    stop_grace_period: 25s
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    networks:
      runtime:
        aliases: [crowdrelay-api]

  worker:
    image: ${CROWDRELAY_WORKER_IMAGE:-ghcr.io/wojciechbator/crowdrelay-worker}:${CROWDRELAY_IMAGE_TAG:?Set CROWDRELAY_IMAGE_TAG to sha-<full commit SHA>}
    command: ["run"]
    env_file:
      - ${CROWDRELAY_ENV_FILE:-deploy/.env.production}
    environment:
      TOKIO_WORKER_THREADS: ${CROWDRELAY_WORKER_TOKIO_THREADS:-1}
    volumes:
      - ${CROWDRELAY_WEBHOOK_SECRETS_HOST_FILE:-./deploy/webhook-secrets.production.json}:/run/secrets/crowdrelay-webhooks.json:ro
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      # `init: true` may make PID 1 a root-owned init process while the
      # healthcheck runs as the unprivileged CrowdRelay user. Verify the
      # actual worker executable instead of probing PID 1.
      test:
        - CMD-SHELL
        - >-
          for executable in /proc/[0-9]*/exe; do
            target=$$(readlink "$$executable" 2>/dev/null || true);
            [ "$$target" = /usr/local/bin/crowdrelay-worker ] && exit 0;
          done;
          exit 1
      interval: 15s
      timeout: 3s
      retries: 8
      start_period: 20s
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: ${CROWDRELAY_WORKER_MEMORY:-256m}
    cpus: ${CROWDRELAY_WORKER_CPUS:-0.35}
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    networks: [runtime]

networks:
  runtime:
    external: true
    name: ${CROWDRELAY_DOCKER_NETWORK:?Set CROWDRELAY_DOCKER_NETWORK}
