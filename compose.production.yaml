name: crowdrelay

services:
  postgres:
    image: ${CROWDRELAY_POSTGRES_IMAGE:-postgres:19beta3-alpine}
    container_name: crowdrelay-db
    env_file:
      - ${CROWDRELAY_ENV_FILE:-deploy/.env.production}
    shm_size: 64m
    command:
      - postgres
      - -c
      - io_method=worker
      - -c
      - io_min_workers=${CROWDRELAY_POSTGRES_IO_MIN_WORKERS:-2}
      - -c
      - io_max_workers=${CROWDRELAY_POSTGRES_IO_MAX_WORKERS:-6}
      - -c
      - effective_io_concurrency=${CROWDRELAY_POSTGRES_EFFECTIVE_IO_CONCURRENCY:-16}
      - -c
      - maintenance_io_concurrency=${CROWDRELAY_POSTGRES_MAINTENANCE_IO_CONCURRENCY:-16}
      - -c
      - max_connections=${CROWDRELAY_POSTGRES_MAX_CONNECTIONS:-40}
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - jit=off
      - -c
      - max_wal_size=512MB
      - -c
      - min_wal_size=80MB
      - -c
      - wal_compression=on
    volumes:
      - crowdrelay_postgres19:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    mem_limit: ${CROWDRELAY_POSTGRES_MEMORY:-384m}
    cpus: ${CROWDRELAY_POSTGRES_CPUS:-0.80}
    stop_grace_period: 60s
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    networks:
      runtime:
        aliases: [postgres, postgres18]
      crowdrelay-shared:
        aliases: [postgres, crowdrelay-db]
      n8n:
        aliases: [postgres]

  setup:
    image: ${CROWDRELAY_WORKER_IMAGE:-ghcr.io/crowdrelay/crowdrelay-worker}:${CROWDRELAY_IMAGE_TAG:?Set CROWDRELAY_IMAGE_TAG to sha-<full commit SHA>}
    command: ["setup"]
    env_file:
      - ${CROWDRELAY_ENV_FILE:-deploy/.env.production}
    environment:
      TOKIO_WORKER_THREADS: ${CROWDRELAY_SETUP_TOKIO_THREADS:-1}
    volumes:
      - ${CROWDRELAY_BOOTSTRAP_HOST_FILE:-./deploy/bootstrap.production.json}:/run/crowdrelay/bootstrap.json:ro
      - ${CROWDRELAY_WEBHOOK_SECRETS_HOST_FILE:-./deploy/webhook-secrets.production.json}:/run/secrets/crowdrelay-webhooks.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    restart: "no"
    networks: [runtime]

  api:
    image: ${CROWDRELAY_API_IMAGE:-ghcr.io/crowdrelay/crowdrelay-api}:${CROWDRELAY_IMAGE_TAG:?Set CROWDRELAY_IMAGE_TAG to sha-<full commit SHA>}
    labels:
      io.crowdrelay.release.ref: ${CROWDRELAY_IMAGE_TAG:?Set CROWDRELAY_IMAGE_TAG to sha-<full commit SHA>}
    env_file:
      - ${CROWDRELAY_ENV_FILE:-deploy/.env.production}
    environment:
      TOKIO_WORKER_THREADS: ${CROWDRELAY_API_TOKIO_THREADS:-2}
    depends_on:
      setup:
        condition: service_completed_successfully
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/v1/health/live"]
      interval: 20s
      timeout: 2s
      retries: 5
      start_period: 15s
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: ${CROWDRELAY_API_MEMORY:-256m}
    cpus: ${CROWDRELAY_API_CPUS:-0.75}
    stop_grace_period: 25s
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    networks:
      runtime:
        aliases: [crowdrelay-api, crowdrelay-api-active]
      crowdrelay-shared:
        aliases: [crowdrelay-api, crowdrelay-api-1]

  worker:
    image: ${CROWDRELAY_WORKER_IMAGE:-ghcr.io/crowdrelay/crowdrelay-worker}:${CROWDRELAY_IMAGE_TAG:?Set CROWDRELAY_IMAGE_TAG to sha-<full commit SHA>}
    labels:
      io.crowdrelay.release.ref: ${CROWDRELAY_IMAGE_TAG:?Set CROWDRELAY_IMAGE_TAG to sha-<full commit SHA>}
    # When CROWDRELAY_WORKER_STANDBY=true, the worker starts in standby mode
    # and waits for leadership before running background loops. The deploy
    # script sets this during blue-green cutover to prevent overlapping workers.
    command: ["run"]
    env_file:
      - ${CROWDRELAY_ENV_FILE:-deploy/.env.production}
    environment:
      TOKIO_WORKER_THREADS: ${CROWDRELAY_WORKER_TOKIO_THREADS:-1}
      # On by default, and cheap: `Backtrace::capture` is only reached for a
      # decode failure, which is a deployment defect rather than a runtime
      # condition. Without it a mismatched column type reports which column and
      # which two types disagreed, and nothing about which of ~1700 runtime
      # queries produced it — that is what left every autopilot cycle degrading
      # for hours on 2026-09-13 with no way to find the query. See `map_sqlx`
      # in crowdrelay-infra/src/database.rs.
      RUST_BACKTRACE: ${CROWDRELAY_WORKER_RUST_BACKTRACE:-1}
      # The agents service runs its own compose project and is reachable on the
      # shared network as `agent-service`. Without this the worker falls back to
      # `http://127.0.0.1:8095`, which resolves to the worker itself — so every
      # Reddit post the community executor tried would fail to connect.
      CROWDRELAY_AGENT_SERVICE_URL: ${CROWDRELAY_AGENT_SERVICE_URL:-http://agent-service:8095}
      # This key is the switch between drafting and posting. Unset, the
      # community executor runs in MANUAL MODE: it drafts the post and waits
      # for a human to publish it and register the URL. Set, it publishes
      # through the agents service's logged-in browser on its own.
      #
      # The empty default is deliberate. Letting software post to Reddit under
      # the band's own account is a decision an operator should make on
      # purpose, not something a deploy quietly turns on. It pairs with the
      # agents service's own AGENT_SERVICE_AUTH_KEY.
      CROWDRELAY_AGENT_SERVICE_AUTH_KEY: ${CROWDRELAY_AGENT_SERVICE_AUTH_KEY:-}
      # Full auto. Off by default: holding a credential is not the same as
      # being asked to publish under the band's own account, and a deploy
      # should never turn that on by itself. Both this and the key above must
      # be present before anything posts on its own.
      CROWDRELAY_COMMUNITY_AUTO_POST: ${CROWDRELAY_COMMUNITY_AUTO_POST:-false}
      # Last.fm listener counts. The growth metric sync names this variable in
      # its own failure message — "Last.fm API key not configured
      # (CROWDRELAY_LASTFM_API_KEY)" — and compose never passed it through, so
      # setting it in .env.production had no effect and the connection failed
      # every cycle while telling the operator exactly what to set.
      CROWDRELAY_LASTFM_API_KEY: ${CROWDRELAY_LASTFM_API_KEY:-}
      # Comma-separated subreddit search queries for community discovery. The
      # worker logs "reddit discovery is OFF — set
      # CROWDRELAY_DISCOVERY_REDDIT_QUERIES" on every boot, which was
      # unactionable while compose dropped the variable.
      CROWDRELAY_DISCOVERY_REDDIT_QUERIES: ${CROWDRELAY_DISCOVERY_REDDIT_QUERIES:-}
    volumes:
      - ${CROWDRELAY_FCM_SERVICE_ACCOUNT_HOST_FILE:-./secrets/virya-signal-firebase-service-account.json}:/run/secrets/firebase-service-account.json:ro
      - ${CROWDRELAY_WEBHOOK_SECRETS_HOST_FILE:-./deploy/webhook-secrets.production.json}:/run/secrets/crowdrelay-webhooks.json:ro
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      # `init: true` may make PID 1 a root-owned init process while the
      # healthcheck runs as the unprivileged CrowdRelay user. Verify the
      # actual worker executable instead of probing PID 1.
      test:
        - CMD-SHELL
        - >-
          for executable in /proc/[0-9]*/exe; do
            target=$$(readlink "$$executable" 2>/dev/null || true);
            [ "$$target" = /usr/local/bin/crowdrelay-worker ] && exit 0;
          done;
          exit 1
      interval: 15s
      timeout: 3s
      retries: 8
      start_period: 20s
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: ${CROWDRELAY_WORKER_MEMORY:-256m}
    cpus: ${CROWDRELAY_WORKER_CPUS:-0.35}
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    networks: [runtime]

networks:
  runtime:
    external: true
    name: ${CROWDRELAY_DOCKER_NETWORK:?Set CROWDRELAY_DOCKER_NETWORK}
  crowdrelay-shared:
    external: true
    name: crowdrelay-shared
  n8n:
    external: true
    name: ${VIRYA_N8N_NETWORK:-virya-n8n-cloud_virya}

volumes:
  crowdrelay_postgres19:
    external: true
    name: crowdrelay_crowdrelay_postgres19
