name: crowdrelay

services:
  setup:
    image: ${CROWDRELAY_WORKER_IMAGE:-ghcr.io/wojciechbator/crowdrelay-worker}:${CROWDRELAY_IMAGE_TAG:?Set CROWDRELAY_IMAGE_TAG to sha-<full commit SHA>}
    command: ["setup"]
    env_file:
      - ${CROWDRELAY_ENV_FILE:-deploy/.env.production}
    volumes:
      - ${CROWDRELAY_BOOTSTRAP_HOST_FILE:-./deploy/bootstrap.production.json}:/run/crowdrelay/bootstrap.json:ro
      - ${CROWDRELAY_WEBHOOK_SECRETS_HOST_FILE:-./deploy/webhook-secrets.production.json}:/run/secrets/crowdrelay-webhooks.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    networks: [runtime]

  api:
    image: ${CROWDRELAY_API_IMAGE:-ghcr.io/wojciechbator/crowdrelay-api}:${CROWDRELAY_IMAGE_TAG:?Set CROWDRELAY_IMAGE_TAG to sha-<full commit SHA>}
    env_file:
      - ${CROWDRELAY_ENV_FILE:-deploy/.env.production}
    depends_on:
      setup:
        condition: service_completed_successfully
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/v1/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 20s
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${CROWDRELAY_API_MEMORY:-256m}
    cpus: ${CROWDRELAY_API_CPUS:-0.50}
    stop_grace_period: 25s
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    networks:
      runtime:
        aliases: [crowdrelay-api]

  worker:
    image: ${CROWDRELAY_WORKER_IMAGE:-ghcr.io/wojciechbator/crowdrelay-worker}:${CROWDRELAY_IMAGE_TAG:?Set CROWDRELAY_IMAGE_TAG to sha-<full commit SHA>}
    command: ["run"]
    env_file:
      - ${CROWDRELAY_ENV_FILE:-deploy/.env.production}
    volumes:
      - ${CROWDRELAY_WEBHOOK_SECRETS_HOST_FILE:-./deploy/webhook-secrets.production.json}:/run/secrets/crowdrelay-webhooks.json:ro
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${CROWDRELAY_WORKER_MEMORY:-256m}
    cpus: ${CROWDRELAY_WORKER_CPUS:-0.50}
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    networks: [runtime]

networks:
  runtime:
    external: true
    name: ${CROWDRELAY_DOCKER_NETWORK:?Set CROWDRELAY_DOCKER_NETWORK}
