# Production overlay for docker-compose.yml.
#
# Joins the API and worker to the crowdrelay-shared external network so the
# control plane (which lives on that network) can reach them at
# crowdrelay-api-1:8080 and crowdrelay-worker-1:8080.
#
# Without this overlay, the API and worker only live on the compose-internal
# default network, and the control plane gets 503 AllSectionsFailed on every
# read-model fan-out.
#
# Usage in production:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d api worker
#
# Local dev does NOT use this file — the control plane reaches the API via
# host.docker.internal:8080 instead.

services:
  api:
    networks:
      default:
        aliases: [crowdrelay-api]
      crowdrelay-shared:
        aliases: [crowdrelay-api, crowdrelay-api-1]

  worker:
    networks:
      default:
        aliases: [crowdrelay-worker]
      crowdrelay-shared:
        aliases: [crowdrelay-worker, crowdrelay-worker-1]

networks:
  crowdrelay-shared:
    external: true
    name: crowdrelay-shared
