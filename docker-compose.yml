services:
  postgres:
    image: postgres:17-alpine
    env_file:
      - ${CROWDRELAY_ENV_FILE:-.env}
    ports:
      - "127.0.0.1:${CROWDRELAY_POSTGRES_PORT:-5432}:5432"
    volumes:
      - crowdrelay_postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: worker
    command: ["setup"]
    env_file:
      - ${CROWDRELAY_ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: "no"

  api:
    build:
      context: .
      target: api
    env_file:
      - ${CROWDRELAY_ENV_FILE:-.env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "http://127.0.0.1:8080/v1/health/ready",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.50
    stop_grace_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    env_file:
      - ${CROWDRELAY_ENV_FILE:-.env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.50
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  crowdrelay_postgres:
