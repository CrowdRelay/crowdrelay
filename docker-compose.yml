services:
  postgres:
    # Beta until 19 GA (expected Sep/Oct 2026): flip the default via
    # CROWDRELAY_POSTGRES_IMAGE or in scripts/local/pg-beta-to-ga-upgrade.sh.
    image: ${CROWDRELAY_POSTGRES_IMAGE:-postgres:19beta3-alpine}
    env_file:
      - ${CROWDRELAY_ENV_FILE:-.env}
    shm_size: 128mb
    command:
      - "postgres"
      - "-c"
      - "io_method=worker"
      - "-c"
      - "io_min_workers=${CROWDRELAY_POSTGRES_IO_MIN_WORKERS:-2}"
      - "-c"
      - "io_max_workers=${CROWDRELAY_POSTGRES_IO_MAX_WORKERS:-8}"
      - "-c"
      - "effective_io_concurrency=${CROWDRELAY_POSTGRES_EFFECTIVE_IO_CONCURRENCY:-16}"
      - "-c"
      - "maintenance_io_concurrency=${CROWDRELAY_POSTGRES_MAINTENANCE_IO_CONCURRENCY:-16}"
    ports:
      - "127.0.0.1:${CROWDRELAY_POSTGRES_PORT:-5432}:5432"
    volumes:
      - crowdrelay_postgres19:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: worker
    command: ["setup"]
    env_file:
      - ${CROWDRELAY_ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: "no"

  api:
    build:
      context: .
      target: api
    env_file:
      - ${CROWDRELAY_ENV_FILE:-.env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "http://127.0.0.1:8080/v1/health/ready",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.00
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    env_file:
      - ${CROWDRELAY_ENV_FILE:-.env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # `init: true` may make PID 1 a root-owned init process while the
      # healthcheck runs as the unprivileged CrowdRelay user. Verify the
      # actual worker executable instead of probing PID 1.
      #
      # Every `$` is doubled: Compose interpolates the string before the shell
      # sees it, so a single `$p` is substituted with the empty string and the
      # probe silently compares `readlink ""` and can never pass.
      test:
        - CMD-SHELL
        - >-
          for executable in /proc/[0-9]*/exe; do
            target=$$(readlink "$$executable" 2>/dev/null || true);
            [ "$$target" = /usr/local/bin/crowdrelay-worker ] && exit 0;
          done;
          exit 1
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./secrets:/run/secrets:ro
    mem_limit: 256m
    cpus: 1.00
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

  reddit-proxy-finder:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    env_file:
      - ${CROWDRELAY_ENV_FILE:-.env}
    environment:
      DATABASE_URL: "postgres://crowdrelay:crowdrelay-local-only@postgres:5432/crowdrelay"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

volumes:
  crowdrelay_postgres19:
