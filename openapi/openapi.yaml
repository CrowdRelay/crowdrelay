        '401': { $ref: '#/components/responses/PrivateProblem' }
        '404': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /public/cities/requests:
    post:
      operationId: requestPublicCity
      summary: Request moderation of a city not yet in the public catalogue
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, country_code]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                region: { type: [string, 'null'], maxLength: 120 }
                country_code: { type: string, pattern: '^[A-Z]{2}$' }
      responses:
        '200': { description: Existing approved city matched. }
        '202':
          description: City request accepted for moderation.
          content:
            application/json:
              schema:
                type: object
                required: [city_slug, display_name, status]
                properties:
                  city_slug: { type: string }
                  display_name: { type: string }
                  status: { type: string, enum: [pending] }
        '400': { $ref: '#/components/responses/PrivateProblem' }
        '422': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /internal/cities/{city_id}/geocode:
    post:
      operationId: geocodeInternalCity
      summary: Attach moderated coordinates to a pending or approved city
      security: [{ commerceBearer: [] }]
      parameters:
      - in: path
        name: city_id
        required: true
        schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [latitude, longitude]
              properties:
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
                canonical_name: { type: [string, 'null'], maxLength: 120 }
                region: { type: [string, 'null'], maxLength: 120 }
      responses:
        '200': { description: City coordinates updated. }
        '400': { $ref: '#/components/responses/PrivateProblem' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '404': { $ref: '#/components/responses/PrivateProblem' }
        '422': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /internal/beacon/notifications/emit-due:
    post:
      operationId: emitDueBeaconNearbyNotifications
      summary: Queue one bounded, idempotent Latarnik nearby-show wave
      description: Ranks active Beacons by show date, relevance, relationship score and distance; never fans out an unbounded contact list.
      security: [{ commerceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                limit: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200': { description: Number of newly eligible Beacon-event relationships and queued push deliveries. }
        '400': { $ref: '#/components/responses/PrivateProblem' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /internal/nearby-gigs/emit-due:
    post:
      operationId: emitDueNearbyGigs
      summary: Queue first-party nearby-gig notifications that became due
      security: [{ commerceBearer: [] }]
      responses:
        '200':
          description: Number of newly queued notifications.
          content:
            application/json:
              schema:
                type: object
                required: [queued]
                properties:
                  queued: { type: integer, format: int64, minimum: 0 }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /internal/releases/announce:
    post:
      operationId: announceInternalRelease
      summary: Validate, deduplicate and fan out a trusted provider release announcement
      description: Resolves the currently eligible Signal audience inside CrowdRelay and appends durable outbox events; n8n never receives the fan list.
      security: [{ commerceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source, source_release_id, title, release_type, release_date, listen_url]
              properties:
                source: { type: string, enum: [spotify] }
                source_release_id: { type: string, minLength: 1, maxLength: 200, pattern: '^[A-Za-z0-9_-]+$' }
                title: { type: string, minLength: 1, maxLength: 200 }
                release_type: { type: string, enum: [single, ep, album] }
                release_date: { type: string, format: date }
                listen_url: { type: string, format: uri }
                image_url: { type: [string, 'null'], format: uri }
                site_url: { type: [string, 'null'], format: uri }
                artist_name: { type: [string, 'null'], maxLength: 120 }
                total_tracks: { type: [integer, 'null'], minimum: 1, maximum: 500 }
      responses:
        '202':
          description: Announcement accepted or deduplicated.
          content:
            application/json:
              schema:
                type: object
                required: [accepted, duplicate, source_release_id, recipient_count]
                properties:
                  accepted: { type: boolean }
                  duplicate: { type: boolean }
                  source_release_id: { type: string }
                  recipient_count: { type: integer, format: int64, minimum: 0 }
        '400': { $ref: '#/components/responses/PrivateProblem' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '409': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /internal/area/players/{player_id}/challenge:
    post:
      operationId: createInternalAreaChallenge
      summary: Issue a short-lived location-proof challenge for an AREA player
      security: [{ commerceBearer: [] }]
      parameters:
      - { $ref: '#/components/parameters/AreaPlayerId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AreaChallengeRequest' }
      responses:
        '200': { description: Short-lived location-proof challenge. }
        '400': { $ref: '#/components/responses/PrivateProblem' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '404': { $ref: '#/components/responses/PrivateProblem' }
        '409': { $ref: '#/components/responses/PrivateProblem' }
        '429': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /internal/area/players/{player_id}/claim:
    post:
      operationId: claimInternalAreaDrop
      summary: Verify a location proof and idempotently claim an AREA drop
      security: [{ commerceBearer: [] }]
      parameters:
      - { $ref: '#/components/parameters/AreaPlayerId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AreaClaimRequest' }
      responses:
        '200': { description: Claim result and awarded canonical credit. }
        '400': { $ref: '#/components/responses/PrivateProblem' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '404': { $ref: '#/components/responses/PrivateProblem' }
        '409': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /internal/area/players/{player_id}/claims/import:
    post:
      operationId: importInternalAreaClaims
      summary: Idempotently import bounded legacy AREA claims
      security: [{ commerceBearer: [] }]
      parameters:
      - { $ref: '#/components/parameters/AreaPlayerId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [claims]
              properties:
                claims:
                  type: array
                  maxItems: 12
                  uniqueItems: true
                  items:
                    type: object
                    additionalProperties: false
                    required: [dropId]
                    properties:
                      dropId: { type: string }
                      claimedAt: { type: [string, 'null'], format: date-time }
                      editionNumber: { type: [integer, 'null'], minimum: 1, maximum: 500 }
      responses:
        '200': { description: Imported claims reflected in the canonical AREA wallet. }
        '400': { $ref: '#/components/responses/PrivateProblem' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '404': { $ref: '#/components/responses/PrivateProblem' }
        '409': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
components:
  headers:
    RequestId:
      description: Correlation identifier generated by the API.
      schema:
        type: string
    RedirectLocation:
      description: Absolute destination URI configured for the smart link.
      required: true
      schema:
        type: string
        format: uri
    AttributionCookie:
      description: Bounded first-party attribution cookie. It contains an opaque identifier, not personal data.
        Production responses include Secure, HttpOnly and SameSite=Lax attributes.
      required: true
      schema:
        type: string
        example: crowdrelay_attribution=opaque; Max-Age=2592000; Path=/; Secure; HttpOnly; SameSite=Lax
    ReferralCookie:
      description: First-party referral attribution cookie. It contains no personal data and is consumed during
        a later fan signup.
      required: true
      schema:
        type: string
        example: crowdrelay_referral=Fan_Code-123; Max-Age=2592000; Path=/; Secure; HttpOnly; SameSite=Lax
    FanSessionCookie:
      description: Opaque private fan session established after signup.
      required: true
      schema:
        type: string
        example: crowdrelay_fan=opaque; Max-Age=7776000; Path=/; Secure; HttpOnly; SameSite=Lax
    PrivateNoStore:
      description: Prevents storage of redirect, personal, or error responses.
      required: true
      schema:
        type: string
        const: private, no-store
    NoStore:
      description: Prevents storage of an operational or generic error response.
      required: true
      schema:
        type: string
        const: no-store
    EntityTag:
      description: Validator for this city-aggregate representation.
      required: true
      schema:
        type: string
        example: '"cities-01JXYZ"'
    PublicCityCache:
      description: Cache policy for anonymous city aggregates.
      required: true
      schema:
        type: string
        const: public, max-age=60, stale-while-revalidate=600
    PassSessionCookie:
      description: Opaque winner session established after a one-time pass claim.
      required: true
      schema:
        type: string
        example: crowdrelay_pass_session=opaque; Max-Age=1209600; Path=/; Secure; HttpOnly; SameSite=Lax
  parameters:
    AreaPlayerId:
      in: path
      name: player_id
      required: true
      schema: { type: string, format: uuid }
    ReservationId:
      in: path
      name: reservation_id
      required: true
      schema:
        type: string
        format: uuid
    DrawId:
      in: path
      name: draw_id
      required: true
      schema:
        type: string
        format: uuid
    WinnerId:
      in: path
      name: winner_id
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    synesthesiaRunBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-run-token
      description: Ephemeral bearer token returned by the Synesthesia run-start endpoint.
    fanSession:
      type: apiKey
      in: cookie
      name: crowdrelay_fan
    commerceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
    ticketOrderBearer:
      type: http
      scheme: bearer
      bearerFormat: checkout-token
    passSession:
      type: apiKey
      in: cookie
      name: crowdrelay_pass_session
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
    staffBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
    beaconBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-beacon-session
  parameters:
    SynesthesiaRunId:
      in: path
      name: run_id
      required: true
      schema:
        type: string
        format: uuid
    SynesthesiaRoomId:
      in: path
      name: room_id
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{0,127}$'
    EventSlug:
      in: path
      name: slug
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[a-z0-9][a-z0-9_-]*$'
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: Caller-generated key scoped to this write operation. The same key and payload can be retried
        safely.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    AccountingMonth:
      in: query
      name: month
      required: true
      schema:
        type: string
        pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
      example: 2026-07
    AccountingCurrency:
      in: query
      name: currency
      required: false
      schema:
        type: string
        pattern: ^[A-Z]{3}$
        default: PLN
    IfNoneMatch:
      in: header
      name: If-None-Match
      required: false
      description: ETag received with a previous cacheable public representation.
      schema:
        type: string
    AutopilotContextPath:
      in: path
      name: context
      required: true
      schema:
        type: string
        enum: [ticket_yield, fan_lifecycle, campaign_lifecycle, merchandising, merch_pricing, merch_bundle, booking_opportunity, outreach, beacon, content_supply, promotion_budget, experimentation, show_operations, release, live_opportunity, funding]
    AutopilotActionId:
      in: path
      name: action_id
      required: true
      schema: { type: string, format: uuid }
    OpsRequestId:
      in: path
      name: request_id
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[!-~]+$'
    OpsStatus:
      in: query
      name: status
      required: false
      schema:
        type: string
        enum: [pending, processing, delivered, dead]
    OpsLimit:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    DeliveryId:
      in: path
      name: delivery_id
      required: true
      schema:
        type: string
        format: uuid
    OutboxEventId:
      in: path
      name: event_id
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: RFC 9457 Problem Details response.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PrivateProblem:
      description: RFC 9457 Problem Details response containing private request context.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    CreateStaffPairingCodeRequest:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 64 }
        ttlMinutes: { type: integer, minimum: 1, maximum: 10, default: 5 }
    StaffPairingCode:
      type: object
      additionalProperties: false
      required: [version, role, displayName, pairingCode, expiresAt]
      properties:
        version: { type: integer, const: 2 }
        role: { type: string, const: staff }
        displayName: { type: string }
        pairingCode: { type: string, minLength: 24, maxLength: 128 }
        expiresAt: { type: integer, format: int64 }
    ExchangeStaffPairingCodeRequest:
      type: object
      additionalProperties: false
      required: [pairingCode]
      properties:
        pairingCode: { type: string, minLength: 24, maxLength: 128 }
    StaffDeviceSessionCredential:
      type: object
      additionalProperties: false
      required: [version, role, displayName, bearerToken, sessionId, expiresAt]
      properties:
        version: { type: integer, const: 2 }
        role: { type: string, const: staff }
        displayName: { type: string }
        bearerToken: { type: string, minLength: 24, writeOnly: true }
        sessionId: { type: string, format: uuid }
        expiresAt: { type: integer, format: int64 }
    StaffDeviceSession:
      type: object
      additionalProperties: false
      required: [id, displayName, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    StaffDeviceSessionList:
      type: object
      additionalProperties: false
      required: [sessions]
      properties:
        sessions:
          type: array
          items: { $ref: '#/components/schemas/StaffDeviceSession' }
    EcosystemMeta:
      type: object
      additionalProperties: false
      required: [apiVersion, schemaVersion, release, gitSha, buildTimestamp, minimumPostgresServerVersionNum, capabilities]
      properties:
        apiVersion: { type: string, const: '1' }
        schemaVersion: { type: integer, minimum: 36 }
        release: { type: string }
        gitSha: { type: [string, 'null'], minLength: 7, maxLength: 64 }
        buildTimestamp: { type: [string, 'null'] }
        minimumPostgresServerVersionNum: { type: integer, minimum: 180000 }
        capabilities:
          type: object
          additionalProperties: { type: boolean }
          required: [area_wallet_postgres_v2, area_vouchers_v2, area_ticket_rewards_v2, ticketing_v1]
    AreaPublicDrop:
      type: object
      additionalProperties: true
      required: [id, number, city, region, signalCitySlug, approximateLat, approximateLng, active, full, claimed]
      properties:
        id: { type: string }
        number: { type: string }
        city: { type: string }
        region: { type: string }
        signalCitySlug: { type: string }
        approximateLat: { type: number }
        approximateLng: { type: number }
        active: { type: boolean }
        full: { type: boolean }
        claimed: { type: boolean }
    AreaPublicDrops:
      type: object
      required: [items, community]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AreaPublicDrop' } }
        community: { type: object, additionalProperties: true }
    AreaVoucher:
      type: object
      additionalProperties: true
      required: [requestId, code, tokens, benefit, createdAt, expiresAt, status]
      properties:
        requestId: { type: string, format: uuid }
        code: { type: string }
        tokens: { type: integer, minimum: 1 }
        benefit: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: integer }
        status: { type: string, enum: [issued, reserved, redeemed, failed] }
    AreaTicketReward:
      type: object
      additionalProperties: true
      required: [requestId, eventSlug, credits, status]
      properties:
        requestId: { type: string, format: uuid }
        eventSlug: { type: string }
        credits: { type: integer, minimum: 1 }
        status: { type: string, enum: [reserved, issued, failed] }
        publicReference: { type: [string, 'null'] }
        issuedAt: { type: [string, 'null'], format: date-time }
    AreaWallet:
      type: object
      additionalProperties: true
      required: [authenticated, migrationRequired, legacyMigrationApplied, tokenBalance, rewardCredits, claims, vouchers, ticketRewards, drops]
      properties:
        authenticated: { type: boolean }
        migrationRequired: { type: boolean }
        legacyMigrationApplied: { type: boolean }
        tokenBalance: { type: integer, minimum: 0 }
        rewardCredits: { type: integer, minimum: 0 }
        claims: { type: array, items: { type: object, additionalProperties: true } }
        vouchers: { type: array, items: { $ref: '#/components/schemas/AreaVoucher' } }
        ticketRewards: { type: array, items: { $ref: '#/components/schemas/AreaTicketReward' } }
        drops: { type: array, items: { $ref: '#/components/schemas/AreaPublicDrop' } }
    AreaChallengeRequest:
      type: object
      additionalProperties: false
      required: [dropId]
      properties: { dropId: { type: string, pattern: '^[a-z]{3}-[0-9]{3}$' } }
    AreaPositionSample:
      type: object
      additionalProperties: false
      required: [lat, lng, accuracy, capturedAt]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        accuracy: { type: number, minimum: 0 }
        capturedAt: { type: integer, minimum: 0 }
    AreaClaimRequest:
      type: object
      additionalProperties: false
      required: [dropId, challenge, samples]
      properties:
        dropId: { type: string }
        challenge: { type: string }
        samples: { type: array, minItems: 3, maxItems: 8, items: { $ref: '#/components/schemas/AreaPositionSample' } }
    AreaLegacyWalletImportRequest:
      type: object
      additionalProperties: false
      required: [migrationId, tokenBalance]
      properties:
        migrationId: { type: string, minLength: 1, maxLength: 160 }
        tokenBalance: { type: integer, minimum: 0 }
        vouchers: { type: array, default: [], items: { type: object, additionalProperties: true } }
        ticketRewards: { type: array, default: [], items: { type: object, additionalProperties: true } }
    MerchCatalog:
      type: object
      additionalProperties: false
      required: [generated_at, products]
      properties:
        generated_at:
          type: string
          format: date-time
        products:
          type: array
          items:
            $ref: '#/components/schemas/MerchProduct'
    MerchProduct:
      type: object
      additionalProperties: false
      required: [id, slug, name, currency, price_gross_minor, active, public, variants]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9_-]*$' }
        name: { type: string }
        description: { type: [string, 'null'] }
        image_url: { type: [string, 'null'], format: uri }
        currency: { type: string, minLength: 3, maxLength: 3 }
        price_gross_minor: { type: integer, format: int64, minimum: 0 }
        active: { type: boolean }
        public: { type: boolean }
        variants:
          type: array
          items:
            $ref: '#/components/schemas/MerchVariant'
    MerchVariant:
      type: object
      additionalProperties: false
      required: [id, sku, label, attributes, active, low_stock_threshold, sell_without_stock, available, availability]
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        label: { type: string }
        attributes: { type: object, additionalProperties: true }
        active: { type: boolean }
        low_stock_threshold: { type: integer, minimum: 0 }
        sell_without_stock: { type: boolean }
        available: { type: boolean }
        on_hand: { type: integer, format: int64 }
        reserved: { type: integer, format: int64, minimum: 0 }
        available_quantity: { type: integer, format: int64 }
        availability:
          type: string
          enum: [in_stock, low_stock, out_of_stock, preorder]
    MerchCatalogUpsert:
      type: object
      additionalProperties: false
      required: [products]
      properties:
        products:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/MerchProductUpsert'
    MerchProductUpsert:
      type: object
      additionalProperties: false
      required: [slug, name, currency, price_gross_minor, active, public, variants]
      properties:
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9_-]*$' }
        name: { type: string, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 2000 }
        image_url: { type: [string, 'null'], format: uri }
        currency: { type: string, minLength: 3, maxLength: 3 }
        price_gross_minor: { type: integer, format: int64, minimum: 0 }
        active: { type: boolean }
        public: { type: boolean }
        variants:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/MerchVariantUpsert'
    MerchVariantUpsert:
      type: object
      additionalProperties: false
      required: [sku, label, attributes, active, low_stock_threshold, sell_without_stock]
      properties:
        sku: { type: string, maxLength: 128 }
        label: { type: string, maxLength: 160 }
        attributes: { type: object, additionalProperties: true }
        active: { type: boolean }
        low_stock_threshold: { type: integer, minimum: 0 }
        sell_without_stock: { type: boolean }
    InventoryActivation:
      type: object
      additionalProperties: false
