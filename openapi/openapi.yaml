        net_minor: { type: integer, format: int64 }
        vat_minor: { type: integer, format: int64 }
        stripe_fee_minor: { type: integer, format: int64 }
        stripe_net_minor: { type: integer, format: int64 }
        sale_entry_count: { type: integer, format: int64, minimum: 0 }
        refund_entry_count: { type: integer, format: int64, minimum: 0 }
        balance_entry_count: { type: integer, format: int64, minimum: 0 }
    AccountingSaleLine:
      type: object
      required: [event_id, event_title, event_starts_at, ticket_type_slug, ticket_type_name, quantity, unit_gross_minor, amount_gross_minor, amount_net_minor, amount_vat_minor, vat_rate_basis_points, currency]
