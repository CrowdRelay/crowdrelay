  /internal/communications/campaigns/{campaign_id}/deliveries/{fan_id}/claim:
    post:
      operationId: claimInternalCommunicationDelivery
      summary: Atomically claim one recipient before a non-idempotent provider send
      description: >
        First claim returns send_allowed=true. Replaying the same attempt is fail-closed
        with send_allowed=false so an ambiguous provider send is never automatically duplicated.
      security:
      - commerceBearer: []
      parameters:
      - in: path
        name: campaign_id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: fan_id
        required: true
        schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [attempt_key]
              properties:
                attempt_key: { type: string, minLength: 1, maxLength: 160 }
      responses:
        '200':
          description: Claim created or safely replayed.
          content:
            application/json:
              schema:
                type: object
                required: [delivery, send_allowed]
                properties:
                  delivery: { type: object }
                  send_allowed: { type: boolean }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /internal/communications/campaigns/{campaign_id}/deliveries/{fan_id}/result:
    post:
      operationId: reportInternalCommunicationDelivery
      summary: Persist the provider result for a previously claimed recipient
      security:
      - commerceBearer: []
      parameters:
      - in: path
        name: campaign_id
        required: true
        schema: { type: string, format: uuid }
      - in: path
