  /admin/autopilot/playlist-placements:
    post:
      operationId: recordAutopilotPlaylistPlacement
      summary: Record a placement claim, or what a public read of it found
      description: >
        The only way a playlist placement enters the system. `claimed` is the curator's word and
        counts toward nothing; `present` and `absent` are what a public read found. `unreadable`
        is deliberately its own value and advances no verification checkpoint, because a dead
        credential is not evidence that a track is gone. A confirmation that disappears inside the
        verification window settles as `withdrawn` and permanently suppresses the curator behind
        it, along with every other target sharing their identity.
      security:
      - adminBearer: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaylistPlacementRequest' }
      responses:
        '200': { description: Report accepted or replayed, content: { application/json: { schema: { $ref: '#/components/schemas/AutopilotMutation' } } } }
        '400': { $ref: '#/components/responses/PrivateProblem' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '404': { $ref: '#/components/responses/PrivateProblem' }
        '409': { $ref: '#/components/responses/PrivateProblem' }
