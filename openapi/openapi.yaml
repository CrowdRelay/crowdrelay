          type: string
          maxLength: 35
          pattern: ^(?:[A-Za-z]{2,8}|[iIxX])(?:-[A-Za-z0-9]{1,8})*$
          example: pl-PL
        referral_code:
          type: string
          minLength: 6
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
          description: Optional referral attribution. A valid active code qualifies once for the referred fan; a
            request-body value takes precedence over the first-party referral cookie.
        campaign_id:
          type: string
          format: uuid
        consent:
          type: object
          additionalProperties: false
          required:
          - marketing
          - policy_version
          properties:
            marketing:
              type: boolean
              const: true
              description: Explicit opt-in is required; inferred consent is rejected.
            policy_version:
              type: string
              minLength: 1
              maxLength: 128
    FanSignupResponse:
      type: object
      additionalProperties: false
      required:
      - fan_id
      - status
      - referral_url
      - confirmation_required
      - email_kind
      - email_queued
      - retry_after_seconds
      properties:
        fan_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
