      minProperties: 2
      maxProperties: 2
      properties:
        event_slug:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z0-9][a-z0-9_-]*$
        qr_token:
          type: string
          minLength: 1
          maxLength: 8192
        public_reference:
          type: string
          minLength: 8
          maxLength: 64
          pattern: ^[A-Za-z0-9-]+$
    AdmissionRedemptionResult:
      type: object
      additionalProperties: false
      required:
      - pass_id
      - event_id
      - public_reference
      - holder_name
      - holder_email_masked
      - status
      - redeemed_at
      properties:
        pass_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        public_reference:
          type: string
        holder_name:
          type:
          - string
          - 'null'
        holder_email_masked:
          type: string
        status:
          type: string
          enum:
          - redeemed
          - already_redeemed
          - revoked
          - expired
          - not_claimed
        redeemed_at:
          type:
          - string
          - 'null'
          format: date-time
