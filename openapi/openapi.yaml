          minimum: 1
          maximum: 500
      - in: query
        name: after_fan_id
        description: Stable fan-id cursor returned by the previous delivery-plan page.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Late-bound, consent-filtered pending delivery plan plus authoritative progress.
          content:
            application/json:
              schema:
                type: object
                required: [campaign, recipients, next_after_fan_id, delivery]
                properties:
                  campaign: { type: object }
                  recipients:
                    type: array
                    items:
                      type: object
                      required: [fan_id, email]
                      properties:
                        fan_id: { type: string, format: uuid }
                        email: { type: string, format: email }
                        display_name: { type: [string, 'null'] }
                        locale: { type: [string, 'null'] }
                  next_after_fan_id: { type: [string, 'null'], format: uuid }
                  delivery:
                    type: object
                    required: [eligible_count, pending_count, claimed_count, delivered_count, failed_count]
                    properties:
                      eligible_count: { type: integer, format: int64, minimum: 0, description: 'Current pending recipients plus all already claimed delivery attempts; completed attempts remain counted after later opt-out.' }
                      pending_count: { type: integer, format: int64, minimum: 0 }
                      claimed_count: { type: integer, format: int64, minimum: 0 }
                      delivered_count: { type: integer, format: int64, minimum: 0 }
                      failed_count: { type: integer, format: int64, minimum: 0 }
        '401':
