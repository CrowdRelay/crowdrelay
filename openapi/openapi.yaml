components:
  headers:
    RequestId:
      description: Correlation identifier generated by the API.
      schema:
        type: string
    RedirectLocation:
      description: Absolute destination URI configured for the smart link.
      required: true
      schema:
        type: string
        format: uri
    AttributionCookie:
      description: Bounded first-party attribution cookie. It contains an opaque identifier, not personal data.
        Production responses include Secure, HttpOnly and SameSite=Lax attributes.
      required: true
      schema:
        type: string
        example: crowdrelay_attribution=opaque; Max-Age=2592000; Path=/; Secure; HttpOnly; SameSite=Lax
    ReferralCookie:
      description: First-party referral attribution cookie. It contains no personal data and is consumed during
        a later fan signup.
      required: true
      schema:
        type: string
        example: crowdrelay_referral=Fan_Code-123; Max-Age=2592000; Path=/; Secure; HttpOnly; SameSite=Lax
    FanSessionCookie:
      description: Opaque private fan session established after signup.
      required: true
      schema:
        type: string
        example: crowdrelay_fan=opaque; Max-Age=7776000; Path=/; Secure; HttpOnly; SameSite=Lax
    PrivateNoStore:
      description: Prevents storage of redirect, personal, or error responses.
      required: true
      schema:
        type: string
        const: private, no-store
    NoStore:
      description: Prevents storage of an operational or generic error response.
      required: true
      schema:
        type: string
        const: no-store
    EntityTag:
      description: Validator for this city-aggregate representation.
      required: true
      schema:
        type: string
        example: '"cities-01JXYZ"'
    PublicCityCache:
      description: Cache policy for anonymous city aggregates.
      required: true
      schema:
        type: string
        const: public, max-age=60, stale-while-revalidate=600
    PassSessionCookie:
      description: Opaque winner session established after a one-time pass claim.
      required: true
      schema:
        type: string
        example: crowdrelay_pass_session=opaque; Max-Age=1209600; Path=/; Secure; HttpOnly; SameSite=Lax
  securitySchemes:
    fanSession:
      type: apiKey
      in: cookie
      name: crowdrelay_fan
    commerceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
    ticketOrderBearer:
      type: http
      scheme: bearer
      bearerFormat: checkout-token
    passSession:
      type: apiKey
      in: cookie
      name: crowdrelay_pass_session
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
    staffBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: Caller-generated key scoped to this write operation. The same key and payload can be retried
        safely.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    AccountingMonth:
      in: query
      name: month
      required: true
      schema:
        type: string
        pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
      example: 2026-07
    AccountingCurrency:
      in: query
      name: currency
      required: false
      schema:
        type: string
        pattern: ^[A-Z]{3}$
        default: PLN
    IfNoneMatch:
      in: header
      name: If-None-Match
      required: false
      description: ETag received with a previous city-aggregate representation.
      schema:
        type: string
  responses:
    Problem:
      description: RFC 9457 Problem Details response.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PrivateProblem:
      description: RFC 9457 Problem Details response containing private request context.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Health:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
          - ready
    FanSignupRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - city_slug
      - consent
      properties:
        email:
          type: string
          format: email
        display_name:
          type: string
          maxLength: 120
        city_slug:
          type: string
          maxLength: 128
          pattern: ^[a-z0-9][a-z0-9_-]*$
        locale:
          type: string
          maxLength: 35
          pattern: ^(?:[A-Za-z]{2,8}|[iIxX])(?:-[A-Za-z0-9]{1,8})*$
          example: pl-PL
        referral_code:
          type: string
          minLength: 6
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
          description: Optional referral attribution. A valid active code qualifies once for the referred fan; a
            request-body value takes precedence over the first-party referral cookie.
        campaign_id:
          type: string
          format: uuid
        consent:
          type: object
          additionalProperties: false
          required:
          - marketing
          - policy_version
          properties:
            marketing:
              type: boolean
              const: true
              description: Explicit opt-in is required; inferred consent is rejected.
            policy_version:
              type: string
              minLength: 1
              maxLength: 128
    FanSignupResponse:
      type: object
      additionalProperties: false
      required:
      - fan_id
      - status
      - referral_url
      - confirmation_required
      properties:
        fan_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - pending
          - active
        referral_url:
          type:
          - string
          - 'null'
          format: uri
        confirmation_required:
          type: boolean
    CitySignal:
      type: object
      required:
      - slug
      - name
      - country_code
      - fan_count
      properties:
        slug:
          type: string
        name:
          type: string
        country_code:
          type: string
        fan_count:
          type: integer
          minimum: 0
    ReferralProgress:
      type: object
      additionalProperties: false
      required:
      - referral_code
      - qualified_referrals
      - pending_referrals
      - draw_entries
      - coupons
      - physical_rewards
      properties:
        referral_code:
          type: string
          minLength: 6
          maxLength: 128
        qualified_referrals:
          type: integer
          minimum: 0
        pending_referrals:
          type: integer
          minimum: 0
        next_reward_threshold:
          type:
          - integer
          - 'null'
          minimum: 1
        draw_entries:
          type: array
          items:
            $ref: '#/components/schemas/WeightedDrawEntry'
        coupons:
          type: array
          items:
            $ref: '#/components/schemas/MerchCoupon'
        physical_rewards:
          type: array
          items:
            $ref: '#/components/schemas/PhysicalRewardGrant'
    WeightedDrawEntry:
      type: object
      additionalProperties: false
      required:
      - draw_id
      - slug
      - name
      - prize_kind
      - closes_at
      - draw_at
      - qualified_referrals
      - base_entries
      - referral_entries
      - concert_checkins
      - checkin_entries
      - total_entries
      - max_entries
      properties:
        draw_id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        prize_kind:
          type: string
          enum:
          - admission_pass
          - physical_item
        closes_at:
          type: string
          format: date-time
        draw_at:
          type: string
          format: date-time
        qualified_referrals:
          type: integer
          minimum: 0
        base_entries:
          type: integer
          minimum: 1
        referral_entries:
          type: integer
          minimum: 0
        concert_checkins:
          type: integer
          minimum: 0
          description: Distinct venue check-ins during this draw window.
        checkin_entries:
          type: integer
          minimum: 0
          description: Check-in contribution after applying the draw entry cap.
        total_entries:
          type: integer
          minimum: 1
        max_entries:
          type: integer
          minimum: 1
    MerchCoupon:
      type: object
      additionalProperties: false
      required:
      - id
      - reward_grant_id
      - reward_rule_id
      - code
      - discount_percent
      - max_uses
      - used_count
      - status
      properties:
        id:
          type: string
          format: uuid
        reward_grant_id:
          type: string
          format: uuid
        reward_rule_id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 8
          maxLength: 128
        discount_percent:
          type: number
          exclusiveMinimum: 0
          maximum: 100
        max_uses:
          type: integer
          minimum: 1
        used_count:
          type: integer
          minimum: 0
        status:
          type: string
          enum:
          - issued
          - redeemed
          - expired
          - revoked
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
    PhysicalRewardGrant:
      type: object
