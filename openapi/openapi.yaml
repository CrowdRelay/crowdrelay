      properties:
        sale:
          $ref: '#/components/schemas/TicketSale'
        reserved_orders:
          type: integer
          format: int64
        checkout_created_orders:
          type: integer
          format: int64
        reserved_tickets:
          type: integer
          format: int64
        paid_orders:
          type: integer
          format: int64
        paid_tickets:
          type: integer
          format: int64
        gross_sales_minor:
          type: integer
          format: int64
        refunded_minor:
          type: integer
          format: int64
        recent_orders:
          type: array
          items:
            $ref: '#/components/schemas/TicketOrder'
    StaffConcertEvent:
      type: object
      additionalProperties: false
      required:
      - id
      - slug
      - title
      - venue
      - starts_at
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        venue:
          type:
          - string
          - 'null'
        starts_at:
          type: string
          format: date-time
    ConcertQrOverview:
      type: object
      additionalProperties: false
      required:
      - events
      - campaigns
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/StaffConcertEvent'
        campaigns:
          type: array
          items:
            $ref: '#/components/schemas/ConcertQrCampaign'
    CreateConcertQrCampaignRequest:
      type: object
      additionalProperties: false
      required:
      - event_slug
      - label
      - valid_from
      - valid_until
      properties:
        event_slug:
          type: string
          minLength: 1
          maxLength: 128
        label:
          type: string
          minLength: 1
          maxLength: 160
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
          description: At most 14 days after valid_from and no later than 36 hours after the event starts.
        max_checkins:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 1000000
    ConcertQrCampaign:
      type: object
      additionalProperties: false
      required:
      - id
      - event_id
      - event_slug
      - event_title
      - venue
      - starts_at
      - label
      - valid_from
      - valid_until
      - max_checkins
      - checkin_count
      - active
      - revoked_at
      - created_at
      - token
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        event_slug:
          type: string
        event_title:
          type: string
        venue:
          type:
          - string
          - 'null'
        starts_at:
          type: string
          format: date-time
        label:
          type: string
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        max_checkins:
          type:
          - integer
          - 'null'
          minimum: 1
        checkin_count:
          type: integer
          minimum: 0
        active:
          type: boolean
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        token:
          type:
          - string
          - 'null'
          description: Signed token intended for a URL fragment. Omitted after expiry or revocation.
          maxLength: 256
    ConcertQrCampaignList:
      type: object
      additionalProperties: false
      required:
      - campaigns
      properties:
        campaigns:
          type: array
          items:
            $ref: '#/components/schemas/ConcertQrCampaign'
    ConcertCheckinRequest:
      type: object
      additionalProperties: false
      required:
      - token
      properties:
        token:
          type: string
          minLength: 80
          maxLength: 256
    ConcertCheckinResult:
      type: object
      additionalProperties: false
      required:
      - event_id
      - event_slug
      - campaign_id
      - created
      - checked_in_at
      properties:
        event_id:
          type: string
          format: uuid
        event_slug:
          type: string
        campaign_id:
          type: string
          format: uuid
        created:
          type: boolean
        checked_in_at:
          type: string
          format: date-time
    EventInterestRequest:
      type: object
      additionalProperties: false
      properties:
        campaign_id:
          type:
          - string
          - 'null'
          format: uuid
        source:
          type: string
          minLength: 1
          maxLength: 128
