    get:
      operationId: getStaffShowChecklist
      summary: Read the canonical pre-gig checklist for one show
      security: [{ staffBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/EventSlug' }]
      responses:
        '200': { description: Show identity and canonical shared checklist items. }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '404': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /staff/ecosystem/checklists/{event_slug}/{item_key}:
    post:
      operationId: updateStaffShowChecklistItem
      summary: Update one canonical pre-gig checklist item as authenticated staff
      security: [{ staffBearer: [] }]
      parameters:
      - { $ref: '#/components/parameters/EventSlug' }
      - in: path
        name: item_key
        required: true
        schema: { type: string, minLength: 1, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [pending, done, blocked, skipped] }
                note: { type: [string, 'null'], maxLength: 1000 }
      responses:
        '200': { description: Updated canonical checklist. }
        '400': { $ref: '#/components/responses/PrivateProblem' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '404': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /staff/ops/show-snapshot/{event_slug}:
    get:
      operationId: getStaffShowSnapshot
      summary: Read a metadata-only offline show snapshot for staff operations
      description: Does not expose raw ticket QR values or unmasked buyer e-mail addresses.
      security: [{ staffBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/EventSlug' }]
      responses:
        '200': { description: Bounded operational show snapshot. }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '404': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /public/cities/requests:
    post:
      operationId: requestPublicCity
      summary: Request moderation of a city not yet in the public catalogue
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, country_code]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                region: { type: [string, 'null'], maxLength: 120 }
                country_code: { type: string, pattern: '^[A-Z]{2}$' }
      responses:
        '200':
          description: Existing approved city matched.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [city_slug, display_name, status]
                properties:
                  city_slug: { type: string }
                  display_name: { type: string }
                  status: { type: string, enum: [approved] }
        '202':
          description: City request accepted for moderation. Exact idempotent replays return the same response without incrementing demand.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [city_slug, display_name, status]
                properties:
                  city_slug: { type: string }
                  display_name: { type: string }
                  status: { type: string, enum: [pending] }
        '400': { $ref: '#/components/responses/PrivateProblem' }
        '409': { $ref: '#/components/responses/PrivateProblem' }
        '422': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /internal/cities/{city_id}/geocode:
    post:
      operationId: geocodeInternalCity
      summary: Attach moderated coordinates to a pending or approved city
      security: [{ commerceBearer: [] }]
      parameters:
      - in: path
        name: city_id
        required: true
        schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [latitude, longitude]
              properties:
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
                canonical_name: { type: [string, 'null'], maxLength: 120 }
                region: { type: [string, 'null'], maxLength: 120 }
      responses:
        '200': { description: City coordinates updated. }
        '400': { $ref: '#/components/responses/PrivateProblem' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '404': { $ref: '#/components/responses/PrivateProblem' }
        '422': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /internal/beacon/network-discovery/{run_id}/candidates:
    post:
      operationId: ingestBeaconNetworkDiscoveryCandidates
      summary: Ingest public-source Latarnik candidates without granting outreach permission
      security: [{ commerceBearer: [] }]
      parameters:
      - in: path
        name: run_id
        required: true
        schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [candidates]
              properties:
                candidates:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    additionalProperties: false
                    required: [beaconKind, displayName, sourceUrl]
                    properties:
                      beaconKind: { type: string, enum: [radio, local_press, television, reviewer, creator, photographer, promoter, patron, community] }
                      displayName: { type: string, minLength: 1, maxLength: 240 }
                      contactEmail: { type: [string, 'null'], format: email, maxLength: 320 }
                      destinationUrl: { type: [string, 'null'], format: uri, maxLength: 2048 }
                      sourceUrl: { type: string, format: uri, maxLength: 2048 }
                      cityId: { type: [string, 'null'], format: uuid }
                      sourceNote: { type: [string, 'null'], maxLength: 1000 }
                      relevanceBasisPoints: { type: [integer, 'null'], minimum: 0, maximum: 10000 }
                      confidenceBasisPoints: { type: [integer, 'null'], minimum: 0, maximum: 10000 }
      responses:
        '200': { description: Candidates stored or refreshed as human-review-required and not contactable. }
        '400': { $ref: '#/components/responses/PrivateProblem' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '404': { $ref: '#/components/responses/PrivateProblem' }
        '409': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /internal/beacon/network-discovery/{run_id}/report:
    post:
      operationId: reportBeaconNetworkDiscovery
      summary: Finish a Latarnik discovery run and record the XLSX report identity
      security: [{ commerceBearer: [] }]
      parameters:
      - in: path
        name: run_id
        required: true
        schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, discoveredCount]
              properties:
                status: { type: string, enum: [ready, failed] }
                discoveredCount: { type: integer, minimum: 0 }
                reportFilename: { type: [string, 'null'], maxLength: 240 }
                reportSha256: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
                failureKind: { type: [string, 'null'], maxLength: 96 }
      responses:
        '200': { description: Discovery run finalized. }
        '400': { $ref: '#/components/responses/PrivateProblem' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '409': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /internal/beacon/invite-delivery-jobs/{job_id}/claim:
    post:
      operationId: claimBeaconInviteDeliveryJob
      summary: Claim one reviewed Latarnik invitation batch and mint response-only invite URLs
      description: A job is claimable exactly once. Plaintext invite capabilities are returned only in this response and are never stored in the outbox.
      security: [{ commerceBearer: [] }]
      parameters:
      - in: path
        name: job_id
        required: true
        schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [workerId]
              properties:
                workerId: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '200': { description: One-shot claim token plus server-owned invitation copy and response-only invite URLs. }
        '400': { $ref: '#/components/responses/PrivateProblem' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '404': { $ref: '#/components/responses/PrivateProblem' }
        '409': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /internal/beacon/invite-delivery-jobs/{job_id}/report:
    post:
      operationId: reportBeaconInviteDeliveryJob
      summary: Record terminal invitation delivery outcome without automatic resend
      security: [{ commerceBearer: [] }]
      parameters:
      - in: path
        name: job_id
        required: true
        schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [claimToken, status]
              properties:
                claimToken: { type: string, minLength: 16, maxLength: 256 }
                status: { type: string, enum: [completed, failed, ambiguous] }
                providerSummary: { type: object, additionalProperties: true, default: {} }
      responses:
        '200': { description: Terminal outcome recorded or idempotently replayed. }
        '400': { $ref: '#/components/responses/PrivateProblem' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '404': { $ref: '#/components/responses/PrivateProblem' }
        '409': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /internal/beacon/notifications/emit-due:
    post:
      operationId: emitDueBeaconNearbyNotifications
      summary: Queue one bounded, idempotent Latarnik nearby-show wave
      description: Ranks active Beacons by show date, relevance, relationship score and distance; never fans out an unbounded contact list.
      security: [{ commerceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                limit: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200': { description: Number of newly eligible Beacon-event relationships and queued push deliveries. }
        '400': { $ref: '#/components/responses/PrivateProblem' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /internal/nearby-gigs/emit-due:
    post:
      operationId: emitDueNearbyGigs
      summary: Queue first-party nearby-gig notifications that became due
      security: [{ commerceBearer: [] }]
      responses:
        '200':
          description: Number of newly queued notifications.
          content:
            application/json:
              schema:
                type: object
                required: [queued]
                properties:
                  queued: { type: integer, format: int64, minimum: 0 }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /internal/releases/announce:
    post:
      operationId: announceInternalRelease
      summary: Validate, deduplicate and fan out a trusted provider release announcement
      description: Resolves the currently eligible Signal audience inside CrowdRelay and appends durable outbox events; n8n never receives the fan list.
      security: [{ commerceBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source, source_release_id, title, release_type, release_date, listen_url]
              properties:
                source: { type: string, enum: [spotify] }
                source_release_id: { type: string, minLength: 1, maxLength: 200, pattern: '^[A-Za-z0-9_-]+$' }
                title: { type: string, minLength: 1, maxLength: 200 }
                release_type: { type: string, enum: [single, ep, album] }
                release_date: { type: string, format: date }
                listen_url: { type: string, format: uri }
                image_url: { type: [string, 'null'], format: uri }
                site_url: { type: [string, 'null'], format: uri }
                artist_name: { type: [string, 'null'], maxLength: 120 }
                total_tracks: { type: [integer, 'null'], minimum: 1, maximum: 500 }
      responses:
        '202':
          description: Announcement accepted or deduplicated.
          content:
            application/json:
              schema:
                type: object
                required: [accepted, duplicate, source_release_id, recipient_count]
                properties:
                  accepted: { type: boolean }
                  duplicate: { type: boolean }
                  source_release_id: { type: string }
                  recipient_count: { type: integer, format: int64, minimum: 0 }
        '400': { $ref: '#/components/responses/PrivateProblem' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '409': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /internal/area/players/{player_id}/challenge:
    post:
      operationId: createInternalAreaChallenge
      summary: Issue a short-lived location-proof challenge for an AREA player
      security: [{ commerceBearer: [] }]
      parameters:
      - { $ref: '#/components/parameters/AreaPlayerId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AreaChallengeRequest' }
      responses:
        '200': { description: Short-lived location-proof challenge. }
        '400': { $ref: '#/components/responses/PrivateProblem' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '404': { $ref: '#/components/responses/PrivateProblem' }
        '409': { $ref: '#/components/responses/PrivateProblem' }
        '429': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /internal/area/players/{player_id}/claim:
    post:
      operationId: claimInternalAreaDrop
      summary: Verify a location proof and idempotently claim an AREA drop
      security: [{ commerceBearer: [] }]
      parameters:
      - { $ref: '#/components/parameters/AreaPlayerId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AreaClaimRequest' }
      responses:
        '200': { description: Claim result and awarded canonical credit. }
        '400': { $ref: '#/components/responses/PrivateProblem' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '404': { $ref: '#/components/responses/PrivateProblem' }
        '409': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /internal/area/players/{player_id}/claims/import:
    post:
      operationId: importInternalAreaClaims
      summary: Idempotently import bounded legacy AREA claims
      security: [{ commerceBearer: [] }]
      parameters:
      - { $ref: '#/components/parameters/AreaPlayerId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [claims]
              properties:
                claims:
                  type: array
                  maxItems: 12
                  uniqueItems: true
                  items:
                    type: object
                    additionalProperties: false
                    required: [dropId]
                    properties:
                      dropId: { type: string }
                      claimedAt: { type: [string, 'null'], format: date-time }
                      editionNumber: { type: [integer, 'null'], minimum: 1, maximum: 500 }
      responses:
        '200': { description: Imported claims reflected in the canonical AREA wallet. }
        '400': { $ref: '#/components/responses/PrivateProblem' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '404': { $ref: '#/components/responses/PrivateProblem' }
        '409': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
components:
  headers:
    RequestId:
      description: Correlation identifier generated by the API.
      schema:
        type: string
    RedirectLocation:
      description: Absolute destination URI configured for the smart link.
      required: true
      schema:
        type: string
        format: uri
    AttributionCookie:
      description: Bounded first-party attribution cookie. It contains an opaque identifier, not personal data.
        Production responses include Secure, HttpOnly and SameSite=Lax attributes.
      required: true
      schema:
        type: string
        example: crowdrelay_attribution=opaque; Max-Age=2592000; Path=/; Secure; HttpOnly; SameSite=Lax
    ReferralCookie:
      description: First-party referral attribution cookie. It contains no personal data and is consumed during
        a later fan signup.
      required: true
      schema:
        type: string
        example: crowdrelay_referral=Fan_Code-123; Max-Age=2592000; Path=/; Secure; HttpOnly; SameSite=Lax
    FanSessionCookie:
      description: Opaque private fan session established after signup.
      required: true
      schema:
        type: string
        example: crowdrelay_fan=opaque; Max-Age=7776000; Path=/; Secure; HttpOnly; SameSite=Lax
    PrivateNoStore:
      description: Prevents storage of redirect, personal, or error responses.
      required: true
      schema:
        type: string
        const: private, no-store
    NoStore:
      description: Prevents storage of an operational or generic error response.
      required: true
      schema:
        type: string
        const: no-store
    EntityTag:
      description: Validator for this city-aggregate representation.
      required: true
      schema:
        type: string
        example: '"cities-01JXYZ"'
    PublicCityCache:
      description: Cache policy for anonymous city aggregates.
      required: true
      schema:
        type: string
        const: public, max-age=60, stale-while-revalidate=600
    PassSessionCookie:
      description: Opaque winner session established after a one-time pass claim.
      required: true
      schema:
        type: string
        example: crowdrelay_pass_session=opaque; Max-Age=1209600; Path=/; Secure; HttpOnly; SameSite=Lax
  parameters:
    AreaPlayerId:
      in: path
      name: player_id
      required: true
      schema: { type: string, format: uuid }
    ReservationId:
      in: path
      name: reservation_id
      required: true
      schema:
        type: string
        format: uuid
    DrawId:
      in: path
      name: draw_id
      required: true
      schema:
        type: string
        format: uuid
    WinnerId:
      in: path
      name: winner_id
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    synesthesiaRunBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-run-token
      description: Ephemeral bearer token returned by the Synesthesia run-start endpoint.
    fanSession:
      type: apiKey
      in: cookie
      name: crowdrelay_fan
    commerceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
    ticketOrderBearer:
      type: http
      scheme: bearer
      bearerFormat: checkout-token
    passSession:
      type: apiKey
      in: cookie
      name: crowdrelay_pass_session
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
    staffBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
    beaconBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-beacon-session
  parameters:
    SynesthesiaRunId:
      in: path
      name: run_id
      required: true
      schema:
        type: string
        format: uuid
    SynesthesiaRoomId:
      in: path
      name: room_id
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{0,127}$'
    EventSlug:
      in: path
      name: slug
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[a-z0-9][a-z0-9_-]*$'
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: Caller-generated key scoped to this write operation. The same key and payload can be retried
        safely.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    AccountingMonth:
      in: query
      name: month
      required: true
      schema:
        type: string
        pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
      example: 2026-07
    AccountingCurrency:
      in: query
      name: currency
      required: false
      schema:
        type: string
        pattern: ^[A-Z]{3}$
        default: PLN
    IfNoneMatch:
      in: header
      name: If-None-Match
      required: false
      description: ETag received with a previous cacheable public representation.
      schema:
        type: string
    AutopilotContextPath:
      in: path
      name: context
      required: true
      schema:
        $ref: '#/components/schemas/AutopilotContext'
    AutopilotActionId:
      in: path
      name: action_id
      required: true
      schema: { type: string, format: uuid }
    OpsRequestId:
      in: path
      name: request_id
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[!-~]+$'
    OpsStatus:
      in: query
      name: status
      required: false
      schema:
        type: string
        enum: [pending, processing, delivered, dead]
    OpsLimit:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    DeliveryId:
      in: path
      name: delivery_id
      required: true
      schema:
        type: string
        format: uuid
    OutboxEventId:
      in: path
      name: event_id
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: RFC 9457 Problem Details response.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PrivateProblem:
      description: RFC 9457 Problem Details response containing private request context.
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    BeaconNetworkDiscoveryRun:
      type: object
      additionalProperties: false
      required: [id, countryCode, targetCount, status, discoveredCount, requestedAt]
      properties:
        id: { type: string, format: uuid }
        countryCode: { type: string, pattern: '^[A-Z]{2}$' }
        targetCount: { type: integer, minimum: 1, maximum: 500 }
        status: { type: string, enum: [requested, running, ready, failed, cancelled] }
        discoveredCount: { type: integer, minimum: 0 }
        reportFilename: { type: [string, 'null'], maxLength: 240 }
        reportSha256: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
        requestedAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        failureKind: { type: [string, 'null'], maxLength: 96 }
    BeaconNetworkCandidate:
      type: object
      additionalProperties: false
      required: [id, displayName, beaconKind, verified, acceptsOutreach, doNotContact, metadata]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        beaconKind: { type: string }
        contactEmail: { type: [string, 'null'] }
        destinationUrl: { type: [string, 'null'], format: uri }
        sourceUrl: { type: [string, 'null'], format: uri }
        verified: { type: boolean }
        acceptsOutreach: { type: boolean }
        doNotContact: { type: boolean }
        metadata: { type: object, additionalProperties: true }
    BeaconInviteDeliveryJob:
      type: object
      additionalProperties: false
      required: [id, status, beaconCount, ttlDays, radiusKm, locale, providerSummary, exchangedCount, webCount, androidCount, iosCount, activeCount, pushEnabledCount, helpingCount, coverageCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [queued, claimed, completed, failed, ambiguous, cancelled] }
        beaconCount: { type: integer, minimum: 1, maximum: 200 }
        ttlDays: { type: integer, minimum: 1, maximum: 30 }
        radiusKm: { type: integer, minimum: 1, maximum: 500 }
        locale: { type: string }
        claimedBy: { type: [string, 'null'] }
        claimedAt: { type: [string, 'null'], format: date-time }
        claimExpiresAt: { type: [string, 'null'], format: date-time }
        reportedAt: { type: [string, 'null'], format: date-time }
        providerSummary: { type: object, additionalProperties: true }
