        stripe_checkout_session_id:
          type: string
          pattern: ^cs_[A-Za-z0-9_]+$
        stripe_payment_intent_id:
          type: string
          pattern: ^pi_[A-Za-z0-9_]+$
        payment_status:
          type: string
        amount_total_minor:
          type: integer
          format: int64
          minimum: 0
        amount_refunded_minor:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          pattern: ^[A-Za-z]{3}$
        customer_email:
          type: string
          format: email
        occurred_at:
          type: string
          format: date-time
        stripe_balance_transaction_id:
          type: string
          pattern: ^txn_[A-Za-z0-9_]+$
        stripe_fee_minor:
          type: integer
          format: int64
        stripe_net_minor:
          type: integer
          format: int64
        stripe_reporting_category:
          type: string
          maxLength: 80
          pattern: ^[A-Za-z0-9_]+$
    StripeTicketEventResponse:
      type: object
