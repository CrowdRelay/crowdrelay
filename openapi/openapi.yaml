          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [attempt_key, status]
              properties:
                attempt_key: { type: string, minLength: 1, maxLength: 160 }
                status: { type: string, enum: [delivered, failed] }
                provider_reference: { type: [string, 'null'], maxLength: 240 }
                error_code: { type: [string, 'null'], maxLength: 120 }
      responses:
        '200': { description: Delivery result stored or idempotently replayed. }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /internal/communications/campaigns/{campaign_id}/push/enqueue:
    post:
      operationId: enqueueInternalCommunicationPush
      summary: Materialize a push campaign into the durable per-device delivery ledger
      description: n8n never calls FCM/Web Push directly. CrowdRelay rechecks campaign audience, current consent and active endpoints, then the supervised push worker owns provider delivery and device acknowledgement.
      security: [{ commerceBearer: [] }]
      parameters:
      - in: path
        name: campaign_id
        required: true
        schema: { type: string, format: uuid }
      responses:
        '200':
          description: Push campaign materialized or idempotently replayed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [campaign_id, recipient_count, push_queued, failed_count, status]
                properties:
                  campaign_id: { type: string, format: uuid }
                  recipient_count: { type: integer, format: int64, minimum: 0 }
                  push_queued: { type: integer, format: int64, minimum: 0 }
                  failed_count: { type: integer, format: int64, minimum: 0 }
                  status: { type: string, const: enqueued }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '404': { $ref: '#/components/responses/PrivateProblem' }
        '409': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
