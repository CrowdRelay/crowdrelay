    get:
      operationId: getInternalCommunicationDeliveryPlan
      summary: Resolve current recipients after the campaign becomes due
      security:
      - commerceBearer: []
      parameters:
      - in: path
        name: campaign_id
        required: true
        schema:
          type: string
          format: uuid
      - in: query
