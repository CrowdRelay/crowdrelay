  /public/proofs/batches/{batch_id}:
    get:
      operationId: getExternalProofBatch
      summary: Read a public SHA-256 proof batch
      parameters:
      - in: path
        name: batch_id
        required: true
        schema: { type: string, format: uuid }
      responses:
        '200': { description: Public proof metadata. }
        '404': { $ref: '#/components/responses/Problem' }
  /public/proofs/batches/{batch_id}/{source_kind}/{source_id}:
    get:
      operationId: getExternalProofInclusion
      summary: Build and verify a Merkle inclusion path
      parameters:
      - in: path
        name: batch_id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: source_kind
        required: true
        schema: { type: string, enum: [audit_event, operator_action, reward_draw_run] }
      - in: path
        name: source_id
        required: true
        schema: { type: string, format: uuid }
      responses:
        '200': { description: Merkle path and local verification result. }
        '404': { $ref: '#/components/responses/Problem' }
