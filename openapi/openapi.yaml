  /admin/autopilot/growth-metrics/points:
    post:
      operationId: recordAutopilotGrowthMetricPoint
      summary: Record one absolute observation of a tracked metric
      description: >
        Appends one observation at the provider's own capture time. Values are absolute levels, never
        deltas. An observation already recorded at that capture time is left untouched and the
        response reports accepted=false, so a retry cannot rewrite a value a decision was already
        derived from.
      security:
      - adminBearer: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
