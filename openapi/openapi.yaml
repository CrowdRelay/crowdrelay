      - status
      - used_count
      - max_uses
      - redeemed_at
      properties:
        coupon_id:
          type: string
          format: uuid
        reward_grant_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - issued
          - redeemed
        used_count:
          type: integer
          minimum: 1
        max_uses:
          type: integer
          minimum: 1
        redeemed_at:
          type: string
          format: date-time
    Problem:
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
