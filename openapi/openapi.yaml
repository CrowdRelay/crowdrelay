  /admin/autopilot/growth-envelope:
    post:
      operationId: setGrowthEnvelope
      summary: Set the growth envelope, kill switch included
      description: >-
        The operator control for stopping the agent. `agent_enabled` is the kill
        switch and `dry_run` makes it decide everything and execute nothing.


        Deliberately a whole-envelope write rather than a patch. A partial
        update of a limit set is how one ceiling gets widened while another is
        believed tightened, and an operator stopping the agent should be stating
        the world they want rather than editing one field of the world they
        have. `expected_version` makes two operators editing at once a refusal
        instead of a silent last-writer-wins.
      security:
      - adminBearer: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrowthEnvelopeRequest' }
      responses:
