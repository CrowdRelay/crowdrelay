          minLength: 1
          maxLength: 128
          pattern: ^[a-z0-9][a-z0-9_-]*$
        qr_token:
          type: string
          minLength: 1
          maxLength: 8192
        public_reference:
          type: string
          minLength: 8
          maxLength: 64
          pattern: ^[A-Za-z0-9-]+$
