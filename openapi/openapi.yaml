          type: string
          format: date-time
    FanAccessRequest:
      type: object
      additionalProperties: false
      required:
      - email
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        locale:
          type:
          - string
          - 'null'
          maxLength: 35
    FanAccessResponse:
      type: object
      additionalProperties: false
      required:
      - accepted
      properties:
        accepted:
          type: boolean
          const: true
    FanActionRequest:
      type: object
      additionalProperties: false
      required:
      - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 4096
          description: Raw 64-character action token or a confirmation URL containing token in its query string or fragment.
    FanConfirmationResponse:
      type: object
      additionalProperties: false
      required:
      - fan_id
      - status
      - referral_url
      - fan_session_token
      - email
      properties:
        fan_id:
          type: string
          format: uuid
        status:
          type: string
          const: active
        referral_url:
          type: string
          format: uri
        fan_session_token:
          type: string
          minLength: 24
          maxLength: 4096
          description: Opaque native-client session credential. Browser clients should continue using the HttpOnly cookie.
        email:
          type: string
          format: email
          description: Canonical fan email resolved from the one-time token.
        display_name:
          type: [string, 'null']
          maxLength: 100
          description: Canonical display name stored for the confirmed fan.
    FanUnsubscribeResponse:
      type: object
      additionalProperties: false
      required:
      - fan_id
      - status
      properties:
        fan_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - unsubscribed
          - suppressed
    AdmissionPassStatus:
      type: string
      enum:
      - issued
      - claimed
      - redeemed
      - revoked
      - expired
    AdmissionPass:
      type: object
      additionalProperties: false
      required:
      - pass_id
      - session_id
      - event_id
      - event_slug
      - event_title
      - venue
      - starts_at
      - holder_name
      - holder_email_masked
      - public_reference
      - status
      - session_expires_at
      - redeemed_at
      properties:
        pass_id:
          type: string
          format: uuid
        session_id:
          type:
          - string
          - 'null'
          format: uuid
        event_id:
          type: string
          format: uuid
        event_slug:
          type: string
        event_title:
          type: string
        venue:
          type:
          - string
          - 'null'
        starts_at:
          type: string
          format: date-time
        holder_name:
          type:
          - string
          - 'null'
        holder_email_masked:
          type: string
        public_reference:
          type: string
          minLength: 8
          maxLength: 64
          pattern: ^[A-Za-z0-9-]+$
        status:
          $ref: '#/components/schemas/AdmissionPassStatus'
        session_expires_at:
          type: string
          format: date-time
        redeemed_at:
          type:
          - string
          - 'null'
          format: date-time
    IssueAdmissionPassRequest:
      type: object
      additionalProperties: false
      required:
      - event_slug
      - pool_slug
      - fan_email
      properties:
        event_slug:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z0-9][a-z0-9_-]*$
        pool_slug:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z0-9][a-z0-9_-]*$
        fan_email:
          type: string
          format: email
        claim_expires_hours:
          type: integer
          minimum: 1
          maximum: 720
          default: 72
    AdmissionPassIssued:
      type: object
      additionalProperties: false
      required:
      - pass_id
      - event_id
      - fan_id
      - public_reference
      - claim_token
      - claim_expires_at
      - created
      properties:
        pass_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        fan_id:
          type: string
          format: uuid
        public_reference:
          type: string
        claim_token:
          type: string
          minLength: 64
          maxLength: 64
        claim_expires_at:
          type: string
          format: date-time
        created:
          type: boolean
    ClaimAdmissionPassRequest:
      type: object
      additionalProperties: false
      required:
      - token
      properties:
        token:
          type: string
          minLength: 64
          maxLength: 64
          pattern: ^[A-Fa-f0-9]{64}$
    AdmissionQr:
      type: object
      additionalProperties: false
      required:
      - token
      - expires_at
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
    RedeemAdmissionPassRequest:
      type: object
      additionalProperties: false
      required:
      - event_slug
      minProperties: 2
      maxProperties: 2
      properties:
        event_slug:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z0-9][a-z0-9_-]*$
        qr_token:
          type: string
          minLength: 1
          maxLength: 8192
        public_reference:
          type: string
          minLength: 8
          maxLength: 64
          pattern: ^[A-Za-z0-9-]+$
    AdmissionRedemptionResult:
      type: object
      additionalProperties: false
      required:
      - pass_id
      - event_id
      - public_reference
      - holder_name
      - holder_email_masked
      - status
      - redeemed_at
      properties:
        pass_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        public_reference:
          type: string
        holder_name:
          type:
          - string
          - 'null'
        holder_email_masked:
          type: string
        status:
          type: string
          enum:
          - redeemed
          - already_redeemed
          - revoked
          - expired
          - not_claimed
        redeemed_at:
          type:
          - string
          - 'null'
          format: date-time
