    BookingCandidateRequest:
      type: object
      additionalProperties: false
      required: [target_kind, display_name, route_kind, route_value, source, source_reference, fit_basis_points, route_is_published]
      properties:
        target_kind:
          type: string
          enum: [venue, promoter, festival]
        display_name: { type: string, minLength: 1, maxLength: 200 }
        city_slug:
          type: string
          maxLength: 80
          description: Required for promotion — booking targets are city-scoped.
        route_kind:
          type: string
          enum: [email, submission_form, handle]
        route_value: { type: string, minLength: 1, maxLength: 2048 }
        source: { type: string, minLength: 1, maxLength: 64 }
        source_reference: { type: string, minLength: 1, maxLength: 2048 }
