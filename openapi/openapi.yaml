        event_slug:
          type: string
          minLength: 1
          maxLength: 128
        label:
          type: string
          minLength: 1
          maxLength: 160
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
          description: At most 14 days after valid_from and no later than 36 hours after the event starts.
        max_checkins:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 1000000
    ConcertQrCampaign:
      type: object
      additionalProperties: false
      required:
      - id
      - event_id
      - event_slug
      - event_title
      - venue
      - starts_at
      - label
      - valid_from
      - valid_until
      - max_checkins
      - checkin_count
      - active
      - revoked_at
      - created_at
      - token
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        event_slug:
          type: string
        event_title:
          type: string
        venue:
          type:
          - string
          - 'null'
        starts_at:
          type: string
          format: date-time
        label:
          type: string
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        max_checkins:
          type:
          - integer
          - 'null'
          minimum: 1
        checkin_count:
          type: integer
          minimum: 0
        active:
          type: boolean
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        token:
          type:
          - string
          - 'null'
