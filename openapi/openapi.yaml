                  type: string
                  pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]{0,127}$'
                destination_url:
                  type: string
                  pattern: '^https://'
                channel_source:
                  type: string
                  maxLength: 64
                channel_community:
                  type: string
                  maxLength: 120
                channel_creative:
                  type: string
                  maxLength: 120
                campaign_id:
                  type: string
                  format: uuid
