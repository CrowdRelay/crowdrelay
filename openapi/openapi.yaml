        ticket_type_name: { type: string }
        quantity: { type: integer, format: int64 }
        unit_gross_minor: { type: integer, format: int64 }
        amount_gross_minor: { type: integer, format: int64 }
        amount_net_minor: { type: integer, format: int64 }
        amount_vat_minor: { type: integer, format: int64 }
        vat_rate_basis_points: { type: integer }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    AccountingAdjustmentLine:
      type: object
      required: [event_id, event_title, event_starts_at, entry_kind, entry_count, amount_gross_minor, amount_net_minor, amount_vat_minor, vat_rate_basis_points, stripe_fee_minor, stripe_net_minor, currency]
      properties:
        event_id: { type: string, format: uuid }
        event_title: { type: string }
        event_starts_at: { type: string, format: date-time }
        entry_kind: { type: string, enum: [refund] }
        entry_count: { type: integer, format: int64 }
        amount_gross_minor: { type: integer, format: int64 }
        amount_net_minor: { type: integer, format: int64 }
        amount_vat_minor: { type: integer, format: int64 }
        vat_rate_basis_points: { type: integer }
        stripe_fee_minor: { type: integer, format: int64 }
        stripe_net_minor: { type: integer, format: int64 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    AccountingDocumentSummary:
      type: object
      required: [id, period_start, period_end, document_number, currency, gross_minor, net_minor, vat_minor, stripe_fee_minor, stripe_net_minor, finalized_at]
      properties:
        id: { type: string, format: uuid }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        document_number: { type: string }
        currency: { type: string }
        gross_minor: { type: integer, format: int64 }
        net_minor: { type: integer, format: int64 }
        vat_minor: { type: integer, format: int64 }
        stripe_fee_minor: { type: integer, format: int64 }
        stripe_net_minor: { type: integer, format: int64 }
        finalized_at: { type: string, format: date-time }
    AccountingPreview:
      type: object
      required: [period_start, period_end, currency, suggested_document_number, profile, sales, adjustments, totals, commerce_totals, invoice_request_count, finalized_document]
      properties:
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        currency: { type: string }
        suggested_document_number: { type: string }
        profile: { $ref: '#/components/schemas/AccountingProfile' }
        sales:
          type: array
          items: { $ref: '#/components/schemas/AccountingSaleLine' }
        adjustments:
          type: array
          items: { $ref: '#/components/schemas/AccountingAdjustmentLine' }
        totals: { $ref: '#/components/schemas/AccountingTotals' }
        commerce_totals: { $ref: '#/components/schemas/AccountingTotals' }
        invoice_request_count: { type: integer, minimum: 0 }
        finalized_document:
          oneOf:
          - $ref: '#/components/schemas/AccountingDocumentSummary'
          - type: 'null'
    FinalizeAccountingDocumentRequest:
      type: object
      additionalProperties: false
      required: [month, document_number]
      properties:
        month: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
        currency: { type: string, pattern: '^[A-Z]{3}$', default: PLN }
        document_number: { type: string, minLength: 1, maxLength: 100 }
    InvoiceRequest:
      type: object
      required: [order_id, order_reference, paid_at, event_title, buyer_type, address_line1, postal_code, city, country_code, buyer_email, currency, status, amount_gross_minor, amount_refunded_minor, amount_net_minor, amount_vat_minor, vat_rate_basis_points]
      properties:
        order_id: { type: string, format: uuid }
        order_reference: { type: string }
        paid_at: { type: string, format: date-time }
        event_title: { type: string }
        buyer_type: { type: string, enum: [individual, company] }
        company_name: { type: [string, 'null'] }
        tax_id: { type: [string, 'null'] }
        full_name: { type: [string, 'null'] }
        address_line1: { type: string }
        postal_code: { type: string }
        city: { type: string }
        country_code: { type: string }
        buyer_email: { type: string, format: email }
        currency: { type: string }
        status: { type: string, enum: [paid, partially_refunded, refunded] }
        amount_gross_minor: { type: integer, format: int64 }
        amount_refunded_minor: { type: integer, format: int64 }
        amount_net_minor: { type: integer, format: int64 }
        amount_vat_minor: { type: integer, format: int64 }
        vat_rate_basis_points: { type: integer }
        refunded_at: { type: [string, 'null'], format: date-time }
    StripeTicketEventRequest:
      type: object
      additionalProperties: false
      required: [stripe_event_id, event_type, occurred_at]
      properties:
        stripe_event_id:
          type: string
          pattern: ^evt_[A-Za-z0-9_]+$
        event_type:
          type: string
