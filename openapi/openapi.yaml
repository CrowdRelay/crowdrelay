          type: string
          format: uuid
        item_name:
          type: string
          minLength: 1
          maxLength: 200
        sku:
          type: string
          minLength: 1
          maxLength: 64
        status:
          type: string
          enum:
          - issued
          - fulfilled
          - expired
          - revoked
        granted_at:
          type: string
          format: date-time
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
    RedeemCouponRequest:
      type: object
      additionalProperties: false
      required:
      - code
      - order_reference
      properties:
        code:
          type: string
          minLength: 8
          maxLength: 128
        order_reference:
