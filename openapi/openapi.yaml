openapi: 3.1.0
info:
  title: CrowdRelay API
  version: 1.0.0
  description: Open-source fan acquisition, referral, rewards, event conversion and admission API.
servers:
- url: https://api.example.com/v1
  description: Replace with your production API origin.
- url: http://localhost:8080/v1
  description: Local development.
paths:
  /meta:
    get:
      operationId: getEcosystemMeta
      summary: Read the independently deployable ecosystem compatibility contract
      responses:
        '200':
          description: API, schema, release and capability metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EcosystemMeta' }
  /public/tenant/config:
    get:
      operationId: getPublicTenantConfig
      summary: Read the public tenant product, branding and regional profile
      description: Returns the startup-validated tenant profile used by first-party clients. No provider secrets or private tenant credentials are exposed.
      responses:
        '200':
          description: Public tenant configuration.
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=300, s-maxage=300
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantProfile' }
  /admin/staff/pairing-codes:
    post:
      operationId: createStaffPairingCode
      summary: Mint a one-time staff pairing code
      security: [{ adminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStaffPairingCodeRequest' }
      responses:
        '201':
          description: One-time code for a trusted staff-device QR.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffPairingCode' }
        '400': { $ref: '#/components/responses/PrivateProblem' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
  /staff-pairing/exchange:
    post:
      operationId: exchangeStaffPairingCode
      summary: Exchange a one-time pairing code for a revocable device session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExchangeStaffPairingCodeRequest' }
      responses:
        '201':
          description: New per-device staff session. The bearer is returned only once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffDeviceSessionCredential' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '429': { $ref: '#/components/responses/PrivateProblem' }
  /admin/staff/sessions:
    get:
      operationId: listStaffDeviceSessions
      summary: List staff device sessions for revocation
      security: [{ adminBearer: [] }]
      responses:
        '200':
          description: Recent staff device sessions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffDeviceSessionList' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
  /admin/staff/sessions/{session_id}/revoke:
    post:
      operationId: revokeStaffDeviceSession
      summary: Revoke one staff device session
      security: [{ adminBearer: [] }]
      parameters:
      - in: path
        name: session_id
        required: true
        schema: { type: string, format: uuid }
      responses:
        '204': { description: Device session revoked or already revoked. }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '404': { $ref: '#/components/responses/PrivateProblem' }
  /public/area/drops:
    get:
      operationId: listPublicAreaDrops
      summary: List coarse public AREA drop state without exact coordinates
      responses:
        '200':
          description: Public AREA catalogue and aggregate progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AreaPublicDrops' }
  /me/area:
    get:
      operationId: getMyAreaWallet
      summary: Read the authenticated fan AREA wallet from the canonical Postgres ledger
      security: [{ fanSession: [] }]
      responses:
        '200':
          description: Canonical AREA wallet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AreaWallet' }
  /me/area/challenge:
    post:
      operationId: createMyAreaChallenge
      security: [{ fanSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AreaChallengeRequest' }
      responses:
        '200': { description: Short-lived location proof challenge. }
        '400': { $ref: '#/components/responses/PrivateProblem' }
  /me/area/claim:
    post:
      operationId: claimMyAreaDrop
      security: [{ fanSession: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AreaClaimRequest' }
      responses:
        '200': { description: Claim result and awarded canonical credit. }
        '400': { $ref: '#/components/responses/PrivateProblem' }
  /public/push/config:
    get:
      operationId: getPublicPushConfig
      summary: Read the fail-closed fan push transport configuration
      description: Returns enabled=true only when both the runtime provider configuration and the CrowdRelay push_delivery_enabled feature flag are active.
      responses:
        '200':
          description: Push transport availability. Endpoint material and provider secrets are never returned.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [enabled, android_fcm, web_push, vapid_public_key]
                properties:
                  enabled: { type: boolean }
                  android_fcm: { type: boolean }
                  web_push: { type: boolean }
                  vapid_public_key: { type: [string, 'null'], maxLength: 256 }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /me/push/endpoints:
    post:
      operationId: registerMyPushEndpoint
      summary: Register or rotate one write-only push endpoint for the authenticated fan
      description: Registration requires an active fan session, latest marketing consent and the double push kill-switch. Re-registering an installation transfers ownership to the current fan and rotates provider endpoint material atomically.
      security: [{ fanSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [installation_id, transport, endpoint]
              properties:
                installation_id: { type: string, minLength: 8, maxLength: 160 }
                transport: { type: string, enum: [android_fcm, web_push] }
                endpoint: { type: string, minLength: 1, maxLength: 4096 }
                p256dh: { type: [string, 'null'], maxLength: 256 }
                auth: { type: [string, 'null'], maxLength: 256 }
      responses:
        '200':
          description: Endpoint accepted without echoing provider material.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [registered]
                properties: { registered: { type: boolean, const: true } }
        '400': { $ref: '#/components/responses/PrivateProblem' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '409': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /me/push/endpoints/disable:
    post:
      operationId: disableMyPushEndpoint
      summary: Disable one push installation owned by the authenticated fan
      security: [{ fanSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [installation_id, transport]
              properties:
                installation_id: { type: string, minLength: 8, maxLength: 160 }
                transport: { type: string, enum: [android_fcm, web_push] }
      responses:
        '200':
          description: Endpoint disabled or already absent.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [registered]
                properties: { registered: { type: boolean, const: false } }
        '400': { $ref: '#/components/responses/PrivateProblem' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /me/push/preferences:
    get:
      operationId: getMyPushPreferences
      summary: Read fan notification categories and quiet hours
      security: [{ fanSession: [] }]
      responses:
        '200':
          description: Current preferences; missing state uses backward-compatible defaults.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FanPushPreferences' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
    post:
      operationId: updateMyPushPreferences
      summary: Update fan notification categories and quiet hours
      security: [{ fanSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FanPushPreferencesUpdate' }
      responses:
        '200':
          description: Updated preferences.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FanPushPreferences' }
        '400': { $ref: '#/components/responses/PrivateProblem' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /public/push/deliveries/{delivery_id}/ack:
    post:
      operationId: acknowledgePushDelivery
      summary: Acknowledge that a specific device displayed a push notification
      description: The one-time acknowledgement capability is embedded only in the encrypted/data push payload. Provider HTTP acceptance alone never marks a delivery delivered.
      parameters:
      - in: path
        name: delivery_id
        required: true
        schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ack_token]
              properties:
                ack_token: { type: string, minLength: 32, maxLength: 200 }
      responses:
        '200':
          description: Device display acknowledgement recorded or idempotently replayed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties: { status: { type: string, const: delivered } }
        '400': { $ref: '#/components/responses/PrivateProblem' }
        '404': { $ref: '#/components/responses/PrivateProblem' }
        '409': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /internal/area/players:
    post:
      operationId: linkInternalAreaPlayer
      security: [{ commerceBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Linked AREA player. }
  /internal/area/players/{player_id}:
    get:
      operationId: getInternalAreaWallet
      security: [{ commerceBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/AreaPlayerId' }]
      responses:
        '200':
          description: Canonical AREA wallet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AreaWallet' }
  /internal/area/players/{player_id}/wallet/import:
    post:
      operationId: importLegacyAreaWallet
      summary: One-way idempotent import bridge from the former Netlify Blob wallet
      security: [{ commerceBearer: [] }]
      parameters:
      - { $ref: '#/components/parameters/AreaPlayerId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AreaLegacyWalletImportRequest' }
      responses:
        '200':
          description: Imported canonical wallet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AreaWallet' }
  /internal/area/players/{player_id}/vouchers:
    post:
      operationId: createInternalAreaVoucher
      security: [{ commerceBearer: [] }]
      parameters:
      - { $ref: '#/components/parameters/AreaPlayerId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: Idempotently issued voucher and debited wallet credit. }
  /internal/area/rewards/preview:
    post:
      operationId: previewInternalAreaReward
      security: [{ commerceBearer: [] }]
      responses: { '200': { description: Reward-code preview. } }
  /internal/area/rewards/reserve:
    post:
      operationId: reserveInternalAreaReward
      security: [{ commerceBearer: [] }]
      responses: { '200': { description: Leased reward-code reservation. } }
  /internal/area/rewards/attach:
    post:
      operationId: attachInternalAreaRewardCheckout
      security: [{ commerceBearer: [] }]
      responses: { '200': { description: Reward reservation attached to checkout. } }
  /internal/area/rewards/redeem:
    post:
      operationId: redeemInternalAreaReward
      security: [{ commerceBearer: [] }]
      responses: { '200': { description: Reward redeemed idempotently. } }
  /internal/area/rewards/release:
    post:
      operationId: releaseInternalAreaReward
      security: [{ commerceBearer: [] }]
      responses: { '200': { description: Reward lease released. } }
  /internal/area/players/{player_id}/ticket-rewards:
    get:
      operationId: listInternalAreaTicketRewards
      security: [{ commerceBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/AreaPlayerId' }]
      responses: { '200': { description: Ticket rewards for the player. } }
  /internal/area/players/{player_id}/ticket-rewards/reserve:
    post:
      operationId: reserveInternalAreaTicketReward
      security: [{ commerceBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/AreaPlayerId' }]
      responses: { '200': { description: Transactional credit debit and ticket-reward lease. } }
  /internal/area/players/{player_id}/ticket-rewards/finalize:
    post:
      operationId: finalizeInternalAreaTicketReward
      security: [{ commerceBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/AreaPlayerId' }]
      responses: { '200': { description: Ticket reward finalized. } }
  /internal/area/players/{player_id}/ticket-rewards/fail:
    post:
      operationId: failInternalAreaTicketReward
      security: [{ commerceBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/AreaPlayerId' }]
      responses: { '200': { description: Ticket-reward failure recorded and permanently failed credits refunded. } }
  /health/live:
    get:
      operationId: live
      responses:
        '200':
          description: Process is alive.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /health/ready:
    get:
      operationId: ready
      responses:
        '200':
          description: Service is ready.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/Problem'
  /go/{slug}:
    get:
      operationId: redirectSmartLink
      summary: Resolve a smart link
      description: Canonical public redirect route `/v1/go/{slug}`. The `/v1` prefix is supplied by the server URL.
        Redirect responses set a bounded, first-party attribution cookie and are never cacheable.
      parameters:
      - in: path
        name: slug
        required: true
        description: Workspace-unique smart-link slug.
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
      responses:
        '302':
          description: Temporary redirect to the configured destination.
          headers:
            Location:
              $ref: '#/components/headers/RedirectLocation'
            Set-Cookie:
              $ref: '#/components/headers/AttributionCookie'
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '404':
          $ref: '#/components/responses/PrivateProblem'
        '500':
          $ref: '#/components/responses/PrivateProblem'
  /fans:
    post:
      operationId: createOrUpdateFan
      summary: Create or update a consented fan relationship
      description: 'Durable, idempotent signup transaction. Production defaults to double opt-in: a pending response
        is accepted but receives no fan session until the inbox confirmation token is consumed.'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FanSignupRequest'
      responses:
        '201':
          description: Fan relationship created.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            Set-Cookie:
              $ref: '#/components/headers/FanSessionCookie'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FanSignupResponse'
        '200':
          description: Existing fan relationship updated idempotently.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            Set-Cookie:
              $ref: '#/components/headers/FanSessionCookie'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FanSignupResponse'
        '400':
          $ref: '#/components/responses/PrivateProblem'
        '404':
          $ref: '#/components/responses/PrivateProblem'
        '409':
          $ref: '#/components/responses/PrivateProblem'
        '413':
          $ref: '#/components/responses/PrivateProblem'
        '422':
          $ref: '#/components/responses/PrivateProblem'
        '503':
          $ref: '#/components/responses/PrivateProblem'
        '500':
          $ref: '#/components/responses/PrivateProblem'
        '202':
          description: Signup stored pending inbox confirmation. No fan-session cookie is issued.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FanSignupResponse'
  /fans/access:
    post:
      operationId: requestFanAccess
      summary: Request a fresh sign-in or pending-confirmation link
      description: Always returns a neutral accepted response so account existence is not disclosed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FanAccessRequest'
      responses:
        '202':
          description: Request accepted. If the address belongs to an eligible fan, a fresh access email is queued.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FanAccessResponse'
        '400':
          $ref: '#/components/responses/PrivateProblem'
        '413':
          $ref: '#/components/responses/PrivateProblem'
        '429':
          $ref: '#/components/responses/PrivateProblem'
        '422':
          $ref: '#/components/responses/PrivateProblem'
        '503':
          $ref: '#/components/responses/PrivateProblem'
        '500':
          $ref: '#/components/responses/PrivateProblem'
  /fans/confirm:
    post:
      operationId: confirmFan
      summary: Confirm inbox ownership or recover an active fan session
      description: The server derives idempotency from the action token, so clicking, scanning or pasting the same link safely replays the successful session exchange.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FanActionRequest'
      responses:
        '200':
          description: Fan activated and a private session established.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/FanSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FanConfirmationResponse'
        '400':
          $ref: '#/components/responses/PrivateProblem'
        '404':
          $ref: '#/components/responses/PrivateProblem'
        '409':
          $ref: '#/components/responses/PrivateProblem'
        '413':
          $ref: '#/components/responses/PrivateProblem'
        '429':
          $ref: '#/components/responses/PrivateProblem'
        '422':
          $ref: '#/components/responses/PrivateProblem'
        '503':
          $ref: '#/components/responses/PrivateProblem'
        '500':
          $ref: '#/components/responses/PrivateProblem'
  /fans/unsubscribe:
    post:
      operationId: unsubscribeFan
      summary: Revoke marketing consent and active fan sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FanActionRequest'
      responses:
        '200':
          description: Fan unsubscribed and the browser session removed.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/FanSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FanUnsubscribeResponse'
        '400':
          $ref: '#/components/responses/PrivateProblem'
        '404':
          $ref: '#/components/responses/PrivateProblem'
        '409':
          $ref: '#/components/responses/PrivateProblem'
        '413':
          $ref: '#/components/responses/PrivateProblem'
        '422':
          $ref: '#/components/responses/PrivateProblem'
        '503':
          $ref: '#/components/responses/PrivateProblem'
        '500':
          $ref: '#/components/responses/PrivateProblem'
  /beacon/invitations/exchange:
    post:
      operationId: exchangeBeaconSignalInvitation
      summary: Exchange a one-time Latarnik invitation for a revocable Beacon Signal session
      description: The invitation is hashed at rest, single-use and available only to an existing verified Beacon relationship.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [inviteToken]
              properties:
                inviteToken: { type: string, minLength: 24, maxLength: 128 }
                radiusKm: { type: [integer, 'null'], minimum: 10, maximum: 500 }
                locale: { type: [string, 'null'], pattern: '^[a-z]{2}(-[A-Z]{2})?$' }
                topics:
                  type: [array, 'null']
                  items: { type: string, enum: [shows, press_materials, releases, interviews, accreditation] }
                  maxItems: 5
                clientKind: { type: [string, 'null'], enum: [web, android, ios, null], default: web }
      responses:
        '201': { description: Latarnik session created; bearer token is returned once. }
        '400': { $ref: '#/components/responses/PrivateProblem' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '429': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /beacon/me:
    get:
      operationId: getBeaconSignalHome
      summary: Read the Latarnik home, nearby shows and press-room links
      security: [{ beaconBearer: [] }]
      responses:
        '200': { description: Current Beacon profile, preferences, nearby shows and press-room links. }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /beacon/me/preferences:
    post:
      operationId: updateBeaconSignalPreferences
      summary: Update Latarnik distance, locale, topics or nearby-show notification preference
      security: [{ beaconBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                radiusKm: { type: [integer, 'null'], minimum: 10, maximum: 500 }
                locale: { type: [string, 'null'], pattern: '^[a-z]{2}(-[A-Z]{2})?$' }
                topics:
                  type: [array, 'null']
                  items: { type: string, enum: [shows, press_materials, releases, interviews, accreditation] }
                  maxItems: 5
                nearbyGigsEnabled: { type: [boolean, 'null'] }
              minProperties: 1
      responses:
        '200': { description: Updated Latarnik preferences. }
        '400': { $ref: '#/components/responses/PrivateProblem' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /beacon/me/releases:
    get:
      operationId: listBeaconPhysicalReleases
      summary: List physical Virya releases allocated to the authenticated Latarnik
      security: [{ beaconBearer: [] }]
      responses:
        '200':
          description: Physical-release campaigns and the Latarnik fulfillment state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BeaconMemberReleaseCampaigns' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /beacon/me/releases/{campaign_id}/delivery:
    post:
      operationId: confirmBeaconPhysicalReleaseDelivery
      summary: Confirm one release recipient and Paczkomat destination
      security: [{ beaconBearer: [] }]
      parameters:
      - in: path
        name: campaign_id
        required: true
        schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [recipientName, recipientPhone, parcelLockerCode]
              properties:
