    PlayRecordCounts:
      type: object
      additionalProperties: false
      required: [improved, neutral, worsened, insufficient, consecutive_worsened, operator_retired]
      description: >
        The measured record, as counts rather than a score, so a standing can be argued with.
        `insufficient` is reported and deliberately excluded from every calculation: an outcome
        nobody could measure is not an outcome that failed.
      properties:
        improved: { type: integer, minimum: 0 }
        neutral: { type: integer, minimum: 0 }
        worsened: { type: integer, minimum: 0 }
        insufficient: { type: integer, minimum: 0 }
        consecutive_worsened: { type: integer, minimum: 0 }
        operator_retired: { type: boolean }
    PlayStanding:
      type: object
      additionalProperties: true
      required: [standing]
      description: >
        `untested` runs at full reach; `weighted` narrows the play's recipient ceiling in
        proportion to its record and never widens it; `retired` is proposed no longer, with the
        reason stated. Nothing here touches authority — the context ladder, the class ceiling and
        the growth envelope move only when a human moves them.
      properties:
        standing: { type: string, enum: [untested, weighted, retired] }
        measured: { type: integer, minimum: 0 }
        basis_points: { type: integer, minimum: 0, maximum: 10000 }
        reason: { type: string, enum: [repeatedly_worsened, operator_retired] }
    PlayKindStanding:
      type: object
      additionalProperties: false
      required: [kind, record, standing, effective_max_recipients_per_step]
      properties:
