openapi: 3.1.0
info:
  title: CrowdRelay API
  version: 0.1.0
  description: Open-source fan acquisition, referral, rewards, event conversion and admission API.
servers:
- url: https://api.example.com/v1
  description: Replace with your production API origin.
- url: http://localhost:8080/v1
  description: Local development.
paths:
  /health/live:
    get:
      operationId: live
      responses:
        '200':
          description: Process is alive.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /health/ready:
    get:
      operationId: ready
      responses:
        '200':
          description: Service is ready.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/Problem'
  /go/{slug}:
    get:
      operationId: redirectSmartLink
      summary: Resolve a smart link
      description: Canonical public redirect route `/v1/go/{slug}`. The `/v1` prefix is supplied by the server URL.
        Redirect responses set a bounded, first-party attribution cookie and are never cacheable.
      parameters:
      - in: path
        name: slug
        required: true
        description: Workspace-unique smart-link slug.
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
      responses:
        '302':
          description: Temporary redirect to the configured destination.
          headers:
            Location:
              $ref: '#/components/headers/RedirectLocation'
            Set-Cookie:
              $ref: '#/components/headers/AttributionCookie'
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '404':
          $ref: '#/components/responses/PrivateProblem'
        '500':
          $ref: '#/components/responses/PrivateProblem'
  /fans:
    post:
      operationId: createOrUpdateFan
      summary: Create or update a consented fan relationship
      description: 'Durable, idempotent signup transaction. Production defaults to double opt-in: a pending response
        is accepted but receives no fan session until the inbox confirmation token is consumed.'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FanSignupRequest'
      responses:
        '201':
          description: Fan relationship created.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            Set-Cookie:
              $ref: '#/components/headers/FanSessionCookie'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FanSignupResponse'
        '200':
          description: Existing fan relationship updated idempotently.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            Set-Cookie:
              $ref: '#/components/headers/FanSessionCookie'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FanSignupResponse'
        '400':
          $ref: '#/components/responses/PrivateProblem'
        '404':
          $ref: '#/components/responses/PrivateProblem'
        '409':
          $ref: '#/components/responses/PrivateProblem'
        '413':
          $ref: '#/components/responses/PrivateProblem'
        '422':
          $ref: '#/components/responses/PrivateProblem'
        '503':
          $ref: '#/components/responses/PrivateProblem'
        '500':
          $ref: '#/components/responses/PrivateProblem'
        '202':
          description: Signup stored pending inbox confirmation. No fan-session cookie is issued.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FanSignupResponse'
  /fans/confirm:
    post:
      operationId: confirmFan
      summary: Confirm inbox ownership and activate a pending fan
      description: Idempotently exchanges the one-time token. Retry with the same key after a timeout or lost response.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FanActionRequest'
      responses:
        '200':
          description: Fan activated and a private session established.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/FanSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FanConfirmationResponse'
        '400':
          $ref: '#/components/responses/PrivateProblem'
        '404':
          $ref: '#/components/responses/PrivateProblem'
        '409':
          $ref: '#/components/responses/PrivateProblem'
        '413':
          $ref: '#/components/responses/PrivateProblem'
        '422':
          $ref: '#/components/responses/PrivateProblem'
        '503':
          $ref: '#/components/responses/PrivateProblem'
        '500':
          $ref: '#/components/responses/PrivateProblem'
  /fans/unsubscribe:
    post:
      operationId: unsubscribeFan
      summary: Revoke marketing consent and active fan sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FanActionRequest'
      responses:
        '200':
          description: Fan unsubscribed and the browser session removed.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/FanSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FanUnsubscribeResponse'
        '400':
          $ref: '#/components/responses/PrivateProblem'
        '404':
          $ref: '#/components/responses/PrivateProblem'
        '409':
          $ref: '#/components/responses/PrivateProblem'
        '413':
          $ref: '#/components/responses/PrivateProblem'
        '422':
          $ref: '#/components/responses/PrivateProblem'
        '503':
          $ref: '#/components/responses/PrivateProblem'
        '500':
          $ref: '#/components/responses/PrivateProblem'
  /public/cities:
    get:
      operationId: listPublicCities
      summary: List public city-demand aggregates
      description: Returns anonymous, precomputed city counts. Clients may revalidate a cached representation with
        If-None-Match.
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Public city demand ranking.
          headers:
            ETag:
              $ref: '#/components/headers/EntityTag'
            Cache-Control:
              $ref: '#/components/headers/PublicCityCache'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CitySignal'
        '304':
          description: Cached representation is still current.
          headers:
            ETag:
              $ref: '#/components/headers/EntityTag'
            Cache-Control:
              $ref: '#/components/headers/PublicCityCache'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /r/{code}:
    get:
      operationId: redirectReferral
      summary: Capture an active referral and redirect to the first-party join page
      parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
          minLength: 6
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
      responses:
        '302':
          description: Referral cookie established and client redirected to the join page.
          headers:
            Location:
              $ref: '#/components/headers/RedirectLocation'
            Set-Cookie:
              $ref: '#/components/headers/ReferralCookie'
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '404':
          $ref: '#/components/responses/PrivateProblem'
        '503':
          $ref: '#/components/responses/PrivateProblem'
        '500':
          $ref: '#/components/responses/PrivateProblem'
  /me/referral:
    get:
      operationId: getMyReferralProgress
      summary: Read private referral progress and issued merch coupons
      security:
      - fanSession: []
      responses:
        '200':
          description: Private referral progress for the authenticated fan.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralProgress'
        '401':
          $ref: '#/components/responses/PrivateProblem'
        '503':
          $ref: '#/components/responses/PrivateProblem'
        '500':
          $ref: '#/components/responses/PrivateProblem'
  /commerce/coupons/redeem:
    post:
      operationId: redeemMerchCoupon
      summary: Atomically consume one coupon use after a commerce order
      security:
      - commerceBearer: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemCouponRequest'
      responses:
        '200':
          description: Coupon use recorded idempotently.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required:
                - result
                properties:
                  result:
                    $ref: '#/components/schemas/CouponRedemptionResult'
        '400':
          $ref: '#/components/responses/PrivateProblem'
        '401':
          $ref: '#/components/responses/PrivateProblem'
        '404':
          $ref: '#/components/responses/PrivateProblem'
        '409':
          $ref: '#/components/responses/PrivateProblem'
        '422':
          $ref: '#/components/responses/PrivateProblem'
        '503':
          $ref: '#/components/responses/PrivateProblem'
        '500':
          $ref: '#/components/responses/PrivateProblem'
  /staff/coupons/redeem:
    post:
      operationId: staffRedeemMerchCoupon
      summary: Atomically consume one coupon use at the merch desk
      security:
      - staffBearer: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemCouponRequest'
      responses:
        '200':
          description: Coupon use recorded idempotently.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: '#/components/schemas/CouponRedemptionResult'
        '400':
          $ref: '#/components/responses/PrivateProblem'
        '401':
          $ref: '#/components/responses/PrivateProblem'
        '404':
          $ref: '#/components/responses/PrivateProblem'
        '409':
          $ref: '#/components/responses/PrivateProblem'
        '422':
          $ref: '#/components/responses/PrivateProblem'
        '503':
          $ref: '#/components/responses/PrivateProblem'
        '500':
          $ref: '#/components/responses/PrivateProblem'
  /public/events:
    get:
      operationId: listPublicEvents
      summary: List published upcoming events
      parameters:
      - &id006
        in: query
        name: limit
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: Published events ordered by start time.
          headers:
            Cache-Control: &id001
              schema:
                type: string
                example: public, max-age=60, stale-while-revalidate=600
            ETag:
              schema:
                type: string
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '304':
          description: Cached representation is still current.
        '400': &id002
          $ref: '#/components/responses/Problem'
  /public/events/{slug}:
    get:
      operationId: getPublicEvent
      summary: Get one published event
      parameters:
      - &id003
        in: path
        name: slug
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z0-9][a-z0-9_-]*$
      responses:
        '200':
          description: Published event.
          headers:
            Cache-Control: *id001
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEvent'
        '304':
          description: Cached representation is still current.
        '404': *id002
  /public/events/{slug}/tickets:
    get:
      operationId: getEventTicketSale
      summary: Get the first-party ticket offer for one published event
      parameters:
      - in: path
        name: slug
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z0-9][a-z0-9_-]*$
      responses:
        '200':
          description: Current ticket inventory and server-authoritative gross prices.
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=30, s-maxage=60, stale-while-revalidate=120
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketSale'
        '404':
          $ref: '#/components/responses/PrivateProblem'
        '503':
          $ref: '#/components/responses/PrivateProblem'
  /public/events/{slug}/ticket-orders:
    post:
      operationId: reserveEventTickets
      summary: Reserve shared admission capacity before Stripe Checkout is created
      description: Prices and VAT are read from the configured sale. The request is safe to retry with the same Idempotency-Key and identical body.
      parameters:
      - in: path
        name: slug
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z0-9][a-z0-9_-]*$
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReserveTicketOrderRequest'
      responses:
        '201':
          description: Durable inventory hold created.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketReservation'
        '400':
          $ref: '#/components/responses/PrivateProblem'
        '404':
          $ref: '#/components/responses/PrivateProblem'
        '409':
          $ref: '#/components/responses/PrivateProblem'
        '422':
          $ref: '#/components/responses/PrivateProblem'
        '503':
          $ref: '#/components/responses/PrivateProblem'
  /public/ticket-orders/{order_id}:
    get:
      operationId: getTicketOrder
      summary: Read one private ticket order with its checkout bearer token
      security:
      - ticketOrderBearer: []
      parameters:
      - in: path
        name: order_id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Private order status and issued ticket references.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketOrder'
        '401':
          $ref: '#/components/responses/PrivateProblem'
        '404':
          $ref: '#/components/responses/PrivateProblem'
        '503':
          $ref: '#/components/responses/PrivateProblem'
  /public/ticket-orders/{order_id}/wallet:
    get:
      operationId: getTicketWallet
      summary: Read one paid ticket wallet with durable signed QR credentials
      security:
      - ticketOrderBearer: []
      parameters:
      - in: path
        name: order_id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Private order details and current ticket QR credentials.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketWallet'
        '401':
          $ref: '#/components/responses/PrivateProblem'
        '404':
          $ref: '#/components/responses/PrivateProblem'
        '409':
          $ref: '#/components/responses/PrivateProblem'
        '503':
          $ref: '#/components/responses/PrivateProblem'
  /public/ticket-orders/{order_id}/delivery-requests:
    post:
      operationId: requestTicketDelivery
      summary: Queue an idempotent resend of all active tickets to the buyer e-mail
      security:
      - ticketOrderBearer: []
      parameters:
      - in: path
        name: order_id
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Ticket delivery was queued or recognized as an identical replay.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDeliveryRequest'
        '400':
          $ref: '#/components/responses/PrivateProblem'
        '401':
          $ref: '#/components/responses/PrivateProblem'
        '404':
          $ref: '#/components/responses/PrivateProblem'
        '409':
          $ref: '#/components/responses/PrivateProblem'
        '503':
          $ref: '#/components/responses/PrivateProblem'
  /staff/events/{slug}/ticketing:
    get:
      operationId: getStaffEventTicketingOverview
      summary: Get read-only sale totals, inventory and recent orders
      security:
      - staffBearer: []
      parameters:
      - in: path
        name: slug
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      responses:
        '200':
          description: Ticketing operational overview.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTicketingOverview'
        '401':
          $ref: '#/components/responses/PrivateProblem'
        '404':
          $ref: '#/components/responses/PrivateProblem'
        '503':
          $ref: '#/components/responses/PrivateProblem'
  /admin/events/{slug}/ticketing:
    get:
      operationId: getEventTicketingOverview
      summary: Get sale configuration, revenue totals and recent orders
      security:
      - adminBearer: []
      parameters:
      - in: path
        name: slug
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      responses:
        '200':
          description: Ticketing operational overview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTicketingOverview'
        '401':
          $ref: '#/components/responses/PrivateProblem'
        '404':
          $ref: '#/components/responses/PrivateProblem'
        '503':
          $ref: '#/components/responses/PrivateProblem'
    post:
      operationId: configureEventTicketing
      summary: Create or update one future event sale and its price tiers
      security:
      - adminBearer: []
      parameters:
      - in: path
        name: slug
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigureTicketSaleRequest'
      responses:
        '200':
          description: Sale configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketSale'
        '401':
          $ref: '#/components/responses/PrivateProblem'
        '404':
          $ref: '#/components/responses/PrivateProblem'
        '409':
          $ref: '#/components/responses/PrivateProblem'
        '422':
          $ref: '#/components/responses/PrivateProblem'
        '503':
          $ref: '#/components/responses/PrivateProblem'
  /internal/ticket-orders/{order_id}/stripe-checkout:
    post:
      operationId: bindTicketOrderStripeCheckout
      summary: Bind a durable reservation to exactly one Stripe Checkout Session
      security:
      - commerceBearer: []
      parameters:
      - in: path
        name: order_id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindStripeCheckoutRequest'
      responses:
        '200':
          description: Checkout binding stored idempotently.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StripeCheckoutBinding'
        '401':
          $ref: '#/components/responses/PrivateProblem'
        '404':
          $ref: '#/components/responses/PrivateProblem'
        '409':
          $ref: '#/components/responses/PrivateProblem'
        '422':
          $ref: '#/components/responses/PrivateProblem'
        '503':
          $ref: '#/components/responses/PrivateProblem'
  /internal/ticket-orders/{order_id}/cancel:
    post:
      operationId: cancelTicketOrderReservation
      summary: Cancel an unpaid ticket order and release shared admission capacity
      security:
      - commerceBearer: []
      parameters:
      - in: path
        name: order_id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelTicketOrderRequest'
      responses:
        '200':
          description: Reservation cancelled or already released.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketOrder'
        '401':
          $ref: '#/components/responses/PrivateProblem'
        '404':
          $ref: '#/components/responses/PrivateProblem'
        '409':
          $ref: '#/components/responses/PrivateProblem'
        '422':
          $ref: '#/components/responses/PrivateProblem'
        '503':
          $ref: '#/components/responses/PrivateProblem'
  /internal/ticket-orders/stripe-events:
    post:
      operationId: reconcileTicketStripeEvent
      summary: Apply one signature-verified Stripe transition to a ticket order
      description: Called only by the Virya server after verifying Stripe's signature against the unmodified raw request body.
      security:
      - commerceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StripeTicketEventRequest'
      responses:
        '200':
          description: Event committed or recognized as an identical replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StripeTicketEventResponse'
        '401':
          $ref: '#/components/responses/PrivateProblem'
        '404':
          $ref: '#/components/responses/PrivateProblem'
        '409':
          $ref: '#/components/responses/PrivateProblem'
        '422':
          $ref: '#/components/responses/PrivateProblem'
        '503':
          $ref: '#/components/responses/PrivateProblem'
  /internal/events/{event_id}/copy-enrichment:
    post:
      operationId: applyEventCopyEnrichment
      summary: Apply one content-addressed AI event description candidate
      description: The candidate is published only if the Bandsintown source hash is still current and no manual description exists.
      security:
      - commerceBearer: []
      parameters:
      - in: path
        name: event_id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyEventCopyRequest'
      responses:
        '200':
          description: Candidate applied, recognized as a replay, or marked stale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyEventCopyResponse'
        '400':
          $ref: '#/components/responses/PrivateProblem'
        '401':
          $ref: '#/components/responses/PrivateProblem'
        '404':
          $ref: '#/components/responses/PrivateProblem'
