          type: string
          maxLength: 4000
          description: Verbatim published text the route was read from; refused without it.
        fit_basis_points: { type: integer, minimum: 0, maximum: 10000 }
        paid_to_apply:
          type: boolean
          description: The adapter's raw signal. A pay-to-play demand is a permanent refusal.
        route_is_published:
          type: boolean
          description: False means the route was inferred — also permanent.
        capacity: { type: integer, minimum: 1 }

