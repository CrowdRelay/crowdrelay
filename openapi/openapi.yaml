        minimum_confidence_basis_points: { type: integer, minimum: 0, maximum: 10000 }
        max_actions_24h: { type: integer, minimum: 1, maximum: 1000 }
        expected_version: { type: integer, format: int64, minimum: 1 }
        config:
          type: object
          description: >
            Optional domain-policy knobs for this context (screening floors, lead
            windows, cooldowns), validated against the same typed config the
            decision reader parses — an unknown key is refused here rather than
            stored and silently ignored. Absent leaves the stored knobs alone;
            an empty object resets them to defaults. This is how parameters are
            tuned from the control plane without code changes.
