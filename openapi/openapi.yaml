  /internal/autopilot/outreach/candidates:
    post:
      operationId: reportOutreachSweep
      summary: Report an executor's discovery sweep
      description: >-
        The executor-facing half of candidate ingestion. Discovery is executor
        work, so it uses the commerce key rather than the admin key: requiring
        the latter would hand an adapter authority over every admin route in
        order to post a list of playlist contacts.


        Unlike the admin route this accepts an **empty** `candidates` array. A
        sweep that read published text and found no usable route is a real
        answer, and it is the one the barren-sweep back-off is built on:
        CrowdRelay tells a dry source from an adapter that never came back by
        whether an ingestion happened at all, and both cases leave zero
        candidate rows. An adapter that returns silently keeps the request alive
        for ever instead of backing it off.


        Send `sweep` wherever the adapter can count what it read. It is what
        separates a source with nothing to give from a read path that returned
        nothing at all, and only the first is worth calling exhausted.
      security:
      - commerceBearer: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OutreachSweepBatchRequest' }
      responses:
        '200':
          description: Sweep recorded and every candidate screened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutreachCandidateIngestion' }
        '400': { $ref: '#/components/responses/PrivateProblem' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /internal/autopilot/outreach/delivery-faults:
    post:
      operationId: recordAutopilotDeliveryFault
      summary: Record one delivery fault reported by the sending provider
      description: >-
        The ear half of deliverability. Bounces and spam complaints are the one
        number that should stop a wave, and they were invisible until now: a
        rate nothing records cannot halt anything.


        One row per fault, deduplicated on `provider_reference`, so a retried
        webhook is a replay rather than a second count. A hard bounce also
        finishes the address through the suppression that already exists —
        retrying an address that does not exist is how a sender comes to look
        like somebody working from a bought list.


        The ceiling these rates close lives in `crowdrelay_domain::
        deliverability` and bites before the next send, not in a digest
        afterwards.
      security:
      - commerceBearer: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeliveryFaultRequest' }
      responses:
        '200':
          description: Fault recorded or idempotently replayed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutopilotMutation' }
        '400': { $ref: '#/components/responses/PrivateProblem' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '404': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /admin/autopilot/booking-discovery/candidates:
    post:
      operationId: ingestAutopilotBookingCandidates
      summary: Ingest discovered venue/promoter prospects, screened on write
      description: >-
        The booking pipeline's supply. Candidates arrive from an adapter sweep
        or an operator import and are screened against a closed refusal set in
        the same transaction — an inferred route, missing evidence or a
        pay-to-play demand is durable knowledge, so no sweep rediscovers it.
        Deduplicated on contact identity: one inbox is one prospect however
        many sources found it. A candidate is not a target; promotion is the
        operator's confirm call.
      security:
      - adminBearer: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
