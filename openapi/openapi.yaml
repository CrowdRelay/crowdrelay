          items: { $ref: '#/components/schemas/ChiefOfStaffAttentionItem' }
        top_opportunities:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/ChiefOfStaffOpportunity' }
        show_tasks:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/ChiefOfStaffShowTask' }
        acted_alone_24h:
          description: What the agent did with nobody watching, grouped by action kind.
          type: array
          maxItems: 60
          items: { $ref: '#/components/schemas/ChiefOfStaffActivity' }
        about_to_act:
          description: What it will do next unless somebody stops it.
          type: array
          maxItems: 60
          items: { $ref: '#/components/schemas/ChiefOfStaffActivity' }
        parked_for_approval:
          description: What it will not do until somebody says yes.
          type: array
          maxItems: 60
          items: { $ref: '#/components/schemas/ChiefOfStaffActivity' }
        stopped:
          description: >
            What the agent stopped and why, with every reason reported verbatim rather than
            summarised. This is the agent reporting its own gaps; no other section covers it.
          type: array
          maxItems: 40
          items: { $ref: '#/components/schemas/ChiefOfStaffStopped' }
        moved:
          description: >
            What moved, with the strength of the claim attached to every number. Only settled,
            measured outcomes appear — a claim that could not be made is reported under `stopped`.
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/ChiefOfStaffMovement' }
        objectives_at_risk:
          description: >
            Declared targets that are behind or already missed. A target being met is good news
            that can wait for somebody to look; one nobody can measure is a gap and is reported
            under `stopped` instead.
          type: array
          maxItems: 64
          items: { $ref: '#/components/schemas/ChiefOfStaffObjective' }
