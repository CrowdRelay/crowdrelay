      properties:
        play_id: { type: string, format: uuid }
        kind: { type: string, enum: [track_us_ask, listing_completeness_sweep, follow_ask_ladder, dormant_revival] }
        anchor:
          oneOf:
            - type: object
              additionalProperties: false
              required: [kind, event_id]
              properties:
                kind: { type: string, enum: [event] }
                event_id: { type: string, format: uuid }
            - type: object
              additionalProperties: false
              required: [kind, fan_id]
              properties:
                kind: { type: string, enum: [fan] }
                fan_id: { type: string, format: uuid }
          description: >
            What the play hangs off. A show for the show-timed plays, and one fan for the
            follow-ask ladder, which is climbed by a person rather than scheduled around a date.
        anchor_at: { type: string, format: date-time }
        hypothesis: { type: string, maxLength: 400 }
        state: { type: string, enum: [running, completed] }
        started_at: { type: string, format: date-time }
