          - string
          - 'null'
        timezone:
          type: string
        starts_at:
          type: string
          format: date-time
        doors_at:
          type:
          - string
          - 'null'
          format: date-time
        ends_at:
          type:
          - string
          - 'null'
          format: date-time
        ticket_url:
          type:
          - string
          - 'null'
