        '400': { $ref: '#/components/responses/PrivateProblem' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '404': { $ref: '#/components/responses/PrivateProblem' }
        '409': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /admin/autopilot/outreach/candidates:
    post:
      operationId: ingestAutopilotOutreachCandidates
      summary: Ingest a screened batch of discovered outreach candidates
      description: >-
        Candidates arrive unverified and carry the evidence a submission route
        was read out of. CrowdRelay screens each one on write and stores the
        verdict, so a refusal is durable and the same candidate is never
        rediscovered and re-judged. A candidate is not a target: promotion needs
        an operator to confirm the route.
      security:
      - adminBearer: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OutreachCandidateBatchRequest' }
      responses:
        '200': { description: Batch screened and stored or replayed, content: { application/json: { schema: { $ref: '#/components/schemas/OutreachCandidateIngestion' } } } }
        '400': { $ref: '#/components/responses/PrivateProblem' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '404': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
    get:
      operationId: listAutopilotOutreachCandidates
      summary: The operator's screening queue
      description: >-
        The contact route itself never travels in the list: judging evidence
        does not need the address, and this view is read far more often than it
        is acted on.
      security:
      - adminBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema: { type: string, enum: [admitted, promoted, refused] }
      - name: limit
        in: query
        required: false
        schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200': { description: Candidates, content: { application/json: { schema: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/OutreachCandidateView' } } } } }
        '400': { $ref: '#/components/responses/PrivateProblem' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /admin/autopilot/outreach/candidates/{candidate_id}/confirm:
    post:
      operationId: confirmAutopilotOutreachCandidate
      summary: Confirm a candidate's route and promote it to an outreach target
      description: >-
        Only an admitted candidate can be confirmed; a refusal is a screening
        decision, not a warning to click through. A form or handle route stays a
        candidate and returns no target, because a target carries an address.
      security:
      - adminBearer: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: candidate_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      responses:
