      required:
      - event_slug
      - pool_slug
      - fan_email
      properties:
        event_slug:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z0-9][a-z0-9_-]*$
        pool_slug:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z0-9][a-z0-9_-]*$
        fan_email:
          type: string
          format: email
        claim_expires_hours:
          type: integer
          minimum: 1
          maximum: 720
          default: 72
    AdmissionPassIssued:
      type: object
      additionalProperties: false
      required:
      - pass_id
      - event_id
      - fan_id
      - public_reference
      - claim_token
      - claim_expires_at
      - created
      properties:
        pass_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        fan_id:
          type: string
          format: uuid
        public_reference:
          type: string
        claim_token:
          type: string
          minLength: 64
          maxLength: 64
        claim_expires_at:
          type: string
          format: date-time
        created:
          type: boolean
    ClaimAdmissionPassRequest:
      type: object
      additionalProperties: false
      required:
      - token
      properties:
        token:
          type: string
          minLength: 64
          maxLength: 64
          pattern: ^[A-Fa-f0-9]{64}$
    AdmissionQr:
      type: object
      additionalProperties: false
      required:
      - token
      - expires_at
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
    RedeemAdmissionPassRequest:
      type: object
      additionalProperties: false
      required:
