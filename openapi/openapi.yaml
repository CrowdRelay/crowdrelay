      - event_slug
      - event_title
      - venue
      - starts_at
      - holder_name
      - holder_email_masked
      - public_reference
      - status
      - session_expires_at
      - redeemed_at
      properties:
        pass_id:
          type: string
          format: uuid
        session_id:
          type:
          - string
          - 'null'
          format: uuid
        event_id:
          type: string
          format: uuid
        event_slug:
          type: string
        event_title:
          type: string
        venue:
          type:
          - string
          - 'null'
        starts_at:
          type: string
          format: date-time
        holder_name:
          type:
          - string
          - 'null'
        holder_email_masked:
          type: string
        public_reference:
          type: string
          minLength: 8
          maxLength: 64
          pattern: ^[A-Za-z0-9-]+$
        status:
