        reserved_orders:
          type: integer
          format: int64
        checkout_created_orders:
          type: integer
          format: int64
        reserved_tickets:
          type: integer
          format: int64
        paid_orders:
          type: integer
          format: int64
        paid_tickets:
          type: integer
          format: int64
        gross_sales_minor:
          type: integer
          format: int64
        refunded_minor:
          type: integer
          format: int64
        recent_orders:
