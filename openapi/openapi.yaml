    post:
      operationId: createAdminSmartLink
      summary: Create or update a tracked smart link for a campaign channel
      description: >
        Idempotent on slug — re-posting the same slug updates the destination
        and channel fields rather than failing. Channel attribution
        (source/community/creative) follows migration 0079: the link is the
        channel, and one link per (source, community, creative) is how a
        person actually posts.
