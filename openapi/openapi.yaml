      - created
      properties:
        pass_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        fan_id:
          type: string
          format: uuid
        public_reference:
          type: string
        claim_token:
          type: string
          minLength: 64
          maxLength: 64
        claim_expires_at:
          type: string
          format: date-time
