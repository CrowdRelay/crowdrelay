          description: Observation recorded, rejected as a duplicate capture time, or idempotently replayed.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrowthMetricPointMutation'
        '400': { $ref: '#/components/responses/PrivateProblem' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '404': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /admin/autopilot/growth-metrics/coverage:
    get:
      operationId: autopilotGrowthMetricCoverage
      summary: Which off-platform feeds the agent can currently see
      description: >-
        A platform with no series is reported as `missing` rather than omitted.
        Silence from a platform nobody connected is not evidence that nothing is
        happening there, and an agent that cannot measure a platform cannot move
        it or honestly attribute anything to it.
      security:
      - adminBearer: []
      responses:
        '200': { description: Off-platform feed coverage, content: { application/json: { schema: { $ref: '#/components/schemas/GrowthMetricCoverage' } } } }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /admin/autopilot/growth-metrics/trends:
    get:
      operationId: getAutopilotGrowthMetricTrends
      summary: Read derived trends for every tracked metric
      description: >
        Returns 24h/7d/28d deltas, recent velocity, the 21-day baseline preceding the last 7 days,
        and window coverage for each active series. Windows with no observation old enough to compare
        against are reported as null rather than zero: "no evidence" and "no movement" are different
        facts. Deltas are derived on read and never stored.
      security:
      - adminBearer: []
      responses:
        '200':
          description: Derived trends for all active series.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrowthMetricTrendsResponse'
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /admin/autopilot/plays:
    get:
      operationId: getAutopilotPlays
      summary: Read the play ledger and what each number is allowed to prove
      description: >
        Returns every play the agent has committed to, what it claimed in advance, how many of its
        steps were delivered and how many were skipped, one entry per claim about its effect, and
        the standing of each play kind so a kind that stopped appearing can be told from one that
        retired itself.
        Two claims exist and are never merged: `attributed` is joined to the play through
        first-party rows, `correlational` is the success metric moving over the play's window with
        nothing joining the two. Every claim carries `claim_means` so the strength travels with the
        number. A claim that cannot be made returns `evidence: insufficient` with
        `evidence_reason` and no verdict — a missing join key, an absent baseline and a campaign
        that reached nobody are reported as themselves and never as zero.
      security:
      - adminBearer: []
      responses:
        '200':
          description: Plays with their claims.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayLedgerResponse'
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /admin/autopilot/show-economics:
    get:
      operationId: getAutopilotShowEconomics
      summary: Read predicted show cost against settled show cost
      description: >
        Returns every show the cost model was asked about, the estimate frozen before it and the
        settlement reported after it. A show with no settlement carries no verdict rather than a
        neutral one. A `drifting` verdict names the line that moved the most money and what an
        operator changes about it; `insufficient` names why the show could not be scored. The
        implied road rate is evidence for an operator and is never applied automatically.
      security:
      - adminBearer: []
      responses:
        '200':
          description: Shows with their predicted and settled cost.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowEconomicsResponse'
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /admin/events/{event_id}/show-cost/prediction:
    post:
      operationId: freezeShowCostPrediction
      summary: Freeze what the cost model says this show will cost
      description: >
        Computes the estimate from the tour economics in force and stores it with those rates,
        once. Called while the show is still ahead: recomputing an estimate at settlement time
        scores today's model against itself and always passes. A repeat call returns the frozen
        row unchanged with `replayed: true`. An estimate that could not be computed is stored as
        an honest refusal naming the missing input.
      security:
      - adminBearer: []
      parameters:
      - name: event_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShowCostPredictionRequest'
      responses:
        '200':
          description: Prediction frozen, or already frozen.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowCostMutation'
        '400': { $ref: '#/components/responses/PrivateProblem' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '404': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /admin/events/{event_id}/show-cost/settlement:
    post:
      operationId: settleShowCost
      summary: Report what the show actually cost and score the model against it
      description: >
        Records the settled lines and derives the verdict in the same transaction. Returns 404 when
        no prediction was frozen for the show: a model cannot be scored against a show it was never
        asked about, and a retrospective estimate would be the model marking its own work. A repeat
        call returns the first settlement with `replayed: true` — the first account of what happened
        stands.
      security:
      - adminBearer: []
      parameters:
      - name: event_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShowCostSettlementRequest'
      responses:
        '200':
          description: Settlement recorded, or already recorded.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowCostMutation'
        '400': { $ref: '#/components/responses/PrivateProblem' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '404': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /admin/autopilot/objectives:
    get:
      operationId: getAutopilotObjectives
      summary: Read declared targets and where their series say they stand
      description: >
        Returns every live target with its state derived on read from the series it names — never
        stored, because a stored "on track" goes stale silently. A target with no observation is
        `unmeasurable` with the reason rather than `on_track`, and a deadline that passed unmet is
        `missed` rather than quietly absent. An objective is never evidence of progress: actions
        taken toward it move the number zero.
      security:
      - adminBearer: []
      responses:
        '200':
          description: Live targets and their derived state.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrowthObjectivesResponse'
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
    post:
      operationId: declareAutopilotObjective
      summary: Declare a target on a metric series
      description: >
        Freezes the series' current value as the objective's baseline, because progress measured
        from a baseline that moves is not progress. One live target per series per scope:
        re-declaring returns the existing one with `replayed: true` rather than opening a second
        target a report could pick between. A series with no observation yields a null baseline,
        and the objective then reports as unmeasurable rather than counting from zero.
      security:
      - adminBearer: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrowthObjectiveRequest'
      responses:
        '200':
          description: Target declared, or already declared.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrowthObjectiveMutation'
        '400': { $ref: '#/components/responses/PrivateProblem' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /admin/autopilot/objectives/{objective_id}/retire:
    post:
      operationId: retireAutopilotObjective
      summary: Retire a target without deleting it
      description: >
        The row stays and stops counting. A target that was declared and then removed is exactly
        what a later review needs to see, and a deleted one cannot be reviewed.
      security:
      - adminBearer: []
      parameters:
      - name: objective_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Target retired, or already retired.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrowthObjectiveMutation'
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '404': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /admin/autopilot/chief-of-staff:
    get:
      operationId: getAutopilotChiefOfStaff
      summary: Read the deterministic ViryaOS daily operating brief
      description: >
        Returns measured work performed, exception count, evidence-backed opportunities and
        due show tasks. It is a deterministic read model; no LLM-generated narrative is used.
      security:
      - adminBearer: []
      responses:
        '200':
          description: Deterministic operating brief.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutopilotChiefOfStaff' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /admin/autopilot/scorecard:
    get:
      operationId: getAutopilotScorecard
      summary: Read the agent scorecard — is it running, what did it do, did it work
      description: >
        One endpoint that shows the agent's status (enabled, posture, live capabilities),
        a 7-day action summary (executed, succeeded, failed, parked), the all-time track
        record (improved vs worsened outcomes, measurement coverage), actions broken down
        by context, and the last 10 completed actions with their measured outcomes.
        Not logs — results.
      security:
      - adminBearer: []
      responses:
        '200':
          description: Agent scorecard.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: object
                    properties:
                      agent_enabled: { type: boolean }
                      dry_run: { type: boolean }
                      posture: { type: string, nullable: true }
                      live_capabilities: { type: array, items: { type: string } }
                      parked_capabilities: { type: array, items: { type: string } }
                      last_decision_at: { type: string, format: date-time, nullable: true }
                      last_action_at: { type: string, format: date-time, nullable: true }
                  week:
                    type: object
                    properties:
                      executed: { type: integer, format: int64 }
                      succeeded: { type: integer, format: int64 }
                      failed: { type: integer, format: int64 }
                      parked: { type: integer, format: int64 }
                      awaiting_approval: { type: integer, format: int64 }
                      success_rate_basis_points: { type: integer, nullable: true }
                  track_record:
                    type: object
                    properties:
                      improved: { type: integer, format: int64 }
                      neutral: { type: integer, format: int64 }
                      worsened: { type: integer, format: int64 }
                      unmeasured: { type: integer, format: int64 }
                      measurement_coverage_basis_points: { type: integer, nullable: true }
                  by_context:
                    type: array
                    items:
                      type: object
                      properties:
                        context: { type: string }
                        executed: { type: integer, format: int64 }
                        succeeded: { type: integer, format: int64 }
                        failed: { type: integer, format: int64 }
                        parked: { type: integer, format: int64 }
                  recent_results:
                    type: array
                    items:
                      type: object
                      properties:
                        context: { type: string }
                        action_kind: { type: string }
                        subject_kind: { type: string }
                        subject_id: { type: string, format: uuid }
                        status: { type: string }
                        outcome: { type: string, nullable: true }
                        metric_key: { type: string, nullable: true }
                        delta_basis_points: { type: integer, nullable: true }
                        completed_at: { type: string, format: date-time }
                        executor_id: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /admin/autopilot/acquisition-channels:
    get:
      operationId: getAutopilotAcquisitionChannels
      summary: Which acquisition channels produced people who stayed
      description: >
        Signups and 30-day-active fans per channel, never merged, because a channel that produced
        two hundred signups and four active people is a bad channel wearing a good number. People
        whose channel cannot be established are reported separately by reason, with the fix for
        each — a signup with no click is unattributed, never "direct".
      security:
      - adminBearer: []
      responses:
        '200':
          description: Channel performance with the unattributable part in view.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcquisitionChannels' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /admin/autopilot/tour-economics:
    get:
      operationId: getAutopilotTourEconomics
      summary: Read the band's vehicles, rates and margin floor
      description: >
        Every booking decision is costed with these numbers, so the response carries the version
        an update must be made against. A workspace whose row has not been provisioned reads as
        the conservative default at version 0.
      security:
      - adminBearer: []
      responses:
        '200':
          description: Current tour economics configuration.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TourEconomicsSummary' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
    put:
      operationId: setAutopilotTourEconomics
      summary: Set the band's vehicles, rates and margin floor
      description: >
        Optimistic concurrency on `expected_version`; a stale version is a 409 rather than a
        silent overwrite. Idempotent per `Idempotency-Key`. A half-configured policy is accepted
        so an operator can enter figures one at a time — the refusal for a missing road rate or
        room rate happens when a show is costed, naming the field.
      security:
      - adminBearer: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TourEconomicsRequest' }
      responses:
        '200':
          description: Configuration stored, or the replay of an earlier identical request.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TourEconomicsMutation' }
        '400': { $ref: '#/components/responses/PrivateProblem' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '409': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /admin/autopilot/next-best-actions:
    get:
      operationId: getAutopilotNextBestActions
      summary: Read one prioritized queue across every Autopilot context
      description: >
        Returns at most ten entries, ranked lexicographically by authority state, deadline
        proximity, value tier, measured effect, confidence and deviation magnitude. Each entry
        states the factor that decided its position and what happens if it is ignored. The
        response is a derived read model over existing decisions and actions; nothing is stored,
        and expected impact is always a measured deviation in basis points, never a currency
        amount.
      security:
      - adminBearer: []
      responses:
        '200':
          description: Ranked next best actions, newest evidence first.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items: { $ref: '#/components/schemas/NextBestAction' }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /admin/autopilot/decisions/{decision_id}/handled-externally:
    post:
      operationId: markAutopilotDecisionHandledExternally
      summary: Record that a human handled this finding outside the system
      description: >-
        The "done ourselves" outcome, and deliberately a first-class one rather
        than a dismissal: an opportunity a human took is a success, and
        recording it as ignored would teach the ranker the wrong thing.


        The decision leaves the queue and the brief, because proposing work
        somebody already did is how an operator stops reading the board. Any
        action of it still parked is withdrawn in the same transaction, so a
        handled finding cannot go out anyway hours later. The ledger row — not
        a status column on the decision — is what every read model reads, so
        nothing can disagree about whether this was handled.
      security:
      - adminBearer: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - in: path
        name: decision_id
        required: true
        schema: { type: string, format: uuid }
      responses:
        '200': { description: Handled externally, or idempotently replayed, content: { application/json: { schema: { $ref: '#/components/schemas/AutopilotMutation' } } } }
        '401': { $ref: '#/components/responses/PrivateProblem' }
        '404': { $ref: '#/components/responses/PrivateProblem' }
        '503': { $ref: '#/components/responses/PrivateProblem' }
  /admin/autopilot/booking-targets/{target_id}/reply:
    post:
      operationId: recordAutopilotBookingReply
      summary: Record a booking reply and stop inappropriate automatic follow-ups
      security:
      - adminBearer: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
