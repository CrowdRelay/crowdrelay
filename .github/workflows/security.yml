name: Dependency security

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
  # Called by ci.yml so per-change audits share this single definition.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustsec:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate deterministic lock SBOM
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/generate_lock_sbom.py Cargo.lock artifacts/crowdrelay-sbom.cdx.json
      - name: Upload dependency SBOM
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: crowdrelay-sbom-${{ github.sha }}
          path: artifacts/crowdrelay-sbom.cdx.json
          if-no-files-found: error
          retention-days: 90
      # Prebuilt release binary instead of compiling cargo-audit from source;
      # the version pin and the action SHA together fix the supply chain.
      - name: Install pinned cargo-audit
        uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2
        with:
          tool: cargo-audit@0.22.2
      - name: Audit reachable Rust dependencies
        shell: bash
        run: |
          set -euo pipefail
          rsa_graph="$(cargo tree --locked --workspace --all-features -i rsa 2>/dev/null)"
          if [[ -n "$rsa_graph" ]]; then
            echo "RUSTSEC-2023-0071 is reachable in an active dependency graph:" >&2
            echo "$rsa_graph" >&2
            exit 1
          fi
          cargo audit --ignore RUSTSEC-2023-0071
