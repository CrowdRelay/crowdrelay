name: Dependency security

on:
  workflow_dispatch:
  # Called by ci.yml so per-change audits share this single definition.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustsec:
    runs-on: [self-hosted, arm64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Activate Rust toolchain
        run: |
          echo "${HOME}/.cargo/bin" >> "$GITHUB_PATH"
          echo "RUSTUP_HOME=${HOME}/.rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=${HOME}/.cargo" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
      - name: Generate deterministic lock SBOM
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/generate_lock_sbom.py Cargo.lock artifacts/crowdrelay-sbom.cdx.json
      - name: Upload dependency SBOM
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: crowdrelay-sbom-${{ github.sha }}
          path: artifacts/crowdrelay-sbom.cdx.json
          if-no-files-found: error
          retention-days: 3
      # Prebuilt release binary instead of compiling cargo-audit from source;
      # the version pin and the action SHA together fix the supply chain.
      - name: Install pinned cargo-audit
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2
        with:
          tool: cargo-audit@0.22.2
      - name: Audit reachable Rust dependencies
        shell: bash
        run: |
          set -euo pipefail
          rsa_graph="$(cargo tree --locked --workspace --all-features -i rsa 2>/dev/null)"
          if [[ -n "$rsa_graph" ]]; then
            echo "RUSTSEC-2023-0071 is reachable in an active dependency graph:" >&2
            echo "$rsa_graph" >&2
            exit 1
          fi
          # `cargo audit` exits 0 on a yanked crate — it is a warning, not an
          # advisory. That is defensible for the tree at large and wrong for
          # this one: `chacha20 0.10.1` was yanked by its author and sat in the
          # workspace's encryption path for weeks, surfacing only when somebody
          # ran the audit by hand. A crate the author withdrew is a crate
          # nobody should be shipping, and in crypto the gap between "withdrawn"
          # and "advisory" is the window this catches.
          cargo audit --ignore RUSTSEC-2023-0071 --json > audit.json
          yanked="$(jq -r '.warnings.yanked // [] | .[] | .package.name + " " + .package.version' audit.json)"
          if [[ -n "$yanked" ]]; then
            echo "yanked crates are in the dependency graph:" >&2
            echo "$yanked" >&2
            echo "A yanked crate was withdrawn by its own author. Move off it, or state the" >&2
            echo "reason it is tolerable in this workflow next to an explicit allow." >&2
            exit 1
          fi
