name: Dependency security

on:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**/Cargo.toml"
      - ".github/workflows/security.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**/Cargo.toml"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustsec:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate deterministic lock SBOM
        run: python3 scripts/generate_lock_sbom.py Cargo.lock artifacts/crowdrelay-sbom.cdx.json
      - name: Upload dependency SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: crowdrelay-sbom-${{ github.sha }}
          path: artifacts/crowdrelay-sbom.cdx.json
          if-no-files-found: error
          retention-days: 90
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit reachable Rust dependencies
        shell: bash
        run: |
          set -euo pipefail
          rsa_graph="$(cargo tree --locked --workspace --all-features -i rsa 2>/dev/null)"
          if [[ -n "$rsa_graph" ]]; then
            echo "RUSTSEC-2023-0071 is reachable in an active dependency graph:" >&2
            echo "$rsa_graph" >&2
            exit 1
          fi
          cargo audit --ignore RUSTSEC-2023-0071
