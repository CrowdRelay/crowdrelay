name: Ecosystem deploy

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full 40-char SHA to deploy (defaults to latest main)
        required: false
        default: ""
      allow_contract_migrations:
        description: Allow destructive DB migrations
        required: false
        type: boolean
        default: false
      allow_stale_agents:
        description: Deploy even if the agent image lags crowdrelay-agents main
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: ecosystem-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Ecosystem blue-green deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: production
    steps:
      - name: Check out CrowdRelay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      # Phase 2 deploys the Control Plane from source, so the runner needs its
      # checkout. `actions/checkout` will not write outside `$GITHUB_WORKSPACE`,
      # which is where the script's default sibling path points, so it lands in
      # the workspace and the script is told where to look. Public repo, so the
      # job token is enough and no PAT is introduced.
      - name: Check out Control Plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CrowdRelay/crowdrelay-control-plane
          ref: main
          path: .control-plane
          token: ${{ github.token }}
          persist-credentials: false

      # The agent-service ships as an overlay on the Control Plane stack. The
      # orchestrator does not build it, but it needs the history to prove the
      # published image is an ancestor of agents main, so `fetch-depth: 0`.
      - name: Check out Agents
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CrowdRelay/crowdrelay-agents
          ref: main
          path: .agents
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: false

      - name: Resolve target SHA
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.target_sha }}" ]]; then
            target="${{ inputs.target_sha }}"
          else
            target="$(git rev-parse HEAD)"
          fi
          [[ "$target" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid SHA: $target"; exit 1; }
          echo "sha=$target" >> "$GITHUB_OUTPUT"
          echo "TARGET_SHA=$target"

      - name: Configure SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.CROWDRELAY_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CROWDRELAY_DEPLOY_KNOWN_HOSTS }}
          CROWDRELAY_DEPLOY_HOST_IP: ${{ secrets.CROWDRELAY_DEPLOY_HOST_IP }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<SSH
          Host virya-crowdrelay
              HostName ${CROWDRELAY_DEPLOY_HOST_IP}
              User ubuntu
              IdentityFile ~/.ssh/deploy_key
              IdentitiesOnly yes
              ServerAliveInterval 30
              ServerAliveCountMax 3
          Host virya-home
              HostName 192.168.100.27
              User wojtek
              IdentityFile ~/.ssh/deploy_key
              IdentitiesOnly yes
              ServerAliveInterval 30
              ServerAliveCountMax 3
          SSH
          chmod 600 ~/.ssh/config

      - name: Run ecosystem deploy
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTROL_PLANE_CHECKOUT: ${{ github.workspace }}/.control-plane
          AGENTS_CHECKOUT: ${{ github.workspace }}/.agents
        run: |
          set -euo pipefail
          # `cond && args+=(...)` is an and-list: when the condition is false the
          # whole statement returns 1, and under `set -e` the step exits there.
          # The last flag in the chain therefore decided whether the deploy ran
          # at all. Use plain `if` so a false input only skips its own flag.
          args=()
          if [[ "${{ inputs.allow_contract_migrations }}" == "true" ]]; then
            args+=(--allow-contract-migrations)
          fi
          if [[ "${{ inputs.allow_stale_agents }}" == "true" ]]; then
            args+=(--allow-stale-agents)
          fi
          bash scripts/deploy-ecosystem.sh "${{ steps.target.outputs.sha }}" "${args[@]}"

      - name: Post-deploy production smoke
        shell: bash
        run: |
          set -euo pipefail
          # Source production env for smoke URLs, then run the smoke script
          ssh virya-crowdrelay 'set -euo pipefail; cd /opt/crowdrelay && source .crowdrelay.local.sh 2>/dev/null || true; export CROWDRELAY_BASE_URL="${CROWDRELAY_PUBLIC_BASE_URL:-https://signal-api.virya.music}" VIRYA_BASE_URL="https://virya.music"; bash scripts/production-smoke.sh' 2>&1 || {
            echo "❌ Post-deploy production smoke failed"
            exit 1
          }
          echo "✅ Post-deploy production smoke passed"

      - name: Report deploy status
        if: always()
        shell: bash
        run: |
          if [[ ${{ job.status }} == "success" ]]; then
            echo "✅ Ecosystem deploy succeeded for ${{ steps.target.outputs.sha }}"
          else
            echo "❌ Ecosystem deploy failed for ${{ steps.target.outputs.sha }}"
            echo "The failing phase was rolled back by its own rollback handler."
            echo "Components before the failure are at the new SHA; after remain at the previous."
          fi
