# Every #[ignore]d PostgreSQL test, every night, on one database.
#
# CI runs 27 named proofs out of 589 #[ignore]d tests: the full set is too
# slow for every push on one self-hosted box. So nothing ran the other 562
# against the shared-database wiring #235 introduced, and by 2026-09-24 33 of
# them failed when run together — not because the product broke, but because
# the suite had started destroying its own fixtures (a TRUNCATE of the city
# catalogue, a dropped trigger never restored, fixed slugs colliding). Each
# still passed alone, which is how nobody noticed. This is the run that
# notices: the whole suite, serially, once a night, while the box is idle.
# A failure on main reaches Discord through `ci-failure-alert.yml`.
name: Nightly PostgreSQL suite

on:
  schedule:
    # 01:30 UTC — clear of the 03:00 server prune and the 04:00 artifact
    # cleanup, and of working hours on the one self-hosted runner.
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-suite:
    name: Every ignored PostgreSQL test
    runs-on: [self-hosted, arm64]
    # One compile (~6 min warm, ~14 cold) plus ~5 min of serial tests.
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:19beta3-alpine
        env:
          POSTGRES_DB: crowdrelay
          POSTGRES_USER: crowdrelay
          POSTGRES_PASSWORD: crowdrelay-ci-only
        ports:
          - 5432:5432
        # --tmpfs keeps postgres data in RAM: the 18+ image declares
        # VOLUME /var/lib/postgresql (data goes in a versioned subdir), and
        # without an explicit mount the runner leaves an anonymous volume
        # behind on every run (~7 GB/day of leak measured on this host). The
        # mount must sit at the VOLUME path itself — mounting at
        # /var/lib/postgresql/data trips the image's pg_ctlcluster layout
        # check and the container refuses to start.
        options: >-
          --tmpfs /var/lib/postgresql
          --health-cmd "pg_isready -U crowdrelay -d crowdrelay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      CROWDRELAY_ENV: test
      CROWDRELAY_BIND_ADDR: 127.0.0.1:8080
      CROWDRELAY_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_OUTBOX_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_ADMISSION_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_EVENT_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_AUTOPILOT_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_ECOSYSTEM_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_FAN_LIFECYCLE_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_REFERRAL_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_MOBILE_FAN_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_REMINDER_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_RETENTION_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_COMMUNITY_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_DATABASE_MAX_CONNECTIONS: 5
      CROWDRELAY_ALLOWED_ORIGINS: http://localhost:4321
      CROWDRELAY_WORKSPACE_SLUG: example
      CROWDRELAY_PUBLIC_SITE_BASE_URL: http://localhost:4321
      # WORKSPACE_SLUG is `example` here, and a non-Virya workspace has no
      # implicit public origin — the community executor refuses to build one
      # without it. Locally the slug defaults to virya and masks this.
      CROWDRELAY_PUBLIC_ORIGIN: http://localhost:4321
      CROWDRELAY_DEFAULT_COUNTRY_CODE: PL
      CROWDRELAY_TENANT_REGION: eu
      CROWDRELAY_TENANT_LOCALE: pl-PL
      CROWDRELAY_TENANT_TIMEZONE: Europe/Warsaw
      CROWDRELAY_TENANT_CURRENCY: PLN
      CROWDRELAY_TENANT_DATE_FORMAT: dmy
      CROWDRELAY_TENANT_NUMBER_FORMAT: comma_decimal
      CROWDRELAY_TENANT_DATA_REGION: eu
      CROWDRELAY_RANDOM_DRAWS_ENABLED: "false"
      CROWDRELAY_BOOTSTRAP_JSON: >-
        {"workspace_name":"CrowdRelay CI","cities":[{"slug":"wroclaw","name":"Wrocław","country":"PL","region":"Dolnoslaskie","lat":51.1079,"lng":17.0385}],"campaigns":[{"name":"CI launch","active":true,"smart_links":[{"slug":"ci-launch","destination_url":"http://localhost:4321/join","active":true}]}],"webhook_endpoints":[]}
      RUST_LOG: info
      # sccache wraps rustc on the runner (installed at ~/.cargo/bin/sccache):
      # compilations cache by content hash, so a run only pays codegen for the
      # crates a push actually changed. rust-cache still carries the registry,
      # fingerprints and clippy artifacts. The 4G cap keeps the cache inside
      # the box's disk headroom forever — no unbounded target-dir growth.
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /home/ubuntu/.cache/sccache
      SCCACHE_CACHE_SIZE: 4G
      SCCACHE_IDLE_TIMEOUT: "0"
      # Incremental fingerprints double the target dir with per-crate work
      # products nothing in CI ever reuses — a cancelled run's cache is cold
      # anyway. On a 9 GB-free box that doubling is what fills the disk.
      CARGO_INCREMENTAL: "0"
      # Full debuginfo is the majority of a debug test binary's size — ~60
      # binaries at once is what pushed ld into ENOSPC on 2026-09-21.
      # Line tables keep panic backtraces readable at a fraction of the cost.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Activate repository-pinned Rust toolchain
        run: |
          echo "${HOME}/.cargo/bin" >> "$GITHUB_PATH"
          echo "RUSTUP_HOME=${HOME}/.rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=${HOME}/.cargo" >> "$GITHUB_ENV"
          # The workspace wipe between jobs used to force a full ~16 GB
          # rebuild every run — the recurring ENOSPC root cause on this 45
          # GB host. A target dir outside _work survives the wipe, so a run
          # only rebuilds what the push changed. Keyed by runner.name (the
          # runner context is only visible to steps, not job env): one dir
          # per lane keeps the four runner services off each other's
          # package-cache lock. On a hosted runner it is just a throwaway
          # dir inside the ephemeral VM.
          echo "CARGO_TARGET_DIR=${HOME}/.cargo-target/${{ runner.name }}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Restore only: main's CI owns the one cache entry, and a nightly
          # write would evict it.
          save-if: false

      - name: Ensure sccache
        # rust-cache caches ~/.cargo/bin and its restore-time cleanup deletes
        # binaries absent from .crates.toml — a host-installed sccache is
        # exactly that, so every restore wiped the wrapper this job's
        # RUSTC_WRAPPER needs (the 2026-09-22 ENOENT loop). Provision it here,
        # after the restore, so nothing later in the job can remove it.
        # A release tarball, not `cargo install` — compiling sccache would
        # spend ~30 min on this 2-core box.
        run: |
          set -euo pipefail
          if ! command -v sccache >/dev/null; then
            t=$(mktemp -d)
            curl -fsSL -o "$t/s.tgz" \
              "https://github.com/mozilla/sccache/releases/download/v0.17.0/sccache-v0.17.0-$(uname -m)-unknown-linux-musl.tar.gz"
            tar -xzf "$t/s.tgz" -C "$t"
            install -m 0755 "$t"/sccache-*-unknown-linux-musl/sccache "${HOME}/.cargo/bin/sccache"
            rm -rf "$t"
          fi
          sccache --version

      - name: Run idempotent database and workspace setup
        run: cargo run --locked --all-features --package crowdrelay-worker -- setup

      # The same invocation `just test-postgres-env` uses for its named set,
      # minus the names: every target, every #[ignore]d test, serially, on
      # the service database. `--no-fail-fast` so one red target does not
      # hide the rest of the night's report.
      - name: Run every ignored PostgreSQL test
        run: cargo test --locked --all-features --workspace --no-fail-fast -- --ignored --test-threads=1
