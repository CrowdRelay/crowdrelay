# actions-recovery: 20260806-201024
name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Format, lint, test, audit, and setup
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: crowdrelay
          POSTGRES_USER: crowdrelay
          POSTGRES_PASSWORD: crowdrelay-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crowdrelay -d crowdrelay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      CROWDRELAY_ENV: test
      CROWDRELAY_BIND_ADDR: 127.0.0.1:8080
      CROWDRELAY_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_OUTBOX_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_ADMISSION_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_EVENT_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_FAN_LIFECYCLE_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_REFERRAL_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_REMINDER_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_RETENTION_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_DATABASE_MAX_CONNECTIONS: 5
      CROWDRELAY_ALLOWED_ORIGINS: http://localhost:4321
      CROWDRELAY_WORKSPACE_SLUG: example
      CROWDRELAY_PUBLIC_SITE_BASE_URL: http://localhost:4321
      CROWDRELAY_DEFAULT_COUNTRY_CODE: PL
      CROWDRELAY_RANDOM_DRAWS_ENABLED: "false"
      CROWDRELAY_BOOTSTRAP_JSON: >-
        {"workspace_name":"CrowdRelay CI","cities":[{"slug":"wroclaw","name":"Wroclaw","country":"PL","region":"Dolnoslaskie","lat":51.1079,"lng":17.0385}],"campaigns":[{"name":"CI launch","active":true,"smart_links":[{"slug":"ci-launch","destination_url":"http://localhost:4321/join","active":true}]}],"webhook_endpoints":[]}
      RUST_LOG: info

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Activate repository-pinned Rust toolchain
        run: |
          rustc --version --verbose
          cargo --version

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Cache pinned cargo-audit binary
        id: cargo-audit-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-0.22.2

      - name: Install pinned cargo-audit
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Run idempotent database and workspace setup
        run: |
          cargo run --locked --package crowdrelay-worker -- setup
          cargo run --locked --package crowdrelay-worker -- setup

      - name: Run repository checks
        run: make ci

      - name: Audit Rust dependencies
        shell: bash
        run: |
          set -euo pipefail
          rsa_graph="$(cargo tree --locked --workspace --all-features -i rsa 2>/dev/null)"
          if [[ -n "$rsa_graph" ]]; then
            echo "RUSTSEC-2023-0071 is reachable in an active dependency graph:" >&2
            echo "$rsa_graph" >&2
            exit 1
          fi
          cargo audit --ignore RUSTSEC-2023-0071

      - name: Test all PostgreSQL integration paths sequentially
        shell: bash
        run: |
          set -euo pipefail
          for test_target in \
            acquisition_postgres \
            admission_postgres \
            events_postgres \
            fan_lifecycle_postgres \
            referrals_rewards_postgres
          do
            cargo test --locked \
              --package crowdrelay-infra \
              --test "$test_target" \
              -- \
              --ignored \
              --nocapture \
              --test-threads=1
          done

          cargo test --locked \
            --package crowdrelay-worker \
            postgres_outbox_round_trip \
            -- \
            --ignored \
            --nocapture \
            --test-threads=1
          cargo test --locked \
            --package crowdrelay-worker \
            --test outbox_http_postgres \
            -- \
            --ignored \
            --nocapture \
            --test-threads=1
          cargo test --locked \
            --package crowdrelay-worker \
            due_reminder_is_enqueued_exactly_once \
            -- \
            --ignored \
            --nocapture \
            --test-threads=1
          cargo test --locked \
            --package crowdrelay-worker \
            cycle_deletes_expired_rows_scrubs_safe_payloads_and_preserves_audit \
            -- \
            --ignored \
            --nocapture \
            --test-threads=1

      - name: Check generated deployment files stay ignored
        shell: bash
        run: |
          set -euo pipefail
          for generated in \
            .crowdrelay.local.sh \
            .crowdrelay-artifacts/crowdrelay-test.tar.gz \
            deploy/.env.production \
            ./deploy/bootstrap.production.json \
            ./deploy/webhook-secrets.production.json \
            deploy/backups/crowdrelay-test.dump \
            backups/crowdrelay-test.dump \
            crowdrelay-test.dump \
            crowdrelay-test.dump.age \
            .crowdrelay-maintenance.lock
          do
            git check-ignore --quiet "$generated"
          done
          for example in \
            .crowdrelay.local.sh.example \
            deploy/env.production.example \
            ./deploy/bootstrap.example.json \
            ./deploy/webhook-secrets.example.json
          do
            if git check-ignore --no-index --quiet "$example"; then
              echo "Tracked deployment example must not be ignored: $example" >&2
              exit 1
            fi
          done

      - name: Validate Compose and Bake configuration
        env:
          CROWDRELAY_ENV_FILE: .env.example
        run: |
          docker buildx bake --print >/dev/null
          docker compose config --quiet
          CROWDRELAY_IMAGE_TAG=sha-0000000000000000000000000000000000000000 \
          CROWDRELAY_DOCKER_NETWORK=crowdrelay-ci \
          CROWDRELAY_ENV_FILE=deploy/env.production.example \
          CROWDRELAY_BOOTSTRAP_HOST_FILE=./deploy/bootstrap.example.json \
          CROWDRELAY_WEBHOOK_SECRETS_HOST_FILE=./deploy/webhook-secrets.example.json \
            docker compose \
              --env-file deploy/env.production.example \
              --file compose.production.yaml \
              config \
              --quiet
          production_images="$(
            CROWDRELAY_IMAGE_TAG=sha-0000000000000000000000000000000000000000 \
            CROWDRELAY_DOCKER_NETWORK=crowdrelay-ci \
            CROWDRELAY_ENV_FILE=deploy/env.production.example \
            CROWDRELAY_BOOTSTRAP_HOST_FILE=./deploy/bootstrap.example.json \
            CROWDRELAY_WEBHOOK_SECRETS_HOST_FILE=./deploy/webhook-secrets.example.json \
              docker compose \
                --env-file deploy/env.production.example \
                --file compose.production.yaml \
                config \
                --images
          )"
          image_count="$(printf '%s\n' "$production_images" | awk 'NF { count++ } END { print count }')"
          [[ "$image_count" -eq 3 ]]
          while IFS= read -r image; do
            [[ "${image##*:}" == "sha-0000000000000000000000000000000000000000" ]]
          done <<< "$production_images"
          digest="sha256:$(printf '0%.0s' {1..64})"
          digest_images="$(
            CROWDRELAY_IMAGE_TAG=sha-0000000000000000000000000000000000000000 \
            CROWDRELAY_DOCKER_NETWORK=crowdrelay-ci \
            CROWDRELAY_ENV_FILE=deploy/env.production.example \
            CROWDRELAY_BOOTSTRAP_HOST_FILE=./deploy/bootstrap.example.json \
            CROWDRELAY_WEBHOOK_SECRETS_HOST_FILE=./deploy/webhook-secrets.example.json \
            CROWDRELAY_API_IMAGE_REF="ghcr.io/wojciechbator/crowdrelay-api@$digest" \
            CROWDRELAY_WORKER_IMAGE_REF="ghcr.io/wojciechbator/crowdrelay-worker@$digest" \
              docker compose \
                --env-file deploy/env.production.example \
                --file compose.production.yaml \
                --file compose.production.digest.yaml \
                config --images
          )"
          [[ "$(printf '%s\n' "$digest_images" | grep -c '@sha256:')" -eq 3 ]]
          ./scripts/audit-public-tree.sh

      - name: Check TypeScript client
        run: >-
          npm exec
          --yes
          --package=typescript@5.8.3
          --
          tsc
          --project packages/crowdrelay-js/tsconfig.json
          --noEmit

  containers:
    name: Build container targets
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build both runtime targets once
        run: |
          docker buildx bake \
            --set '*.platform=linux/arm64' \
            --set '*.cache-from=type=gha,scope=crowdrelay-runtime' \
            --set 'api.cache-to=type=gha,mode=max,scope=crowdrelay-runtime' \
            --set '*.output=type=cacheonly'
