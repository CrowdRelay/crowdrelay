# actions-recovery: 20260806-201024
name: CI

on:
  workflow_dispatch:
  # No paths-ignore on main. `deploy-ecosystem.sh` requires a CI run for HEAD and
  # refuses to deploy without one, so a documentation-only commit on main used to
  # make production undeployable: CI skipped it, no run ever appeared, and the
  # deploy waited an hour for one and failed. Writing something down should not
  # stop a release.
  #
  # Teaching the deploy to fall back to a validated ancestor was the other option
  # and is worse. It would have to decide which differences CI was allowed to
  # ignore, and thread a second SHA through image pulls, the digest artifact and
  # the runtime-SHA verification — four places to be subtly wrong in the release
  # path, against a handful of runner minutes on a self-hosted runner that is
  # free. A release invariant that holds unconditionally is worth more.
  #
  # Pull requests keep the filter: nothing deploys from them, so the time saved
  # there costs nothing.
  push:
    branches: ["main"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job, one compile, one database. The pipeline is exactly: compile the
  # workspace once via `cargo test` (unit tests run in the same invocation),
  # then run the e2e proofs against that compile's binaries on one migrated
  # database. No second compile (clippy runs in `just ci` at ship time), no
  # per-test databases, no lanes.
  rust-tests:
    name: Rust checks and PostgreSQL integration
    runs-on: { group: Default, labels: [self-hosted, arm64] }
    # Warm-cache runs land around 6 minutes; a fully cold sccache+target
    # compile needs ~14. 35 is headroom for the box being shared: the
    # frontend lane now runs Tauri/Android builds alongside, and at 20 a
    # busy-box run died mid-e2e at exactly the timeout (2026-09-22). At 35 a
    # main run that queued behind PR runs for 44 minutes then spent all 35
    # still in "Run repository checks" (2026-09-26) — cancelled, no verdict,
    # and a main HEAD with no CI run cannot deploy. 60 covers a cold compile
    # on a contended box; a genuinely hung run still dies.
    timeout-minutes: 60

    # The pg-gated lib tests in this job point at 127.0.0.1:5432 and used to
    # borrow whatever happened to be listening there — usually a leftover
    # service container from another job. On a clean box the connect refused
    # for 30s and the only hard-failing one (the trace-timeline test) died
    # with PoolTimedOut. A dedicated service makes the dependency real.
    services:
      postgres:
        image: postgres:19beta3-alpine
        env:
          POSTGRES_DB: crowdrelay
          POSTGRES_USER: crowdrelay
          POSTGRES_PASSWORD: crowdrelay-ci-only
        ports:
          - 5432:5432
        # --tmpfs keeps postgres data in RAM: the 18+ image declares
        # VOLUME /var/lib/postgresql (data goes in a versioned subdir), and
        # without an explicit mount the runner leaves an anonymous volume
        # behind on every run (~7 GB/day of leak measured on this host). The
        # mount must sit at the VOLUME path itself — mounting at
        # /var/lib/postgresql/data trips the image's pg_ctlcluster layout
        # check and the container refuses to start.
        options: >-
          --tmpfs /var/lib/postgresql
          --health-cmd "pg_isready -U crowdrelay -d crowdrelay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      CROWDRELAY_ENV: test
      CROWDRELAY_BIND_ADDR: 127.0.0.1:8080
      CROWDRELAY_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_OUTBOX_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_ADMISSION_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_EVENT_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_AUTOPILOT_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_ECOSYSTEM_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_FAN_LIFECYCLE_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_REFERRAL_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_MOBILE_FAN_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_REMINDER_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_RETENTION_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_COMMUNITY_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_DATABASE_MAX_CONNECTIONS: 5
      CROWDRELAY_ALLOWED_ORIGINS: http://localhost:4321
      CROWDRELAY_WORKSPACE_SLUG: example
      CROWDRELAY_PUBLIC_SITE_BASE_URL: http://localhost:4321
      # WORKSPACE_SLUG is `example` here, and a non-Virya workspace has no
      # implicit public origin — the community executor refuses to build one
      # without it. Locally the slug defaults to virya and masks this.
      CROWDRELAY_PUBLIC_ORIGIN: http://localhost:4321
      CROWDRELAY_DEFAULT_COUNTRY_CODE: PL
      CROWDRELAY_TENANT_REGION: eu
      CROWDRELAY_TENANT_LOCALE: pl-PL
      CROWDRELAY_TENANT_TIMEZONE: Europe/Warsaw
      CROWDRELAY_TENANT_CURRENCY: PLN
      CROWDRELAY_TENANT_DATE_FORMAT: dmy
      CROWDRELAY_TENANT_NUMBER_FORMAT: comma_decimal
      CROWDRELAY_TENANT_DATA_REGION: eu
      CROWDRELAY_RANDOM_DRAWS_ENABLED: "false"
      CROWDRELAY_BOOTSTRAP_JSON: >-
        {"workspace_name":"CrowdRelay CI","cities":[{"slug":"wroclaw","name":"Wrocław","country":"PL","region":"Dolnoslaskie","lat":51.1079,"lng":17.0385}],"campaigns":[{"name":"CI launch","active":true,"smart_links":[{"slug":"ci-launch","destination_url":"http://localhost:4321/join","active":true}]}],"webhook_endpoints":[]}
      RUST_LOG: info
      # sccache wraps rustc on the runner (installed at ~/.cargo/bin/sccache):
      # compilations cache by content hash, so a run only pays codegen for the
      # crates a push actually changed. rust-cache still carries the registry,
      # fingerprints and clippy artifacts. The 4G cap keeps the cache inside
      # the box's disk headroom forever — no unbounded target-dir growth.
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /home/ubuntu/.cache/sccache
      SCCACHE_CACHE_SIZE: 4G
      SCCACHE_IDLE_TIMEOUT: "0"
      # Incremental fingerprints double the target dir with per-crate work
      # products nothing in CI ever reuses — a cancelled run's cache is cold
      # anyway. On a 9 GB-free box that doubling is what fills the disk.
      CARGO_INCREMENTAL: "0"
      # Full debuginfo is the majority of a debug test binary's size — ~60
      # binaries at once is what pushed ld into ENOSPC on 2026-09-21.
      # Line tables keep panic backtraces readable at a fraction of the cost.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Activate repository-pinned Rust toolchain
        run: |
          echo "${HOME}/.cargo/bin" >> "$GITHUB_PATH"
          echo "RUSTUP_HOME=${HOME}/.rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=${HOME}/.cargo" >> "$GITHUB_ENV"
          # The workspace wipe between jobs used to force a full ~16 GB
          # rebuild every run — the recurring ENOSPC root cause on this 45
          # GB host. A target dir outside _work survives the wipe, so a run
          # only rebuilds what the push changed. Keyed by runner.name (the
          # runner context is only visible to steps, not job env): one dir
          # per lane keeps the four runner services off each other's
          # package-cache lock. On a hosted runner it is just a throwaway
          # dir inside the ephemeral VM.
          echo "CARGO_TARGET_DIR=${HOME}/.cargo-target/${{ runner.name }}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Purge stale Rust cache entries
        # Swatinem/rust-cache keys on Cargo.lock hash; each lock change leaves
        # the previous ~640 MB entry orphaned until 7-day TTL. Prune every
        # rust entry except the newest — the newest is the one this run is
        # about to restore (and, under cancel-in-progress churn, often the
        # only warm cache in the pool: a cancelled run never reaches the save
        # step, so an unconditional purge used to leave every next run cold).
        if: github.ref == 'refs/heads/main' && github.job == 'rust-tests'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ids < <(gh api "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --jq '[.actions_caches[] | select(.key | startswith("v0-rust-"))] | sort_by(.created_at) | reverse | .[1:][] | .id' 2>/dev/null || true)
          for id in "${ids[@]}"; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${id}" 2>/dev/null || true
          done
          echo "Purged ${#ids[@]} stale Rust cache entries"
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Every pull request run used to save its own ~640 MB entry into the
          # 10 GB Actions pool. Pull requests restore from the default branch
          # instead; only the default branch writes, and exactly one of the
          # parallel jobs writes it so they cannot thrash the cache pool.
          save-if: ${{ github.ref == 'refs/heads/main' && github.job == 'rust-tests' }}

      - name: Ensure sccache
        # rust-cache caches ~/.cargo/bin and its restore-time cleanup deletes
        # binaries absent from .crates.toml — a host-installed sccache is
        # exactly that, so every restore wiped the wrapper this job's
        # RUSTC_WRAPPER needs (the 2026-09-22 ENOENT loop). Provision it here,
        # after the restore, so nothing later in the job can remove it.
        # A release tarball, not `cargo install` — compiling sccache would
        # spend ~30 min on this 2-core box.
        run: |
          set -euo pipefail
          if ! command -v sccache >/dev/null; then
            t=$(mktemp -d)
            curl -fsSL -o "$t/s.tgz" \
              "https://github.com/mozilla/sccache/releases/download/v0.17.0/sccache-v0.17.0-$(uname -m)-unknown-linux-musl.tar.gz"
            tar -xzf "$t/s.tgz" -C "$t"
            install -m 0755 "$t"/sccache-*-unknown-linux-musl/sccache "${HOME}/.cargo/bin/sccache"
            rm -rf "$t"
          fi
          sccache --version

      - name: Run repository checks
        # One compile, one command: `cargo test` builds every test binary
        # (unit tests run here; the #[ignore]d pg binaries are reused by the
        # e2e step below — no second compile). Format runs first because it
        # is free; clippy does not run in CI — it is a second full compile
        # and stays in `just ci` where the ship gate runs it.
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo test --locked --workspace --all-targets --all-features
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/validate-contract-assets.ts
          # The source-reading contract suite — pure source analysis, no
          # compile, seconds. These are the cheap guardrails.
          python3 -m unittest discover -s scripts -p 'test_*.py'
          bash scripts/audit-public-tree.sh
          python3 scripts/check-ci-policy.py
          # Scripts `unittest discover` cannot match: hyphenated names, or no
          # `test_` prefix. Listed explicitly or they never run.
          python3 scripts/source-size-ratchet.py
          python3 scripts/api-sql-ratchet.py
          python3 scripts/workspace-scope-ratchet.py
          python3 scripts/test-modularity-contract.py
          python3 scripts/test_platform_vocabulary_v1.py
          python3 scripts/test_sql_identifiers_v1.py
          python3 scripts/test_sql_columns_v1.py
          python3 scripts/check-postgres-major.py
          python3 scripts/postgres18_runtime_contract.py
          python3 scripts/area_wallet_authority_v2_contract.py
          python3 scripts/staff_device_sessions_v2_contract.py
          python3 scripts/test-ecosystem-contract-v2.py
          python3 scripts/test-ops-control-plane-v2.py
          python3 scripts/test-ecosystem-design-contract.py
          python3 scripts/test-image-provenance-policy.py
          python3 scripts/test_release_receipt.py
          python3 scripts/test_ecosystem_deploy_contract.py

      - name: Check generated deployment files stay ignored
        shell: bash
        run: |
          set -euo pipefail
          for generated in \
            .crowdrelay.local.sh \
            .crowdrelay-artifacts/crowdrelay-test.tar.gz \
            deploy/.env.production \
            ./deploy/bootstrap.production.json \
            ./deploy/webhook-secrets.production.json \
            deploy/backups/crowdrelay-test.dump \
            backups/crowdrelay-test.dump \
            crowdrelay-test.dump \
            crowdrelay-test.dump.age \
            .crowdrelay-maintenance.lock
          do
            git check-ignore --quiet "$generated"
          done
          for example in \
            .crowdrelay.local.sh.example \
            deploy/env.production.example \
            ./deploy/bootstrap.example.json \
            ./deploy/webhook-secrets.example.json
          do
            if git check-ignore --no-index --quiet "$example"; then
              echo "Tracked deployment example must not be ignored: $example" >&2
              exit 1
            fi
          done

      # Moved here from the standalone deploy-config job — nine seconds of
      # work no longer pays a full job setup on a serial runner.
      - name: Validate Compose and Bake configuration
        env:
          CROWDRELAY_ENV_FILE: .env.example
        run: |
          docker buildx bake --file docker-bake.hcl --print >/dev/null
          docker compose config --quiet
          production_images="$(
            CROWDRELAY_IMAGE_TAG=sha-0000000000000000000000000000000000000000 \
            CROWDRELAY_DOCKER_NETWORK=crowdrelay-ci \
            CROWDRELAY_ENV_FILE=deploy/env.production.example \
            CROWDRELAY_BOOTSTRAP_HOST_FILE=./deploy/bootstrap.example.json \
            CROWDRELAY_WEBHOOK_SECRETS_HOST_FILE=./deploy/webhook-secrets.example.json \
              docker compose \
                --env-file deploy/env.production.example \
                --file compose.production.yaml \
                config \
                --images
          )"
          # Every image CrowdRelay builds must be pinned to the build sha, and
          # there must be exactly three of them (api, worker, and the worker
          # image again for the migrate service). Upstream images are pinned by
          # their own tag instead, which is a different rule -- asserting the
          # sha over the whole list broke the moment `5c5e5a1` moved postgres
          # into this compose file.
          own_images="$(printf '%s\n' "$production_images" | grep '^ghcr.io/crowdrelay/' || true)"
          image_count="$(printf '%s\n' "$own_images" | awk 'NF { count++ } END { print count+0 }')"
          [[ "$image_count" -eq 3 ]]
          while IFS= read -r image; do
            [[ -n "$image" ]] || continue
            [[ "${image##*:}" == "sha-0000000000000000000000000000000000000000" ]]
          done <<< "$own_images"
          # Upstream images carry an explicit version, never a floating tag.
          while IFS= read -r image; do
            [[ -n "$image" ]] || continue
            case "$image" in
              ghcr.io/crowdrelay/*) continue ;;
            esac
            [[ "$image" == *:* ]]
            [[ "${image##*:}" != "latest" ]]
          done <<< "$production_images"
          digest="sha256:$(printf '0%.0s' {1..64})"
          digest_images="$(
            CROWDRELAY_IMAGE_TAG=sha-0000000000000000000000000000000000000000 \
            CROWDRELAY_DOCKER_NETWORK=crowdrelay-ci \
            CROWDRELAY_ENV_FILE=deploy/env.production.example \
            CROWDRELAY_BOOTSTRAP_HOST_FILE=./deploy/bootstrap.example.json \
            CROWDRELAY_WEBHOOK_SECRETS_HOST_FILE=./deploy/webhook-secrets.example.json \
            CROWDRELAY_API_IMAGE_REF="ghcr.io/crowdrelay/crowdrelay-api@$digest" \
            CROWDRELAY_WORKER_IMAGE_REF="ghcr.io/crowdrelay/crowdrelay-worker@$digest" \
              docker compose \
                --env-file deploy/env.production.example \
                --file compose.production.yaml \
                --file compose.production.digest.yaml \
                config --images
          )"
          [[ "$(printf '%s\n' "$digest_images" | grep -c '@sha256:')" -eq 3 ]]
          ./scripts/audit-public-tree.sh

      - name: Run idempotent database and workspace setup
        run: |
          cargo run --locked --all-features --package crowdrelay-worker -- setup
          cargo run --locked --all-features --package crowdrelay-worker -- setup

      # The e2e guard: the proofs that matter — fan acquisition, click→
      # conversion attribution, autopilot decide→act→measure, outbox
      # delivery, workspace isolation, secrets, idempotence — each exactly
      # once, serially, on the ONE migrated `crowdrelay` database the
      # service container already provides. The postgres service is a tmpfs
      # container the runner destroys at job end, so the suite leaves no
      # database behind by construction. Every #[ignore]d test remains
      # runnable on demand against any migrated database.
      - name: Run the e2e proofs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --all-features --package crowdrelay-infra --test postgres -- --ignored --test-threads=1 \
            click_writes_interaction_and_signup_links_it_to_the_fan \
            fan_arrival_writes_provenance_not_only_acquisition \
            single_action_attribution_is_exact \
            unlabelled_link_records_interaction_but_never_converts \
            what_left_and_what_never_did \
            a_seed_sheet_lands_as_attributed_facts \
            a_workspace_without_email_gets_no_assignments \
            an_empty_org_and_a_silent_act_both_render \
            a_silence_resolves_to_a_measured_zero \
            b_a_reply_inside_the_window_resolves_to_one \
            queued_team_assignment_email_uses_fast_lane_and_emits_bridge_event \
            an_anchor_is_one_room_whoever_claims_it
          cargo test --locked --all-features --package crowdrelay-worker --test postgres -- --ignored --test-threads=1 \
            the_outcome_appears_in_the_timeline_it_caused \
            the_drip_claims_one_post_per_batch_per_interval \
            signed_http_delivery_is_exact_and_durable \
            a_late_executor_report_is_not_duplicated \
            a_second_pass_changes_nothing \
            the_sweep_reaches_every_workspace \
            sheet_intake
          cargo test --locked --all-features --package crowdrelay-infra --test peer_act_seed_postgres -- --ignored --test-threads=1 \
            a_band_sheet_lands_as_attributed_peer_facts
          cargo test --locked --all-features --package crowdrelay-infra --test team_reminder_drain_postgres -- --ignored --test-threads=1 \
            the_drain_clears_schedules_without_mailing
          cargo test --locked --all-features --package crowdrelay-infra --test workspace_secrets_postgres -- --ignored --test-threads=1 \
            seals_reveals_lists_and_deletes \
            secrets_do_not_cross_workspaces
          cargo test --locked --all-features --package crowdrelay-api --test postgres -- --ignored --test-threads=1 \
            an_attestation_is_anchored_once_and_the_anchor_says_so
          # Lib-module proofs that are not their own test target.
          cargo test --locked --all-features --package crowdrelay-worker --lib -- --ignored --test-threads=1 \
            postgres_outbox_round_trip
          cargo test --locked --all-features --package crowdrelay-api --lib -- --ignored --test-threads=1 \
            archive_confirmation_is_not_organic_growth

      # The two gates that need a live schema, and therefore could only ever run
      # here. Both were in `just policy-checks` and in no workflow, so they ran
      # when somebody remembered to run them on a machine whose local database
      # happened to be migrated — which is not a gate.
      #
      # `sql-result-types.py` is the one CLAUDE.md names as covering the cheap
      # half of having no compile-time SQL checking: it PREPAREs every
      # row-returning query and reads the result types sqlx will decode. An
      # uncast EXTRACT returning NUMERIC aborted every autopilot cycle for two
      # hours after compiling, linting and passing the whole suite. It is also a
      # ratchet on the prepared count, and a ratchet nobody runs is a file.
      - name: Gates that require a migrated schema
        run: |
          set -euo pipefail
          python3 scripts/sql-result-types.py
          python3 scripts/test_sql_scalar_types_v1.py
          python3 scripts/fk-index-ratchet.py


      - name: Sweep unattached Docker leftovers
        # Service containers detach their volumes only after the job ends, so
        # each job cleans what the previous one left. Only unattached
        # resources are pruned — in-flight work is never touched.
        if: always()
        continue-on-error: true
        run: docker volume prune -f 2>/dev/null || true

  # The per-push RustSec audit left the gate set for the feature-freeze
  # stage: dependencies barely move, and a `cargo audit` + SBOM job on every
  # push bought nothing. security.yml remains dispatchable by hand.

  summary:
    # Single green check for branch protection.
    name: All checks passed
    needs: [rust-tests]
    if: always()
    runs-on: { group: Default, labels: [self-hosted, arm64] }
    timeout-minutes: 5
    steps:
      - name: Aggregate job results
        shell: bash
        run: |
          set -euo pipefail
          results='"${{ join(needs.*.result, '","') }}"'
          echo "job results: [${results}]"
          for result in ${{ join(needs.*.result, ' ') }}; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              exit 1
            fi
          done
          echo "OK"
