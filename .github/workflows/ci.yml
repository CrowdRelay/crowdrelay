# actions-recovery: 20260806-201024
name: CI

on:
  workflow_dispatch:
  # No paths-ignore on main. `deploy-ecosystem.sh` requires a CI run for HEAD and
  # refuses to deploy without one, so a documentation-only commit on main used to
  # make production undeployable: CI skipped it, no run ever appeared, and the
  # deploy waited an hour for one and failed. Writing something down should not
  # stop a release.
  #
  # Teaching the deploy to fall back to a validated ancestor was the other option
  # and is worse. It would have to decide which differences CI was allowed to
  # ignore, and thread a second SHA through image pulls, the digest artifact and
  # the runtime-SHA verification — four places to be subtly wrong in the release
  # path, against a handful of runner minutes on a self-hosted runner that is
  # free. A release invariant that holds unconditionally is worth more.
  #
  # Pull requests keep the filter: nothing deploys from them, so the time saved
  # there costs nothing.
  push:
    branches: ["main"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job order below keeps every gate command of the shared check chain inside
  # the span the task-runner drift contract inspects (from "Run repository
  # checks" to the summary job); execution itself is fully parallel.
  rust-tests:
    name: Unit tests and contracts
    runs-on: [self-hosted, arm64]
    timeout-minutes: 40

    # The pg-gated lib tests in this job point at 127.0.0.1:5432 and used to
    # borrow whatever happened to be listening there — usually a leftover
    # service container from another job. On a clean box the connect refused
    # for 30s and the only hard-failing one (the trace-timeline test) died
    # with PoolTimedOut. A dedicated service makes the dependency real.
    services:
      postgres:
        image: postgres:19beta3-alpine
        env:
          POSTGRES_DB: crowdrelay
          POSTGRES_USER: crowdrelay
          POSTGRES_PASSWORD: crowdrelay-ci-only
        ports:
          - 5432:5432
        # --tmpfs keeps postgres data in RAM: the 18+ image declares
        # VOLUME /var/lib/postgresql (data goes in a versioned subdir), and
        # without an explicit mount the runner leaves an anonymous volume
        # behind on every run (~7 GB/day of leak measured on this host). The
        # mount must sit at the VOLUME path itself — mounting at
        # /var/lib/postgresql/data trips the image's pg_ctlcluster layout
        # check and the container refuses to start.
        options: >-
          --tmpfs /var/lib/postgresql
          --health-cmd "pg_isready -U crowdrelay -d crowdrelay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      CROWDRELAY_ENV: test
      CROWDRELAY_BIND_ADDR: 127.0.0.1:8080
      CROWDRELAY_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_OUTBOX_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_ADMISSION_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_EVENT_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_AUTOPILOT_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_ECOSYSTEM_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_FAN_LIFECYCLE_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_REFERRAL_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_MOBILE_FAN_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_REMINDER_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_RETENTION_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_COMMUNITY_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_DATABASE_MAX_CONNECTIONS: 5
      CROWDRELAY_ALLOWED_ORIGINS: http://localhost:4321
      CROWDRELAY_WORKSPACE_SLUG: example
      CROWDRELAY_PUBLIC_SITE_BASE_URL: http://localhost:4321
      CROWDRELAY_DEFAULT_COUNTRY_CODE: PL
      CROWDRELAY_TENANT_REGION: eu
      CROWDRELAY_TENANT_LOCALE: pl-PL
      CROWDRELAY_TENANT_TIMEZONE: Europe/Warsaw
      CROWDRELAY_TENANT_CURRENCY: PLN
      CROWDRELAY_TENANT_DATE_FORMAT: dmy
      CROWDRELAY_TENANT_NUMBER_FORMAT: comma_decimal
      CROWDRELAY_TENANT_DATA_REGION: eu
      CROWDRELAY_RANDOM_DRAWS_ENABLED: "false"
      CROWDRELAY_BOOTSTRAP_JSON: >-
        {"workspace_name":"CrowdRelay CI","cities":[{"slug":"wroclaw","name":"Wroclaw","country":"PL","region":"Dolnoslaskie","lat":51.1079,"lng":17.0385}],"campaigns":[{"name":"CI launch","active":true,"smart_links":[{"slug":"ci-launch","destination_url":"http://localhost:4321/join","active":true}]}],"webhook_endpoints":[]}
      RUST_LOG: info

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Activate repository-pinned Rust toolchain
        run: |
          echo "/home/ubuntu/.cargo/bin" >> "$GITHUB_PATH"
          echo "RUSTUP_HOME=/home/ubuntu/.rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=/home/ubuntu/.cargo" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Purge stale Rust cache entries
        # Swatinem/rust-cache keys on Cargo.lock hash; each lock change leaves
        # the previous ~640 MB entry orphaned until 7-day TTL. Prune old
        # entries before saving a new one to stay within the account quota.
        if: github.ref == 'refs/heads/main' && github.job == 'rust-tests'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ids < <(gh api "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | select(.key | startswith("v0-rust-")) | .id' 2>/dev/null || true)
          for id in "${ids[@]}"; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${id}" 2>/dev/null || true
          done
          echo "Purged ${#ids[@]} stale Rust cache entries"
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Every pull request run used to save its own ~640 MB entry into the
          # 10 GB Actions pool. Pull requests restore from the default branch
          # instead; only the default branch writes, and exactly one of the
          # parallel jobs writes it so they cannot thrash the cache pool.
          save-if: ${{ github.ref == 'refs/heads/main' && github.job == 'rust-tests' }}

      - name: Run repository checks
        # Format and lint run first inside this block: cheap gates fail fast
        # instead of surfacing twenty minutes into a compile the run was never
        # going to survive. They live inside this step rather than their own
        # because the task-runner drift contract asserts the whole check chain
        # in the span starting at this step's name. The retired rust-checks
        # job bought a second checkout and toolchain setup — zero parallelism
        # on the single self-hosted runner.
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets --all-features
          node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/validate-contract-assets.ts
          # The source-reading contract suite. ~937 assertions across 150+
          # scripts; every one passed when this was restored. It was dropped
          # from CI in 536092c, a deploy commit, with no failing test to
          # justify it — the scripts stayed in the tree and stopped running.
          python3 -m unittest discover -s scripts -p 'test_*.py'
          bash scripts/audit-public-tree.sh
          python3 scripts/check-ci-policy.py
          # Scripts `unittest discover` cannot match: hyphenated names, or no
          # `test_` prefix. Listed explicitly or they never run.
          python3 scripts/source-size-ratchet.py
          python3 scripts/api-sql-ratchet.py
          # The third ratchet. CLAUDE.md presents all three together as the most
          # common self-inflicted CI failure; this one was not in any workflow,
          # so it was not a CI failure at all. It needs no database — pure source
          # analysis, sub-second — and it is the whole of tenant isolation: a
          # statement reading one of the 232 workspace_id-bearing tables without
          # naming the workspace fails it.
          python3 scripts/workspace-scope-ratchet.py
          python3 scripts/test-modularity-contract.py
          python3 scripts/test_platform_vocabulary_v1.py
          python3 scripts/test_sql_identifiers_v1.py
          python3 scripts/test_sql_columns_v1.py
          python3 scripts/check-postgres-major.py
          python3 scripts/postgres18_runtime_contract.py
          python3 scripts/area_wallet_authority_v2_contract.py
          python3 scripts/staff_device_sessions_v2_contract.py
          python3 scripts/test-ecosystem-contract-v2.py
          python3 scripts/test-ops-control-plane-v2.py
          python3 scripts/test-ecosystem-design-contract.py
          python3 scripts/test-image-provenance-policy.py
          python3 scripts/test_release_receipt.py
          python3 scripts/test_ecosystem_deploy_contract.py

      - name: Check generated deployment files stay ignored
        shell: bash
        run: |
          set -euo pipefail
          for generated in \
            .crowdrelay.local.sh \
            .crowdrelay-artifacts/crowdrelay-test.tar.gz \
            deploy/.env.production \
            ./deploy/bootstrap.production.json \
            ./deploy/webhook-secrets.production.json \
            deploy/backups/crowdrelay-test.dump \
            backups/crowdrelay-test.dump \
            crowdrelay-test.dump \
            crowdrelay-test.dump.age \
            .crowdrelay-maintenance.lock
          do
            git check-ignore --quiet "$generated"
          done
          for example in \
            .crowdrelay.local.sh.example \
            deploy/env.production.example \
            ./deploy/bootstrap.example.json \
            ./deploy/webhook-secrets.example.json
          do
            if git check-ignore --no-index --quiet "$example"; then
              echo "Tracked deployment example must not be ignored: $example" >&2
              exit 1
            fi
          done

      # Moved here from the standalone deploy-config job — nine seconds of
      # work no longer pays a full job setup on a serial runner.
      - name: Validate Compose and Bake configuration
        env:
          CROWDRELAY_ENV_FILE: .env.example
        run: |
          docker buildx bake --file docker-bake.hcl --print >/dev/null
          docker compose config --quiet
          production_images="$(
            CROWDRELAY_IMAGE_TAG=sha-0000000000000000000000000000000000000000 \
            CROWDRELAY_DOCKER_NETWORK=crowdrelay-ci \
            CROWDRELAY_ENV_FILE=deploy/env.production.example \
            CROWDRELAY_BOOTSTRAP_HOST_FILE=./deploy/bootstrap.example.json \
            CROWDRELAY_WEBHOOK_SECRETS_HOST_FILE=./deploy/webhook-secrets.example.json \
              docker compose \
                --env-file deploy/env.production.example \
                --file compose.production.yaml \
                config \
                --images
          )"
          # Every image CrowdRelay builds must be pinned to the build sha, and
          # there must be exactly three of them (api, worker, and the worker
          # image again for the migrate service). Upstream images are pinned by
          # their own tag instead, which is a different rule -- asserting the
          # sha over the whole list broke the moment `5c5e5a1` moved postgres
          # into this compose file.
          own_images="$(printf '%s\n' "$production_images" | grep '^ghcr.io/crowdrelay/' || true)"
          image_count="$(printf '%s\n' "$own_images" | awk 'NF { count++ } END { print count+0 }')"
          [[ "$image_count" -eq 3 ]]
          while IFS= read -r image; do
            [[ -n "$image" ]] || continue
            [[ "${image##*:}" == "sha-0000000000000000000000000000000000000000" ]]
          done <<< "$own_images"
          # Upstream images carry an explicit version, never a floating tag.
          while IFS= read -r image; do
            [[ -n "$image" ]] || continue
            case "$image" in
              ghcr.io/crowdrelay/*) continue ;;
            esac
            [[ "$image" == *:* ]]
            [[ "${image##*:}" != "latest" ]]
          done <<< "$production_images"
          digest="sha256:$(printf '0%.0s' {1..64})"
          digest_images="$(
            CROWDRELAY_IMAGE_TAG=sha-0000000000000000000000000000000000000000 \
            CROWDRELAY_DOCKER_NETWORK=crowdrelay-ci \
            CROWDRELAY_ENV_FILE=deploy/env.production.example \
            CROWDRELAY_BOOTSTRAP_HOST_FILE=./deploy/bootstrap.example.json \
            CROWDRELAY_WEBHOOK_SECRETS_HOST_FILE=./deploy/webhook-secrets.example.json \
            CROWDRELAY_API_IMAGE_REF="ghcr.io/crowdrelay/crowdrelay-api@$digest" \
            CROWDRELAY_WORKER_IMAGE_REF="ghcr.io/crowdrelay/crowdrelay-worker@$digest" \
              docker compose \
                --env-file deploy/env.production.example \
                --file compose.production.yaml \
                --file compose.production.digest.yaml \
                config --images
          )"
          [[ "$(printf '%s\n' "$digest_images" | grep -c '@sha256:')" -eq 3 ]]
          ./scripts/audit-public-tree.sh

      - name: Sweep unattached Docker leftovers
        # Service containers detach their volumes only after the job ends, so
        # each job cleans what the previous one left. Only unattached
        # resources are pruned — in-flight work is never touched.
        if: always()
        continue-on-error: true
        run: docker volume prune -f 2>/dev/null || true

  rust-postgres:
    name: PostgreSQL integration
    runs-on: [self-hosted, arm64]
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:19beta3-alpine
        env:
          POSTGRES_DB: crowdrelay
          POSTGRES_USER: crowdrelay
          POSTGRES_PASSWORD: crowdrelay-ci-only
        ports:
          - 5432:5432
        # --tmpfs keeps postgres data in RAM: the 18+ image declares
        # VOLUME /var/lib/postgresql (data goes in a versioned subdir), and
        # without an explicit mount the runner leaves an anonymous volume
        # behind on every run (~7 GB/day of leak measured on this host). The
        # mount must sit at the VOLUME path itself — mounting at
        # /var/lib/postgresql/data trips the image's pg_ctlcluster layout
        # check and the container refuses to start.
        options: >-
          --tmpfs /var/lib/postgresql
          --health-cmd "pg_isready -U crowdrelay -d crowdrelay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      CROWDRELAY_ENV: test
      CROWDRELAY_BIND_ADDR: 127.0.0.1:8080
      CROWDRELAY_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_OUTBOX_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_ADMISSION_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_EVENT_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_AUTOPILOT_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_ECOSYSTEM_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_FAN_LIFECYCLE_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_REFERRAL_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_MOBILE_FAN_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_REMINDER_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_RETENTION_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_COMMUNITY_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_DATABASE_MAX_CONNECTIONS: 5
      CROWDRELAY_ALLOWED_ORIGINS: http://localhost:4321
      CROWDRELAY_WORKSPACE_SLUG: example
      CROWDRELAY_PUBLIC_SITE_BASE_URL: http://localhost:4321
      CROWDRELAY_DEFAULT_COUNTRY_CODE: PL
      CROWDRELAY_TENANT_REGION: eu
      CROWDRELAY_TENANT_LOCALE: pl-PL
      CROWDRELAY_TENANT_TIMEZONE: Europe/Warsaw
      CROWDRELAY_TENANT_CURRENCY: PLN
      CROWDRELAY_TENANT_DATE_FORMAT: dmy
      CROWDRELAY_TENANT_NUMBER_FORMAT: comma_decimal
      CROWDRELAY_TENANT_DATA_REGION: eu
      CROWDRELAY_RANDOM_DRAWS_ENABLED: "false"
      CROWDRELAY_BOOTSTRAP_JSON: >-
        {"workspace_name":"CrowdRelay CI","cities":[{"slug":"wroclaw","name":"Wroclaw","country":"PL","region":"Dolnoslaskie","lat":51.1079,"lng":17.0385}],"campaigns":[{"name":"CI launch","active":true,"smart_links":[{"slug":"ci-launch","destination_url":"http://localhost:4321/join","active":true}]}],"webhook_endpoints":[]}
      RUST_LOG: info

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Activate repository-pinned Rust toolchain
        run: |
          echo "/home/ubuntu/.cargo/bin" >> "$GITHUB_PATH"
          echo "RUSTUP_HOME=/home/ubuntu/.rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=/home/ubuntu/.cargo" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false

      # --all-features matches what clippy/test compile downstream; building
      # the setup binary once with the same feature set avoids a second
      # full-feature recompilation of the workspace in this job.
      - name: Run idempotent database and workspace setup
        run: |
          cargo run --locked --all-features --package crowdrelay-worker -- setup
          cargo run --locked --all-features --package crowdrelay-worker -- setup

      # Every integration target is discovered from the tree rather than
      # listed. The previous hand-written list named 9 of 24 suites, so every
      # autopilot_* one — including the growth-intelligence paths — never ran
      # in CI. A suite that exists but is not enumerated is a suite nobody runs.
      - name: Test all PostgreSQL integration paths
        shell: bash
        env:
          # Suites run in PG_SHARDS parallel lanes, each against its own
          # database cloned from the migrated template. Set to 1 for the
          # historical fully-serial single-database behavior.
          PG_SHARDS: "3"
        run: |
          set -euo pipefail
          shopt -s nullglob
          # autopilot_experiment_integrity_postgres ran quarantined for a while
          # at 35 passing / 6 failing. The six shared one cause, and it was a
          # question rather than a bug: a Treatment-arm assignment produces no
          # growth evidence, because `record_experiment_assignment` writes
          # evidence only for Control and Treatment evidence is written at
          # dispatch. Whether a Treatment assignment constitutes an episode at
          # assignment time was the open invariant.
          #
          # It does not. A control unit is never dispatched, so assignment is
          # the only moment it can be observed; a treatment unit is dispatched,
          # and that is when it is observed. Writing treatment evidence early
          # would also be actively wrong: the evidence insert dedupes
          # ON CONFLICT (workspace_id, action_id) DO NOTHING, so an early row
          # makes the dispatch-time write a silent no-op and freezes the
          # assignment-time prediction into the record.
          #
          # So the six tests now dispatch through `persist_treatment_with_
          # assignment` — the path production runs — instead of recording an
          # assignment and expecting evidence to appear. The suite is at 41/41
          # and back in CI. Two of the six were passing for the wrong reason
          # before: one asserted an action status the fixture had set itself,
          # and one decoded `observed_fans` as non-null on an unresolved
          # dispatch.
          quarantined=""
          targets=()
          for path in crates/*/tests/*_postgres.rs; do
            package="$(basename "$(dirname "$(dirname "$path")")")"
            target="$(basename "$path" .rs)"
            if [ -n "$quarantined" ] && [ "$target" = "$quarantined" ]; then
              echo "::warning::skipping quarantined suite $target"
              continue
            fi
            targets+=("$package:$target")
          done
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "no *_postgres.rs integration targets found; the glob is wrong" >&2
            exit 1
          fi
          printf 'running %s integration targets\n' "${#targets[@]}"

          # Ignored Postgres tests that live in unit-test modules rather than
          # their own integration target, so the glob above cannot see them.
          worker_filters=(
            postgres_outbox_round_trip
            due_reminder_is_enqueued_exactly_once
            cycle_deletes_expired_rows_scrubs_safe_payloads_and_preserves_audit
            publishing_adopts_the_drafts_manual_mode_wrote
            manual_mode_leaves_its_own_drafts_alone
            the_rate_limit_defers_a_draft_instead_of_failing_it
            every_component_is_recorded_with_its_missing_switch
            a_transient_failure_defers_the_draft_and_spares_the_action
            an_exhausted_draft_fails_and_corrects_the_ledger
          )

          run_suite() {
            local package="$1" target="$2" db="$3"
            local url="postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/${db}"
            CROWDRELAY_DATABASE_URL="$url" \
            CROWDRELAY_TEST_DATABASE_URL="$url" \
            CROWDRELAY_OUTBOX_TEST_DATABASE_URL="$url" \
            CROWDRELAY_ADMISSION_TEST_DATABASE_URL="$url" \
            CROWDRELAY_EVENT_TEST_DATABASE_URL="$url" \
            CROWDRELAY_AUTOPILOT_TEST_DATABASE_URL="$url" \
            CROWDRELAY_ECOSYSTEM_TEST_DATABASE_URL="$url" \
            CROWDRELAY_FAN_LIFECYCLE_TEST_DATABASE_URL="$url" \
            CROWDRELAY_REFERRAL_TEST_DATABASE_URL="$url" \
            CROWDRELAY_MOBILE_FAN_TEST_DATABASE_URL="$url" \
            CROWDRELAY_REMINDER_TEST_DATABASE_URL="$url" \
            CROWDRELAY_RETENTION_TEST_DATABASE_URL="$url" \
            CROWDRELAY_COMMUNITY_TEST_DATABASE_URL="$url" \
            CROWDRELAY_AGENTS_TEST_DATABASE_URL="$url" \
            cargo test --locked \
              --package "$package" \
              --test "$target" \
              -- \
              --ignored \
              --nocapture \
              --test-threads=1
          }

          run_worker_filter() {
            local filter="$1" db="$2"
            local url="postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/${db}"
            CROWDRELAY_DATABASE_URL="$url" \
            CROWDRELAY_TEST_DATABASE_URL="$url" \
            CROWDRELAY_OUTBOX_TEST_DATABASE_URL="$url" \
            CROWDRELAY_ADMISSION_TEST_DATABASE_URL="$url" \
            CROWDRELAY_EVENT_TEST_DATABASE_URL="$url" \
            CROWDRELAY_AUTOPILOT_TEST_DATABASE_URL="$url" \
            CROWDRELAY_ECOSYSTEM_TEST_DATABASE_URL="$url" \
            CROWDRELAY_FAN_LIFECYCLE_TEST_DATABASE_URL="$url" \
            CROWDRELAY_REFERRAL_TEST_DATABASE_URL="$url" \
            CROWDRELAY_MOBILE_FAN_TEST_DATABASE_URL="$url" \
            CROWDRELAY_REMINDER_TEST_DATABASE_URL="$url" \
            CROWDRELAY_RETENTION_TEST_DATABASE_URL="$url" \
            CROWDRELAY_COMMUNITY_TEST_DATABASE_URL="$url" \
            CROWDRELAY_AGENTS_TEST_DATABASE_URL="$url" \
            cargo test --locked \
              --package crowdrelay-worker \
              "$filter" \
              -- \
              --ignored \
              --nocapture \
              --test-threads=1
          }

          if [ "${PG_SHARDS}" -le 1 ]; then
            # Serial fallback: every suite against the shared `crowdrelay`
            # database, exactly the historical behavior.
            for entry in "${targets[@]}"; do
              package="${entry%%:*}"
              target="${entry##*:}"
              printf '::group::%s / %s\n' "$package" "$target"
              run_suite "$package" "$target" "crowdrelay"
              echo '::endgroup::'
            done
            for filter in "${worker_filters[@]}"; do
              printf '::group::crowdrelay-worker / %s\n' "$filter"
              run_worker_filter "$filter" "crowdrelay"
              echo '::endgroup::'
            done
          else
            # Per-suite databases cloned from the migrated `crowdrelay`
            # template: lanes run concurrently without ever seeing each
            # other's rows. The template must have no open connections while
            # it is copied — the setup binary exited in the previous step.
            psql_url="postgres://crowdrelay:crowdrelay-ci-only@127.0.0.1:5432/postgres"
            psql "$psql_url" -v ON_ERROR_STOP=1 -qAt \
              -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname='crowdrelay' AND pid <> pg_backend_pid()" || true
            for entry in "${targets[@]}"; do
              target="${entry##*:}"
              psql "$psql_url" -v ON_ERROR_STOP=1 -qAt \
                -c "CREATE DATABASE ci_${target} WITH TEMPLATE crowdrelay"
            done
            psql "$psql_url" -v ON_ERROR_STOP=1 -qAt \
              -c "CREATE DATABASE ci_worker_filters WITH TEMPLATE crowdrelay"

            lane() {
              local lane_id="$1"; shift
              for entry in "$@"; do
                package="${entry%%:*}"
                target="${entry##*:}"
                printf '::group::%s / %s\n' "$package" "$target"
                run_suite "$package" "$target" "ci_${target}"
                echo '::endgroup::'
              done
              # The unit-module filters share one dedicated database and run
              # serially on lane 0, preserving their historical isolation
              # semantics while the other lanes finish their suites.
              if [ "${lane_id}" -eq 0 ]; then
                for filter in "${worker_filters[@]}"; do
                  printf '::group::crowdrelay-worker / %s\n' "$filter"
                  run_worker_filter "$filter" "ci_worker_filters"
                  echo '::endgroup::'
                done
              fi
            }

            pids=()
            for (( lane_id=0; lane_id<PG_SHARDS; lane_id++ )); do
              lane_targets=()
              for (( i=lane_id; i<${#targets[@]}; i+=PG_SHARDS )); do
                lane_targets+=("${targets[$i]}")
              done
              lane "$lane_id" "${lane_targets[@]}" > "/tmp/pg-lane-${lane_id}.log" 2>&1 &
              pids+=($!)
            done
            failed=0
            for pid in "${pids[@]}"; do
              wait "$pid" || failed=1
            done
            for (( lane_id=0; lane_id<PG_SHARDS; lane_id++ )); do
              cat "/tmp/pg-lane-${lane_id}.log"
            done
            [ "${failed}" -eq 0 ]
          fi

      # The two gates that need a live schema, and therefore could only ever run
      # here. Both were in `just policy-checks` and in no workflow, so they ran
      # when somebody remembered to run them on a machine whose local database
      # happened to be migrated — which is not a gate.
      #
      # `sql-result-types.py` is the one CLAUDE.md names as covering the cheap
      # half of having no compile-time SQL checking: it PREPAREs every
      # row-returning query and reads the result types sqlx will decode. An
      # uncast EXTRACT returning NUMERIC aborted every autopilot cycle for two
      # hours after compiling, linting and passing the whole suite. It is also a
      # ratchet on the prepared count, and a ratchet nobody runs is a file.
      - name: Gates that require a migrated schema
        run: |
          set -euo pipefail
          python3 scripts/sql-result-types.py
          python3 scripts/test_sql_scalar_types_v1.py

      - name: Sweep unattached Docker leftovers
        if: always()
        continue-on-error: true
        run: docker volume prune -f 2>/dev/null || true

  dependency-security:
    name: Dependency security
    # Single definition lives in security.yml; calling it here keeps image
    # publication unable to observe CI=PASS while RustSec is red, without
    # maintaining a second copy of the audit job.
    uses: ./.github/workflows/security.yml

  containers:
    name: Build container targets
    if: github.event_name == 'pull_request'
    # Production runs on virya-crowdrelay (linux/arm64). The PR gate builds
    # the same platform that ships, so green CI means a deployable image.
    # Uses a self-hosted runner on virya-crowdrelay itself — free, unlimited,
    # and the same ARM64 hardware that production deploys to.
    runs-on: [self-hosted, arm64]
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Read-only access to the build cache published from the default branch.
      # Fork pull requests get a token without package scope; a failed login
      # only costs this job its cache hit, so it must not fail the build.
      - name: Log in to GHCR for the shared build cache
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reads the cache the publish workflow writes and deliberately writes none
      # back: a pull request must not be able to move the cache the release
      # build depends on. The variable is not called CACHE_REF because
      # docker-bake.hcl reads that name from the environment, which would hand
      # this job the writing cache-to export as well.
      # buildx bake auto-loads docker-compose.yml next to the HCL, and that
      # file declares `env_file: .env` for runtime services. The PR gate only
      # builds, so an operator-local .env is irrelevant — but its absence
      # fails bake's compose parsing before a single layer compiles.
      - name: Provide the compose env placeholder
        run: touch .env

      - name: Build both runtime targets once
        run: |
          owner_lower="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          build_cache_ref="ghcr.io/${owner_lower}/crowdrelay-buildcache:arm64"
          docker buildx bake --file docker-bake.hcl \
            --set '*.platform=linux/arm64' \
            --set "*.cache-from=type=registry,ref=${build_cache_ref}" \
            --set '*.output=type=cacheonly'

      - name: Prune stale BuildKit cache after build
        if: always()
        continue-on-error: true
        run: |
          docker builder prune --filter until=72h -f 2>/dev/null || true
          docker volume prune -f 2>/dev/null || true

  summary:
    # Single green check for branch protection, and the relation view for the
    # run panel: everything above reports into one node instead of eight
    # independent dots.
    name: All checks passed
    needs: [rust-tests, rust-postgres, dependency-security, containers]
    if: always()
    runs-on: [self-hosted, arm64]
    timeout-minutes: 5
    steps:
      - name: Aggregate job results
        shell: bash
        run: |
          set -euo pipefail
          results='"${{ join(needs.*.result, '","') }}"'
          echo "job results: [${results}]"
          for result in ${{ join(needs.*.result, ' ') }}; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              exit 1
            fi
          done
          # Skipped containers on non-PR pushes are fine; a skipped security
          # scan is not, and the pinned audit job never skips.
          echo "OK"
