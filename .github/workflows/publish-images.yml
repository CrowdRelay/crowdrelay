name: Publish container images

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write
  actions: write

concurrency:
  group: publish-images-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
  # The Rust build graph is cached in GHCR rather than the Actions cache. The
  # Actions cache is a single 10 GB LRU pool shared with the Swatinem Rust
  # caches, so a mode=max BuildKit export kept evicting itself between runs and
  # every publish recompiled the workspace from scratch.
  # CACHE_REF and OWNER_LOWER are set in the first build step because Docker
  # requires lowercase repository names and GitHub org names are case-preserving.

jobs:
  build:
    # workflow_run already guarantees the source workflow is CI. Restrict the
    # release solely to a successful CI result for the repository default
    # branch; do not additionally key off the source event type, which can be
    # reported inconsistently by chained workflow executions and previously
    # caused a valid exact-main release to be skipped.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch

    # Production runs on virya-crowdrelay (linux/arm64, Ampere A1.Flex).
    # The image is built natively and pushed under an arch-suffixed tag;
    # the merge job joins it into the release tag the deploy resolves to.
    # QEMU is deliberately absent: emulating a Rust release build costs hours.
    # Uses a self-hosted runner on virya-crowdrelay itself — free, unlimited,
    # and the same ARM64 hardware that production deploys to.
    runs-on: [self-hosted, arm64]
    timeout-minutes: 60

    steps:
      - name: Check out the exact validated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.IMAGE_SHA }}

      - name: Resolve immutable build identity
        shell: bash
        run: |
          set -Eeuo pipefail
          build_timestamp="$(git show -s --format=%cI "${IMAGE_SHA}")"
          [[ -n "$build_timestamp" ]] || { echo "Missing commit timestamp for ${IMAGE_SHA}" >&2; exit 1; }
          echo "BUILD_TIMESTAMP=${build_timestamp}" >> "$GITHUB_ENV"
          # Docker tags and cache refs must be lowercase, but GitHub org names
          # are case-preserving (e.g. "CrowdRelay"). Lowercase once here.
          owner_lower="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "OWNER_LOWER=${owner_lower}" >> "$GITHUB_ENV"
          echo "CACHE_REF=ghcr.io/${owner_lower}/crowdrelay-buildcache" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # API and worker descend from one `builder` stage. Two separate
      # build-push-action steps compiled that stage inside two buildx
      # invocations and each re-exported a mode=max Rust cache for it. Baking
      # both targets together builds the shared graph once and exports the
      # cache once.
      - name: Build and publish API and worker images
        id: images
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          API_IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER_LOWER }}/crowdrelay-api:sha-${{ env.IMAGE_SHA }}-arm64
          WORKER_IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER_LOWER }}/crowdrelay-worker:sha-${{ env.IMAGE_SHA }}-arm64
          CROWDRELAY_GIT_SHA: ${{ env.IMAGE_SHA }}
          CROWDRELAY_BUILD_TIMESTAMP: ${{ env.BUILD_TIMESTAMP }}
          # One cache tag per architecture. A shared tag would have the two
          # matrix legs overwrite each other's mode=max export every run.
          CACHE_REF: ${{ env.CACHE_REF }}:arm64
        with:
          files: docker-bake.hcl
          targets: api,worker
          set: |
            *.platform=linux/arm64
          push: true
          provenance: mode=max
          sbom: true

      - name: Build and publish Rekor proof anchor image
        id: rekor-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: proofs/rekor-anchor/relayer
          platforms: linux/arm64
          push: true
          tags: >-
            ${{ env.REGISTRY }}/${{ env.OWNER_LOWER }}/crowdrelay-rekor-proof-anchor:sha-${{ env.IMAGE_SHA }}-arm64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.IMAGE_SHA }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.title=crowdrelay-rekor-proof-anchor
          provenance: mode=max
          sbom: true

      - name: Prune BuildKit cache after build
        if: always()
        continue-on-error: true
        run: docker builder prune --all -f 2>/dev/null || true

      # Per-architecture digests are an intermediate product. The release
      # identity is the merged manifest list, so it is recorded in `merge`.
      - name: Record per-architecture digests
        env:
          BAKE_METADATA: ${{ steps.images.outputs.metadata }}
          REKOR_DIGEST: ${{ steps.rekor-image.outputs.digest }}
        run: |
          set -Eeuo pipefail
          # bake reports every target in one metadata document; pull each
          # digest out by target name rather than by step output.
          API_DIGEST="$(jq -er '.api["containerimage.digest"]' <<<"$BAKE_METADATA")"
          WORKER_DIGEST="$(jq -er '.worker["containerimage.digest"]' <<<"$BAKE_METADATA")"
          for value in "$API_DIGEST" "$WORKER_DIGEST" "$REKOR_DIGEST"; do
            [[ "$value" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Invalid image digest: $value" >&2; exit 1; }
          done
          printf '%s api=%s worker=%s rekor=%s\n' \
            "arm64" "$API_DIGEST" "$WORKER_DIGEST" "$REKOR_DIGEST"

  merge:
    needs: build
    name: Merge release manifests
    runs-on: [self-hosted, arm64]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The deploy tag must be one manifest list containing every production
      # platform. `ops/resolve-image-digests.sh` pulls this tag on the host and
      # records the index digest, so a host of either architecture resolves the
      # same release to the image built for it.
      - name: Merge per-architecture manifests into the release tag
        run: |
          set -Eeuo pipefail
          # Docker tags must be lowercase; GitHub org names are case-preserving.
          owner_lower="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          mkdir -p image-digests
          printf 'CROWDRELAY_RELEASE_SHA=%s\n' "${IMAGE_SHA}" > image-digests/images.env

          merge() {
            local repo="$1" var="$2" target digest platforms
            target="${REGISTRY}/${owner_lower}/${repo}:sha-${IMAGE_SHA}"
            docker buildx imagetools create --tag "$target" "${target}-arm64"

            digest="$(docker buildx imagetools inspect "$target" --format '{{.Manifest.Digest}}')"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "Invalid image digest for ${repo}: ${digest}" >&2; exit 1; }

            # An index missing a production platform is an undeployable release.
            platforms="$(docker buildx imagetools inspect "$target" --raw \
              | jq -r '[.manifests[].platform | select(.os == "linux")
                        | "\(.os)/\(.architecture)"] | unique | join(" ")')"
            for required in linux/arm64; do
              [[ " $platforms " == *" $required "* ]] || {
                echo "${repo}: published manifest lacks ${required} (has: ${platforms})" >&2; exit 1; }
            done

            printf '%s=%s\n' "$var" "$digest" >> image-digests/images.env
          }

          merge crowdrelay-api CROWDRELAY_API_DIGEST
          merge crowdrelay-worker CROWDRELAY_WORKER_DIGEST
          merge crowdrelay-rekor-proof-anchor CROWDRELAY_REKOR_DIGEST
          sha256sum image-digests/images.env > image-digests/images.env.sha256
          cat image-digests/images.env

      - name: Purge stale artifacts before upload
        # Account-wide Actions storage quota is tight; old dockerbuild
        # and digest artifacts from previous runs linger until retention
        # expires. Delete them before uploading the current run's artifact.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ids < <(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.workflow_run.id != ${GITHUB_RUN_ID}) | select(.created_at < (now - 7200 | strftime("%Y-%m-%dT%H:%M:%SZ"))) | .id" 2>/dev/null || true)
          for id in "${ids[@]}"; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" 2>/dev/null || true
          done
          echo "Purged ${#ids[@]} stale artifact(s)"

      - name: Upload immutable digest manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crowdrelay-image-digests-${{ env.IMAGE_SHA }}
          path: image-digests/
          if-no-files-found: error
          retention-days: 3

      # GHCR packages inherit the org's default visibility (private) on first
      # publish. The production host pulls anonymously, so every package must
      # be public. This step is idempotent — PATCH with the same visibility is
      # a no-op once the package is already public.
      - name: Ensure package visibility is public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          owner_lower="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          for pkg in crowdrelay-api crowdrelay-worker crowdrelay-rekor-proof-anchor; do
            echo "Setting ${pkg} to public…"
            # The GITHUB_TOKEN in Actions has packages:write for the org's
            # packages, so this API call works without a PAT.
            gh api -X PATCH "/orgs/${owner_lower}/packages/container/${pkg}" \
              -f visibility=public 2>/dev/null \
              || gh api -X PATCH "/user/packages/container/${pkg}" \
              -f visibility=public 2>/dev/null \
              || echo "WARN: could not set ${pkg} visibility (may already be public or token lacks scope)"
          done

  deploy:
    needs: merge
    name: Deploy to production
    runs-on: [self-hosted, arm64]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    env:
      DEPLOY_DIR: /opt/crowdrelay
      COMPOSE_FILE: compose.production.yaml
      ENV_FILE: deploy/.env.production

    steps:
      - name: Resolve image identity
        shell: bash
        run: |
          set -euo pipefail
          echo "IMAGE_TAG=sha-${IMAGE_SHA}" >> "$GITHUB_ENV"
          owner_lower="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "API_IMAGE=ghcr.io/${owner_lower}/crowdrelay-api:sha-${IMAGE_SHA}" >> "$GITHUB_ENV"
          echo "WORKER_IMAGE=ghcr.io/${owner_lower}/crowdrelay-worker:sha-${IMAGE_SHA}" >> "$GITHUB_ENV"

      - name: Pull validated images from GHCR
        shell: bash
        run: |
          set -euo pipefail
          for img in "${API_IMAGE}" "${WORKER_IMAGE}"; do
            echo "Pulling ${img}..."
            docker pull "$img"
            architecture="$(docker image inspect "$img" --format '{{.Architecture}}')"
            [[ "$architecture" == "arm64" ]] || { echo "ERROR: wrong architecture for $img: $architecture" >&2; exit 1; }
          done
          echo "PULL=PASS"

      - name: Deploy — update env and restart containers
        shell: bash
        run: |
          set -euo pipefail
          cd "${DEPLOY_DIR}"
          # Record previous tag for rollback
          PREV_TAG="$(grep '^CROWDRELAY_IMAGE_TAG=' "${ENV_FILE}" 2>/dev/null | cut -d= -f2 || echo "")"
          echo "PREV_TAG=${PREV_TAG}" >> "$GITHUB_ENV"
          # Update the image tag in the env file
          sudo sed -i "s|^CROWDRELAY_IMAGE_TAG=.*|CROWDRELAY_IMAGE_TAG=${IMAGE_TAG}|" "${ENV_FILE}"
          grep -q "CROWDRELAY_IMAGE_TAG=${IMAGE_TAG}" "${ENV_FILE}" || {
            echo "ERROR: failed to update CROWDRELAY_IMAGE_TAG" >&2; exit 1; }
          echo "ENV=PASS tag=${IMAGE_TAG}"

          # Run migrations with the new worker image, then restart API and worker.
          # Migrations are idempotent and run in a one-shot container.
          sudo docker compose --env-file "${ENV_FILE}" -f "${COMPOSE_FILE}" run --rm migrate || true
          # Recreate API and worker containers with the new image
          sudo docker compose --env-file "${ENV_FILE}" -f "${COMPOSE_FILE}" up -d --no-deps api worker
          echo "COMPOSE_UP=PASS"

      - name: Health check — wait for API readiness
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for CrowdRelay API readiness..."
          for i in $(seq 1 40); do
            if curl -fsS --connect-timeout 3 --max-time 5 http://127.0.0.1:8080/v1/health/ready >/dev/null 2>&1; then
              echo "HEALTH=PASS ready after ${i} attempt(s)"
              exit 0
            fi
            sleep 3
          done
          echo "ERROR: API did not become ready in 120s" >&2
          # Rollback: restore previous tag and restart
          if [[ -n "${PREV_TAG:-}" ]]; then
            echo "Rolling back to ${PREV_TAG}..."
            cd "${DEPLOY_DIR}"
            sudo sed -i "s|^CROWDRELAY_IMAGE_TAG=.*|CROWDRELAY_IMAGE_TAG=${PREV_TAG}|" "${ENV_FILE}"
            sudo docker compose --env-file "${ENV_FILE}" -f "${COMPOSE_FILE}" up -d --no-deps api worker
          fi
          exit 1

      - name: Verify deployed revision
        shell: bash
        run: |
          set -euo pipefail
          running_tag="$(docker inspect crowdrelay-api-1 --format '{{index .Config.Labels "io.crowdrelay.release.ref"}}' 2>/dev/null || echo "")"
          [[ "$running_tag" == "${IMAGE_TAG}" ]] || {
            echo "ERROR: running tag $running_tag != expected ${IMAGE_TAG}" >&2; exit 1; }
          echo "REVISION=PASS tag=${running_tag}"

      - name: Cleanup — prune old images and build cache
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          docker builder prune --all -f 2>/dev/null || true
          docker image prune -f 2>/dev/null || true
          # Keep only the 2 newest images per family (latest + rollback)
          running_images="$(docker inspect $(docker ps -q) --format '{{.Image}}' 2>/dev/null | sort -u || echo "")"
          for family in crowdrelay-api crowdrelay-worker crowdrelay-rekor-proof-anchor; do
            docker images --format '{{.Repository}}:{{.Tag}}\t{{.ID}}' 2>/dev/null \
              | grep -E "(^|/)${family}:sha-" \
              | sort -r \
              | tail -n +3 \
              | while IFS=$'\t' read -r repo_tag image_id; do
                echo "$running_images" | grep -q "$image_id" && continue
                docker rmi "$image_id" 2>/dev/null && echo "  pruned $repo_tag" || true
              done
          done
          echo "CLEANUP=PASS"
