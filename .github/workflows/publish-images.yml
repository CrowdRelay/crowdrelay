name: Publish container images

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: publish-images-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
  CACHE_SCOPE: crowdrelay-images

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch

    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out the exact validated revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.IMAGE_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        id: api-image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: api
          platforms: linux/amd64
          push: true
          tags: >-
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/crowdrelay-api:sha-${{ env.IMAGE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.IMAGE_SHA }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.title=crowdrelay-api
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}
          provenance: mode=max
          sbom: true

      - name: Build and publish worker image
        id: worker-image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: worker
          platforms: linux/amd64
          push: true
          tags: >-
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/crowdrelay-worker:sha-${{ env.IMAGE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.IMAGE_SHA }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.title=crowdrelay-worker
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}
          provenance: mode=max
          sbom: true
      - name: Build and publish Rekor proof anchor image
        id: rekor-image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: proofs/rekor-anchor/relayer
          platforms: linux/amd64
          push: true
          tags: >-
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/crowdrelay-rekor-proof-anchor:sha-${{ env.IMAGE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.IMAGE_SHA }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.title=crowdrelay-rekor-proof-anchor
          cache-from: type=gha,scope=crowdrelay-rekor-proof-anchor
          cache-to: type=gha,mode=max,scope=crowdrelay-rekor-proof-anchor
          provenance: mode=max
          sbom: true
      - name: Record immutable image digests
        env:
          API_DIGEST: ${{ steps.api-image.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker-image.outputs.digest }}
          REKOR_DIGEST: ${{ steps.rekor-image.outputs.digest }}
        run: |
          set -Eeuo pipefail
          mkdir -p image-digests
          for value in "$API_DIGEST" "$WORKER_DIGEST" "$REKOR_DIGEST"; do
            [[ "$value" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Invalid image digest: $value" >&2; exit 1; }
          done
          cat > image-digests/images.env <<EOF
          CROWDRELAY_RELEASE_SHA=${IMAGE_SHA}
          CROWDRELAY_API_DIGEST=${API_DIGEST}
          CROWDRELAY_WORKER_DIGEST=${WORKER_DIGEST}
          CROWDRELAY_REKOR_DIGEST=${REKOR_DIGEST}
          EOF
          sha256sum image-digests/images.env > image-digests/images.env.sha256

      - name: Upload immutable digest manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crowdrelay-image-digests-${{ env.IMAGE_SHA }}
          path: image-digests/
          if-no-files-found: error
          retention-days: 30
