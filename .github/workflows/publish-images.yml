name: Publish container images

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write
  actions: write

concurrency:
  group: publish-images-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
  # The Rust build graph is cached in GHCR rather than the Actions cache. The
  # Actions cache is a single 10 GB LRU pool shared with the Swatinem Rust
  # caches, so a mode=max BuildKit export kept evicting itself between runs and
  # every publish recompiled the workspace from scratch.
  # CACHE_REF and OWNER_LOWER are set in the first build step because Docker
  # requires lowercase repository names and GitHub org names are case-preserving.

jobs:
  # At 60-70 commits a day the single ARM runner cannot afford to build an
  # image for every green SHA — only the newest green ever reaches a deploy.
  # A publish that is already obsolete at pickup skips in seconds instead of
  # holding the queue for a ~20-minute build nobody will run.
  gate:
    name: Skip if superseded
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Check for a newer green CI run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          # A newer GREEN main CI run — proven work — supersedes this build.
          # Compare created_at against the triggering run, not "newest sha !=
          # mine": the API can take a minute to index the run that just fired
          # this trigger, and the sha comparison would then mistake an older
          # green for a newer one and skip the build a deploy is waiting on.
          # A newer push that has not passed CI does not suppress this build.
          triggered_at="${{ github.event.workflow_run.created_at }}"
          newer="$(gh api 'repos/${{ github.repository }}/actions/runs?workflow_id=ci.yml&branch=main&status=success&per_page=10' \
            --jq --arg ts "${triggered_at}" \
            '[.workflow_runs[] | select(.created_at > $ts)] | .[0].head_sha // ""' 2>/dev/null || echo "")"
          if [[ -n "$newer" ]]; then
            echo "::notice title=Superseded::CI for ${newer} is green; image build for ${IMAGE_SHA} is obsolete — skipping"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    # workflow_run already guarantees the source workflow is CI. Restrict the
    # release solely to a successful CI result for the repository default
    # branch; do not additionally key off the source event type, which can be
    # reported inconsistently by chained workflow executions and previously
    # caused a valid exact-main release to be skipped.
    if: >-
      needs.gate.outputs.proceed == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch

    # Production runs on virya-crowdrelay (linux/arm64, Ampere A1.Flex).
    # The image is built natively and pushed under an arch-suffixed tag;
    # the merge job joins it into the release tag the deploy resolves to.
    # QEMU is deliberately absent: emulating a Rust release build costs hours.
    # GitHub-hosted arm64 while the repos are public — native arm64 like the
    # self-hosted runner on virya-crowdrelay, but off the production box's
    # CPU. Move back to [self-hosted, arm64] when the repos go private.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Check out the exact validated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.IMAGE_SHA }}

      - name: Resolve immutable build identity
        shell: bash
        run: |
          set -Eeuo pipefail
          build_timestamp="$(git show -s --format=%cI "${IMAGE_SHA}")"
          [[ -n "$build_timestamp" ]] || { echo "Missing commit timestamp for ${IMAGE_SHA}" >&2; exit 1; }
          echo "BUILD_TIMESTAMP=${build_timestamp}" >> "$GITHUB_ENV"
          # Docker tags and cache refs must be lowercase, but GitHub org names
          # are case-preserving (e.g. "CrowdRelay"). Lowercase once here.
          owner_lower="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "OWNER_LOWER=${owner_lower}" >> "$GITHUB_ENV"
          echo "CACHE_REF=ghcr.io/${owner_lower}/crowdrelay-buildcache" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # API and worker descend from one `builder` stage. Two separate
      # build-push-action steps compiled that stage inside two buildx
      # invocations and each re-exported a mode=max Rust cache for it. Baking
      # both targets together builds the shared graph once and exports the
      # cache once.
      - name: Build and publish API and worker images
        id: images
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          API_IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER_LOWER }}/crowdrelay-api:sha-${{ env.IMAGE_SHA }}-arm64
          WORKER_IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER_LOWER }}/crowdrelay-worker:sha-${{ env.IMAGE_SHA }}-arm64
          CROWDRELAY_GIT_SHA: ${{ env.IMAGE_SHA }}
          CROWDRELAY_BUILD_TIMESTAMP: ${{ env.BUILD_TIMESTAMP }}
          # One cache tag per architecture. A shared tag would have the two
          # matrix legs overwrite each other's mode=max export every run.
          CACHE_REF: ${{ env.CACHE_REF }}:arm64
        with:
          files: docker-bake.hcl
          targets: api,worker
          set: |
            *.platform=linux/arm64
          push: true
          provenance: mode=max
          sbom: true

      - name: Prune stale BuildKit cache after build
        # Bounded, not scorched-earth: `--all` used to delete the cargo cache
        # mounts after every build and the next build re-downloaded every
        # crate. Keep 72h of warm cache; the host cron bounds it from there.
        if: always()
        continue-on-error: true
        run: docker builder prune --filter until=72h -f 2>/dev/null || true

      # Per-architecture digests are an intermediate product. The release
      # identity is the merged manifest list, so it is recorded in `merge`.
      - name: Record per-architecture digests
        env:
          BAKE_METADATA: ${{ steps.images.outputs.metadata }}
        run: |
          set -Eeuo pipefail
          # bake reports every target in one metadata document; pull each
          # digest out by target name rather than by step output.
          API_DIGEST="$(jq -er '.api["containerimage.digest"]' <<<"$BAKE_METADATA")"
          WORKER_DIGEST="$(jq -er '.worker["containerimage.digest"]' <<<"$BAKE_METADATA")"
          for value in "$API_DIGEST" "$WORKER_DIGEST"; do
            [[ "$value" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Invalid image digest: $value" >&2; exit 1; }
          done
          printf '%s api=%s worker=%s\n' "arm64" "$API_DIGEST" "$WORKER_DIGEST"

  # The proof anchor builds in its own job, with no edge to `merge`.
  #
  # It used to be a step inside `build`, and on 2026-09-12 its push failed with
  # `denied: permission_denied: write_package` — the repository's GITHUB_TOKEN
  # can write crowdrelay-api and crowdrelay-worker but not this package, which
  # is a GHCR package-access setting and not something this file can fix.
  # Because the step failed, the whole `build` job failed, `merge` was skipped
  # for `needs: build`, and the api and worker manifest lists were never
  # assembled. One unrelated image blocked the entire release: production could
  # only be updated by building locally and bypassing CI, which is exactly the
  # path that has no gates on it.
  #
  # `continue-on-error` would be the wrong fix. A broken anchor must stay loud —
  # this one already spent three days down behind a hostname nobody checked, and
  # the whole point of an anchor is that somebody notices when it stops. A
  # separate job keeps the failure red on the run while the release it has
  # nothing to do with proceeds.
  anchor:
    needs: gate
    if: >-
      needs.gate.outputs.proceed == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    name: Publish Rekor proof anchor
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Check out the exact validated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.IMAGE_SHA }}

      - name: Resolve immutable build identity
        shell: bash
        run: |
          set -Eeuo pipefail
          owner_lower="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "OWNER_LOWER=${owner_lower}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed straight to the release tag rather than an arch-suffixed one.
      # The anchor is arm64-only and is installed by `ops/rekor/install-anchor.sh`,
      # which pulls the tag by name — so it never needed the manifest merge that
      # coupled it to `merge` in the first place.
      - name: Build and publish Rekor proof anchor image
        id: rekor-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: proofs/rekor-anchor/relayer
          platforms: linux/arm64
          push: true
          tags: >-
            ${{ env.REGISTRY }}/${{ env.OWNER_LOWER }}/crowdrelay-rekor-proof-anchor:sha-${{ env.IMAGE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.IMAGE_SHA }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.title=crowdrelay-rekor-proof-anchor
          provenance: mode=max
          sbom: true

      - name: Prune stale BuildKit cache after build
        if: always()
        continue-on-error: true
        run: docker builder prune --filter until=72h -f 2>/dev/null || true

      - name: Record the anchor digest
        env:
          REKOR_DIGEST: ${{ steps.rekor-image.outputs.digest }}
        run: |
          set -Eeuo pipefail
          [[ "$REKOR_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Invalid anchor digest: $REKOR_DIGEST" >&2; exit 1; }
          printf 'arm64 rekor=%s\n' "$REKOR_DIGEST"

  merge:
    needs: [gate, build]
    if: needs.gate.outputs.proceed == 'true'
    name: Merge release manifests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The deploy tag must be one manifest list containing every production
      # platform. `ops/resolve-image-digests.sh` pulls this tag on the host and
      # records the index digest, so a host of either architecture resolves the
      # same release to the image built for it.
      - name: Merge per-architecture manifests into the release tag
        run: |
          set -Eeuo pipefail
          # Docker tags must be lowercase; GitHub org names are case-preserving.
          owner_lower="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          mkdir -p image-digests
          printf 'CROWDRELAY_RELEASE_SHA=%s\n' "${IMAGE_SHA}" > image-digests/images.env

          merge() {
            local repo="$1" var="$2" target digest platforms
            target="${REGISTRY}/${owner_lower}/${repo}:sha-${IMAGE_SHA}"
            docker buildx imagetools create --tag "$target" "${target}-arm64"

            digest="$(docker buildx imagetools inspect "$target" --format '{{.Manifest.Digest}}')"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "Invalid image digest for ${repo}: ${digest}" >&2; exit 1; }

            # An index missing a production platform is an undeployable release.
            platforms="$(docker buildx imagetools inspect "$target" --raw \
              | jq -r '[.manifests[].platform | select(.os == "linux")
                        | "\(.os)/\(.architecture)"] | unique | join(" ")')"
            for required in linux/arm64; do
              [[ " $platforms " == *" $required "* ]] || {
                echo "${repo}: published manifest lacks ${required} (has: ${platforms})" >&2; exit 1; }
            done

            printf '%s=%s\n' "$var" "$digest" >> image-digests/images.env
          }

          # The anchor is published by its own job, straight to the release tag,
          # and nothing in the deploy reads a rekor digest — `ops/rekor/install-anchor.sh`
          # pulls the tag by name. Merging it here only coupled the release to it.
          merge crowdrelay-api CROWDRELAY_API_DIGEST
          merge crowdrelay-worker CROWDRELAY_WORKER_DIGEST
          sha256sum image-digests/images.env > image-digests/images.env.sha256
          cat image-digests/images.env

      - name: Purge stale artifacts before upload
        # Account-wide Actions storage quota is tight; old dockerbuild
        # artifacts from previous runs linger until retention expires.
        # Delete them before uploading the current run's artifact — but
        # never digest/sbom artifacts: deploy.sh resolves releases by
        # artifact name, and at high commit velocity a 2h purge would
        # orphan the previous publish's ecosystem deploy mid-queue.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ids < <(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.workflow_run.id != ${GITHUB_RUN_ID}) | select(.name | test(\"digest|sbom\"; \"i\") | not) | select(.created_at < (now - 7200 | strftime("%Y-%m-%dT%H:%M:%SZ"))) | .id" 2>/dev/null || true)
          for id in "${ids[@]}"; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" 2>/dev/null || true
          done
          echo "Purged ${#ids[@]} stale artifact(s)"

      - name: Upload immutable digest manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crowdrelay-image-digests-${{ env.IMAGE_SHA }}
          path: image-digests/
          if-no-files-found: error
          retention-days: 3

      # GHCR packages inherit the org's default visibility (private) on first
      # publish. The production host pulls anonymously, so every package must
      # be public. This step is idempotent — PATCH with the same visibility is
      # a no-op once the package is already public.
      - name: Ensure package visibility is public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          owner_lower="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          for pkg in crowdrelay-api crowdrelay-worker crowdrelay-rekor-proof-anchor; do
            echo "Setting ${pkg} to public…"
            # The GITHUB_TOKEN in Actions has packages:write for the org's
            # packages, so this API call works without a PAT.
            gh api -X PATCH "/orgs/${owner_lower}/packages/container/${pkg}" \
              -f visibility=public 2>/dev/null \
              || gh api -X PATCH "/user/packages/container/${pkg}" \
              -f visibility=public 2>/dev/null \
              || echo "WARN: could not set ${pkg} visibility (may already be public or token lacks scope)"
          done

# Publication stops at the release manifest. Deployment is deliberately not a
# job here: production ships from the developer machine with `just ship`, which
# runs the gates, builds natively, pushes, and drives the digest-pinned
# blue-green cutover in scripts/deploy.sh. An auto-deploy job would deploy every
# green main commit, which is exactly what this repository does not want.
