name: Publish container images

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: publish-images-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
  CACHE_SCOPE: crowdrelay-images

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch

    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out the exact validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          platforms: linux/amd64
          push: true
          tags: >-
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/crowdrelay-api:sha-${{ env.IMAGE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.IMAGE_SHA }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.title=crowdrelay-api
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}
          provenance: mode=max
          sbom: true

      - name: Build and publish worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          platforms: linux/amd64
          push: true
          tags: >-
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/crowdrelay-worker:sha-${{ env.IMAGE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.IMAGE_SHA }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.title=crowdrelay-worker
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}
          provenance: mode=max
          sbom: true
      - name: Build and publish Rekor proof anchor image
        uses: docker/build-push-action@v6
        with:
          context: proofs/rekor-anchor/relayer
          platforms: linux/amd64
          push: true
          tags: >-
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/crowdrelay-rekor-proof-anchor:sha-${{ env.IMAGE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.IMAGE_SHA }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.title=crowdrelay-rekor-proof-anchor
          cache-from: type=gha,scope=crowdrelay-rekor-proof-anchor
          cache-to: type=gha,mode=max,scope=crowdrelay-rekor-proof-anchor
          provenance: mode=max
          sbom: true
