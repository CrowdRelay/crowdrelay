name: Runtime performance report

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      requests:
        description: Requests per bounded local benchmark run
        required: true
        default: "600"
      concurrency:
        description: Concurrent HTTP workers
        required: true
        default: "24"

permissions:
  contents: read

concurrency:
  group: runtime-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: crowdrelay
          POSTGRES_USER: crowdrelay
          POSTGRES_PASSWORD: crowdrelay-perf-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crowdrelay -d crowdrelay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CROWDRELAY_ENV: test
      CROWDRELAY_BIND_ADDR: 127.0.0.1:8080
      CROWDRELAY_DATABASE_URL: postgres://crowdrelay:crowdrelay-perf-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_TEST_DATABASE_URL: postgres://crowdrelay:crowdrelay-perf-only@127.0.0.1:5432/crowdrelay
      CROWDRELAY_DATABASE_MAX_CONNECTIONS: 12
      CROWDRELAY_ALLOWED_ORIGINS: http://localhost:4321
      CROWDRELAY_WORKSPACE_SLUG: example
      CROWDRELAY_PUBLIC_SITE_BASE_URL: http://localhost:4321
      CROWDRELAY_DEFAULT_COUNTRY_CODE: PL
      CROWDRELAY_TENANT_REGION: eu
      CROWDRELAY_TENANT_LOCALE: pl-PL
      CROWDRELAY_TENANT_TIMEZONE: Europe/Warsaw
      CROWDRELAY_TENANT_CURRENCY: PLN
      CROWDRELAY_TENANT_DATE_FORMAT: dmy
      CROWDRELAY_TENANT_NUMBER_FORMAT: comma_decimal
      CROWDRELAY_TENANT_DATA_REGION: eu
      CROWDRELAY_RANDOM_DRAWS_ENABLED: "false"
      CROWDRELAY_REQUIRE_DOUBLE_OPT_IN: "false"
      CROWDRELAY_BOOTSTRAP_JSON: >-
        {"workspace_name":"CrowdRelay Performance","cities":[{"slug":"wroclaw","name":"Wroclaw","country":"PL","region":"Dolnoslaskie","lat":51.1079,"lng":17.0385}],"campaigns":[{"name":"Performance","active":true,"smart_links":[{"slug":"perf","destination_url":"http://localhost:4321/join","active":true}]}],"webhook_endpoints":[]}
      RUST_LOG: warn
      REQUESTS: ${{ inputs.requests || '600' }}
      CONCURRENCY: ${{ inputs.concurrency || '24' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Activate repository-pinned Rust toolchain
        run: |
          rustc --version --verbose
          cargo --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Restore most recent passing performance baseline
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/performance-baseline.json
          key: crowdrelay-perf-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            crowdrelay-perf-${{ runner.os }}-${{ github.ref_name }}-
      - name: Preserve restored baseline as evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [[ -f artifacts/performance-baseline.json ]]; then
            cp artifacts/performance-baseline.json artifacts/performance-previous-baseline.json
          fi
      - name: Set up PostgreSQL 18 schema and workspace
        run: cargo run --locked --release --package crowdrelay-worker -- setup
      - name: Build API once in release mode
        run: cargo build --locked --release --package crowdrelay-api
      - name: Start API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          target/release/crowdrelay-api > artifacts/crowdrelay-api.log 2>&1 &
          echo "$!" > artifacts/crowdrelay-api.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/v1/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat artifacts/crowdrelay-api.log >&2
          exit 1
      - name: Run three bounded benchmark samples
        shell: bash
        run: |
          set -euo pipefail
          for run in 1 2 3; do
            python3 scripts/benchmark-http.py \
              --requests "$REQUESTS" \
              --concurrency "$CONCURRENCY" \
              --output "artifacts/http-benchmark-run-${run}.json"
          done
      - name: Aggregate runner-noise-resistant candidate
        run: |
          python3 scripts/aggregate-benchmarks.py \
            artifacts/http-benchmark-run-1.json \
            artifacts/http-benchmark-run-2.json \
            artifacts/http-benchmark-run-3.json \
            --output artifacts/http-benchmark.json
      - name: Compare with previous passing baseline
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f artifacts/performance-previous-baseline.json ]]; then
            python3 scripts/compare-performance.py \
              --candidate artifacts/http-benchmark.json \
              --baseline artifacts/performance-previous-baseline.json \
              --max-latency-regression-pct 25 \
              --max-rps-drop-pct 20 \
              --latency-noise-floor-ms 15 \
              --output artifacts/performance-comparison.json
          else
            printf '%s\n' '{"schema":1,"status":"seed","reason":"no-previous-passing-baseline"}' \
              > artifacts/performance-comparison.json
            echo "PERFORMANCE_REGRESSION=SEED no_previous_baseline=true"
          fi
      - name: Promote passing candidate to next baseline
        run: cp artifacts/http-benchmark.json artifacts/performance-baseline.json
      - name: Capture final Prometheus snapshot
        if: always()
        run: curl --fail --silent http://127.0.0.1:8080/metrics > artifacts/metrics.prom || true
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crowdrelay-performance-${{ github.sha }}-${{ github.run_id }}
          path: |
            artifacts/http-benchmark*.json
            artifacts/performance-*.json
            artifacts/metrics.prom
            artifacts/crowdrelay-api.log
          if-no-files-found: warn
          retention-days: 30
