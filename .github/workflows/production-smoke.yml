name: Production smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "7 */6 * * *"

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: External ecosystem smoke
    if: ${{ vars.CROWDRELAY_PRODUCTION_BASE_URL != '' && vars.VIRYA_PRODUCTION_BASE_URL != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CROWDRELAY_BASE_URL: ${{ vars.CROWDRELAY_PRODUCTION_BASE_URL }}
      VIRYA_BASE_URL: ${{ vars.VIRYA_PRODUCTION_BASE_URL }}
      SYNESTHESIA_BASE_URL: ${{ vars.SYNESTHESIA_PRODUCTION_BASE_URL || 'https://synesthesia.virya.music' }}
      N8N_INGRESS_URL: ${{ vars.N8N_PRODUCTION_INGRESS_URL }}
      ALERT_WEBHOOK_URL: ${{ secrets.PRODUCTION_DISCORD_WEBHOOK_URL }}

    steps:
      - name: Check out smoke probes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Probe CrowdRelay, Virya, Synesthesia, and signed ingress
        run: ./scripts/production-smoke.sh

      - name: Exercise production-safe Synesthesia lifecycle
        run: ./scripts/synesthesia-production-canary.sh

      - name: Alert Discord on failure
        if: ${{ failure() && env.ALERT_WEBHOOK_URL != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          payload="$(jq -n \
            --arg content "🚨 Virya production smoke failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{content: $content}')"
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --max-time 15 \
            --header 'content-type: application/json' \
            --data "$payload" \
            "$ALERT_WEBHOOK_URL"
