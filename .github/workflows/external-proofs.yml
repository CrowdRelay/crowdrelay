name: External proofs

on:
  pull_request:
    paths:
      - "blockchain/proof-anchor/**"
      - "crates/crowdrelay-api/src/proofs.rs"
      - "crates/crowdrelay-worker/src/draws.rs"
      - "migrations/0020_external_proofs.sql"
      - "scripts/verify-external-proof.py"
      - ".github/workflows/external-proofs.yml"
  push:
    branches: [main]
    paths:
      - "blockchain/proof-anchor/**"
      - "crates/crowdrelay-api/src/proofs.rs"
      - "crates/crowdrelay-worker/src/draws.rs"
      - "migrations/0020_external_proofs.sql"
      - "scripts/verify-external-proof.py"
      - ".github/workflows/external-proofs.yml"

concurrency:
  group: external-proofs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 -m py_compile scripts/verify-external-proof.py
      - run: python3 scripts/verify-external-proof.py self-test

  relayer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blockchain/proof-anchor/relayer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check index.mjs && node --check proof-utils.mjs
      - run: node --test proof-utils.test.mjs
      - run: docker build --tag virya-proof-anchor-relayer:test .

  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blockchain/proof-anchor/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge install OpenZeppelin/openzeppelin-contracts@v5.6.1 --no-commit
      - run: forge install foundry-rs/forge-std --no-commit
      - run: forge fmt --check
      - run: forge test -vv
