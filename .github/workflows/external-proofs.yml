name: External proofs

on:
  pull_request:
    paths:
      - "proofs/rekor-anchor/**"
      - "crates/crowdrelay-api/src/proofs.rs"
      - "crates/crowdrelay-worker/src/draws.rs"
      - "migrations/0020_external_proofs.sql"
      - "migrations/0021_rekor_proof_anchor.sql"
      - "scripts/verify-external-proof.py"
      - "scripts/verify-rekor-proof.mjs"
      - ".github/workflows/external-proofs.yml"
  push:
    branches: [main]
    paths:
      - "proofs/rekor-anchor/**"
      - "crates/crowdrelay-api/src/proofs.rs"
      - "crates/crowdrelay-worker/src/draws.rs"
      - "migrations/0020_external_proofs.sql"
      - "migrations/0021_rekor_proof_anchor.sql"
      - "scripts/verify-external-proof.py"
      - "scripts/verify-rekor-proof.mjs"
      - ".github/workflows/external-proofs.yml"

concurrency:
  group: external-proofs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  local-proof-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python3 -m py_compile scripts/verify-external-proof.py
      - run: python3 scripts/verify-external-proof.py self-test

  rekor-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: node --check scripts/verify-rekor-proof.mjs
      - run: node scripts/verify-rekor-proof.mjs self-test

  rekor-anchor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proofs/rekor-anchor/relayer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: node --check index.mjs && node --check proof-utils.mjs && node --check batch-runner.mjs
      - run: node --test *.test.mjs
      - run: docker build --tag virya-rekor-proof-anchor:test .
