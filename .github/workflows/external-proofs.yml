name: External proofs

on:
  pull_request:
    paths:
      - "proofs/rekor-anchor/**"
      - "crates/crowdrelay-api/src/proofs.rs"
      - "crates/crowdrelay-api/src/proofs/**"
      - "crates/crowdrelay-worker/src/draws.rs"
      - "crates/crowdrelay-worker/src/draws/**"
      - "migrations/0020_external_proofs.sql"
      - "migrations/0021_rekor_proof_anchor.sql"
      - "scripts/verify-external-proof.py"
      - "scripts/verify-rekor-proof.mjs"
      - ".github/workflows/external-proofs.yml"
  push:
    branches: [main]
    paths:
      - "proofs/rekor-anchor/**"
      - "crates/crowdrelay-api/src/proofs.rs"
      - "crates/crowdrelay-api/src/proofs/**"
      - "crates/crowdrelay-worker/src/draws.rs"
      - "crates/crowdrelay-worker/src/draws/**"
      - "migrations/0020_external_proofs.sql"
      - "migrations/0021_rekor_proof_anchor.sql"
      - "scripts/verify-external-proof.py"
      - "scripts/verify-rekor-proof.mjs"
      - ".github/workflows/external-proofs.yml"

concurrency:
  group: external-proofs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  proof-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - run: python3 scripts/verify-external-proof.py self-test
      - run: node scripts/verify-rekor-proof.mjs self-test
      - run: node --check index.mjs && node --test *.test.mjs
        working-directory: proofs/rekor-anchor/relayer
      - run: docker build --tag virya-rekor-proof-anchor:test .
        working-directory: proofs/rekor-anchor/relayer
