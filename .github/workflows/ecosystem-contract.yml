name: Ecosystem contract

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "openapi/**"
      - "integration/ecosystem/**"
      - "crates/crowdrelay-api/src/meta.rs"
      - "crates/crowdrelay-api/src/routing.rs"
      - "scripts/test-ecosystem-contract-v2.py"
      # The agent-service pairing gates, and every file they read. Without these
      # the job runs only when the OpenAPI or this workflow changes — so lowering
      # a timeout in community_executor.rs, or adding a WorkerTemplate slug, would
      # not run the gate that exists to catch exactly that.
      - "scripts/test_agents_timeout_parity_v1.py"
      - "scripts/test_agents_template_parity_v1.py"
      - "scripts/test_agents_platform_parity_v1.py"
      - "crates/crowdrelay-domain/src/worker_template.rs"
      - "crates/crowdrelay-worker/src/community_join_executor.rs"
      - "crates/crowdrelay-worker/src/community_executor.rs"
      - "crates/crowdrelay-worker/src/discovery.rs"
      - "crates/crowdrelay-worker/src/social_post_executor.rs"
      - "crates/crowdrelay-worker/src/telegram_executor.rs"
      - "crates/crowdrelay-worker/src/discord_executor.rs"
      - "crates/crowdrelay-worker/src/community_intelligence/reddit.rs"
      - ".github/workflows/ecosystem-contract.yml"
  pull_request:
    paths:
      - "openapi/**"
      - "integration/ecosystem/**"
      - "crates/crowdrelay-api/src/meta.rs"
      - "crates/crowdrelay-api/src/routing.rs"
      - "scripts/test-ecosystem-contract-v2.py"
      # The agent-service pairing gates, and every file they read. Without these
      # the job runs only when the OpenAPI or this workflow changes — so lowering
      # a timeout in community_executor.rs, or adding a WorkerTemplate slug, would
      # not run the gate that exists to catch exactly that.
      - "scripts/test_agents_timeout_parity_v1.py"
      - "scripts/test_agents_template_parity_v1.py"
      - "scripts/test_agents_platform_parity_v1.py"
      - "crates/crowdrelay-domain/src/worker_template.rs"
      - "crates/crowdrelay-worker/src/community_join_executor.rs"
      - "crates/crowdrelay-worker/src/community_executor.rs"
      - "crates/crowdrelay-worker/src/discovery.rs"
      - "crates/crowdrelay-worker/src/social_post_executor.rs"
      - "crates/crowdrelay-worker/src/telegram_executor.rs"
      - "crates/crowdrelay-worker/src/discord_executor.rs"
      - "crates/crowdrelay-worker/src/community_intelligence/reddit.rs"
      - ".github/workflows/ecosystem-contract.yml"

permissions:
  contents: read

concurrency:
  group: ecosystem-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-consumers:
    name: Signal + Synesthesia compatibility
    runs-on: [self-hosted, arm64]
    timeout-minutes: 10
    steps:
      - name: Check out CrowdRelay under canonical ecosystem layout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: crowdrelay

      # Consumers may be private, so a PAT (CROWDRELAY_PAT) with org-wide read
      # access is used instead of the default GITHUB_TOKEN. The PAT is stored
      # as a repo secret and reads both public and private repos.
      - name: Check out Virya Signal consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CrowdRelay/virya-signal
          ref: main
          path: virya-signal
          token: ${{ secrets.CROWDRELAY_PAT }}
          persist-credentials: false

      - name: Check out Synesthesia consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CrowdRelay/synesthesia
          ref: main
          path: synesthesia
          token: ${{ secrets.CROWDRELAY_PAT }}
          persist-credentials: false

      - name: Verify current consumers against this CrowdRelay revision
        run: python3 crowdrelay/scripts/test-ecosystem-contract-v2.py

      # Virya web is private and intentionally not coupled to an extra PAT here.
      # Its reciprocal upstream-contract workflow checks current CrowdRelay main
      # on every relevant change and on the same six-hour cadence.

  agents-pairing:
    name: Agent service pairing
    runs-on: [self-hosted, arm64]
    timeout-minutes: 10
    steps:
      # Three gates compare a list here against a list in crowdrelay-agents:
      # the HTTP timeouts against the browser budgets, `WorkerTemplate` against
      # the template catalog, and the draft platform enum against the executors
      # that claim it. Each skips when the sibling checkout is absent, so without
      # this job they only ever ran on the build host — and a contributor who
      # does not have crowdrelay-agents beside this repository got no protection
      # from any of them.
      #
      # All three exist because a pair of lists in two repositories drifted and
      # nothing failed: 16 wasted dispatches against a disabled template, and an
      # out-of-memory browser that the caller's clock reported as a bare timeout.
      # A gate that only runs in one place is halfway back to that.
      - name: Check out CrowdRelay under canonical ecosystem layout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: crowdrelay

      # `..` from the CrowdRelay checkout, which is the layout the gates resolve.
      - name: Check out the agent service
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CrowdRelay/crowdrelay-agents
          ref: main
          path: crowdrelay-agents
          token: ${{ secrets.CROWDRELAY_PAT }}
          persist-credentials: false

      # Asserting they did not skip is the point. Each gate answers "no sibling
      # checkout" by skipping, so a checkout that silently failed would leave
      # this job green while checking nothing — the exact shape of failure the
      # gates are here to prevent.
      - name: Verify the agent service pairing
        working-directory: crowdrelay/scripts
        run: |
          set -Eeuo pipefail
          for gate in test_agents_timeout_parity_v1 \
                      test_agents_template_parity_v1 \
                      test_agents_platform_parity_v1; do
            printf '==> %s\n' "$gate"
            python3 -m unittest "$gate" -v 2>&1 | tee /tmp/"$gate".log
            if grep -q 'skipped=' /tmp/"$gate".log; then
              echo "$gate skipped — the agents checkout is missing or moved" >&2
              exit 1
            fi
          done

  # When the OpenAPI spec changes on main, send a repository_dispatch event to
  # each downstream repo so it can auto-regenerate its contract files and open
  # a PR. This closes the manual-sync gap that caused stale SHA markers.
  # Requires a PAT with repo:dispatch scope stored as CROWDRELAY_CONTRACT_PAT.
  # The PAT must have access to CrowdRelay/virya (private) for the dispatch to
  # reach it; if not, virya's polling upstream-contract workflow is the fallback.
  # If the secret is absent entirely, the job is skipped — downstream repos
  # still have their polling upstream-contract workflows as a fallback.
  propagate:
    name: Notify downstream repos
    runs-on: [self-hosted, arm64]
    timeout-minutes: 5
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: public-consumers
    steps:
      - name: Check out CrowdRelay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: crowdrelay

      - name: Compute OpenAPI SHA and send dispatch
        env:
          GH_TOKEN: ${{ secrets.CROWDRELAY_CONTRACT_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "CROWDRELAY_CONTRACT_PAT not set — skipping dispatch (downstream polling will catch up)"
            exit 0
          fi
          OPENAPI_SHA="$(sha256sum crowdrelay/openapi/openapi.yaml | awk '{print $1}')"
          CROWDRELAY_SHA="${{ github.sha }}"
          echo "OpenAPI SHA256: $OPENAPI_SHA"
          echo "CrowdRelay commit: $CROWDRELAY_SHA"

          for repo in CrowdRelay/virya-signal CrowdRelay/virya CrowdRelay/synesthesia; do
            echo "==> Sending repository_dispatch to $repo"
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/$repo/dispatches" \
              -f event_type=crowdrelay-contract-propagated \
              -f "client_payload[openapi_sha]=$OPENAPI_SHA" \
              -f "client_payload[crowdrelay_sha]=$CROWDRELAY_SHA" \
              || echo "WARN: dispatch to $repo failed (repo may not exist or token lacks scope)"
          done
