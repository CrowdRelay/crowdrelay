services:
  api:
    environment:
      CROWDRELAY_CONTROL_PLANE_AREA_API_KEY: ${CROWDRELAY_CONTROL_PLANE_AREA_API_KEY:?AREA API key missing}
      CROWDRELAY_CONTROL_PLANE_API_KEY: ${CROWDRELAY_CONTROL_PLANE_API_KEY:?Control Plane API key missing}

  area-management-proxy:
    image: caddy@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped

    # Docker Compose includes labels in the service config hash. Coupling this
    # label to the exact tracked Caddyfile digest makes a normal
    # `crowdrelayctl deploy` recreate the proxy whenever its routing contract
    # changes, instead of leaving a process running an older bind-mounted file.
    labels:
      org.crowdrelay.area-management-config-sha256: "${CROWDRELAY_AREA_MANAGEMENT_CONFIG_SHA256:?management config digest required}"

    depends_on:
      api:
        condition: service_healthy

    ports:
      - "${CROWDRELAY_AREA_MANAGEMENT_BIND_IP:?AREA management bind IP missing}:18080:18080/tcp"

    volumes:
      - ./deploy/area-management.Caddyfile:/etc/caddy/Caddyfile:ro

    healthcheck:
      # This is intentionally end-to-end: Caddy must accept the request and
      # the upstream CrowdRelay API must report ready before Compose marks the
      # management proxy healthy.
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1:18080/healthz/ready"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s

    read_only: true

    tmpfs:
      - /data
      - /config
      - /tmp

    cap_drop:
      - ALL

    cap_add:
      - NET_BIND_SERVICE

    security_opt:
      - no-new-privileges:true

    pids_limit: 64
    mem_limit: 64m
    cpus: 0.10

    networks:
      runtime: {}
      # The control plane runs in its own compose project on the same host and
      # reaches management through this network. Before the move to
      # virya-crowdrelay it crossed a WireGuard link from virya-home instead.
      area-management:
        aliases: [area-management-proxy]

networks:
  area-management:
    external: true
    name: ${VIRYA_EDGE_NETWORK:-virya-edge}
