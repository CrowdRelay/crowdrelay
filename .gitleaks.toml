title = "CrowdRelay gitleaks config"

[allowlist]
description = "Allowlist false-positive test keys, template keys, metric keys, and container names"
paths = [
  '''crates/crowdrelay-infra/src/config/tests\.rs''',
  '''crates/crowdrelay-infra/src/config\.rs''',
  '''crates/crowdrelay-api/src/lib_tests\.rs''',
  '''crates/crowdrelay-api/src/lib\.rs''',
  '''crates/crowdrelay-infra/tests/.*\.rs''',
  '''crates/crowdrelay-worker/src/push_delivery/crypto\.rs''',
  '''scripts/deploy-bluegreen\.sh''',
  '''migrations/.*\.sql''',
  '''packages/crowdrelay-js/src/index\.ts''',
  '''integration/virya/src/lib/crowdrelay-client\.ts''',
]
regexes = [
  '''test-staff-api-key-12345678901234567890''',
  '''test-commerce-api-key-1234567890''',
  '''coupon-redeem-test-0001''',
  '''effect\.incremental_fan_growth_14d''',
  '''activated_fans_30d''',
  '''outreach\.press\.v1''',
  '''growth\.debt\.v1''',
  '''crowdrelay-api-green-1''',
  '''crowdrelay-api-1''',
  '''BEGIN PRIVATE KEY''',
  '''openapi-sha256:''',
]
