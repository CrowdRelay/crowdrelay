services:
  proof-anchor-relayer:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    volumes:
      - ./state:/data
    secrets:
      - crowdrelay_commerce_api_key
      - evm_anchor_private_key
      - evm_rpc_url
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 192m
    cpus: 0.50
    ports:
      - 127.0.0.1:8081:8081
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

secrets:
  crowdrelay_commerce_api_key:
    file: ./secrets/crowdrelay_commerce_api_key
  evm_anchor_private_key:
    file: ./secrets/evm_anchor_private_key
  evm_rpc_url:
    file: ./secrets/evm_rpc_url
