[workspace]
resolver = "2"
members = [
  "crates/crowdrelay-api",
  "crates/crowdrelay-worker",
  "crates/crowdrelay-domain",
  "crates/crowdrelay-brain",
  "crates/crowdrelay-application",
  "crates/crowdrelay-infra",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "1.0.0"
authors = ["Wojciech Bator"]
repository = "https://github.com/CrowdRelay/crowdrelay"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chacha20poly1305 = "0.10"
getrandom = "0.4"
hmac = "0.12"
ring = "0.17"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# `macros` is required by #[derive(sqlx::FromRow)] on row structs. It does NOT
# pull in the DATABASE_URL-dependent query! macros: this repo only uses runtime
# sqlx::query/query_as, so no .sqlx offline cache is needed to build or clippy.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "time", "migrate", "macros"] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "serde-well-known", "formatting", "parsing"] }
time-tz = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["serde", "v7"] }
zeroize = "1"

# Dev and test builds carried full debug info, which dominates codegen, link time
# and the on-disk target tree that CI caches save and restore. Line tables keep
# file/line in panics, backtraces and profiles, which is what this backend is
# actually debugged with; full variable inspection in a debugger is the trade.
# Neither profile affects the release artifact.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

# Fat LTO with a single codegen unit re-optimised the entire dependency graph
# at final link time, single-threaded, on every source change. `cargo chef`
# cannot cache that: it happens after the cached dependency layer, so every
# image build paid it in full. Thin LTO keeps cross-crate inlining and runs the
# optimisation in parallel; codegen-units returns to the default so codegen
# stops being serialised. `strip` and `panic` carry the size and unwind
# guarantees and are unchanged.
[profile.release]
lto = "thin"
strip = "symbols"
panic = "unwind"
